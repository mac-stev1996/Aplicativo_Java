<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    template="/jsf/templates/bodyTemplate.xhtml">

    <ui:define name="title">Documentos Cliente</ui:define>

    <ui:define name="buttons">
        <h:form id="formBotones">
            <p:commandButton value="Buscar" icon="fa fa-search"
                styleClass="teal-btn"
                type="button"
                onclick="document.getElementById('formDocumentos:btnBuscar').click();" />
            <p:commandButton value="Limpiar" icon="fa fa-times"
                styleClass="orange-btn"
                type="button"
                onclick="document.getElementById('formDocumentos:btnLimpiar').click();" />
        </h:form>
    </ui:define>

    <ui:define name="content">
        <h:form id="formDocumentos">
            <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" />

            <p:commandButton id="btnBuscar" style="display:none;"
                action="#{documentosClienteController.buscar()}"
                update="@form"
                process="@form" />
            <p:commandButton id="btnLimpiar" style="display:none;"
                action="#{documentosClienteController.limpiar()}"
                update="@form"
                process="@form" />

            <ui:fragment rendered="#{documentosClienteController.sinModulos}">
                <div class="ui-g dashboard">
                    <div class="ui-g-12">
                        <p:panel style="border:1px solid #f0ad4e; background:#fcf8e3; color:#8a6d3b;">
                            <h:outputText value="Su usuario no tiene módulos de documentos asignados. Contacte al administrador." />
                        </p:panel>
                    </div>
                </div>
            </ui:fragment>

            <ui:fragment rendered="#{!documentosClienteController.sinModulos}">

                <div style="display:flex; align-items:center; gap:12px; margin-top:30px; margin-bottom:30px; margin-left:10px;">
                    <p:outputLabel for="identificacion" value="Identificación:" styleClass="bold"
                        style="white-space:nowrap;" />
                    <p:inputText id="identificacion"
                        value="#{documentosClienteController.identificacionBusqueda}"
                        maxlength="20" style="width:180px;" />
                    <p:outputLabel for="estado" value="Estado:" styleClass="bold"
                        style="white-space:nowrap;" />
                    <p:selectOneMenu id="estado"
                        value="#{documentosClienteController.estadoBusqueda}"
                        style="width:120px;">
                        <f:selectItems value="#{documentosClienteController.itemsEstado}" />
                    </p:selectOneMenu>
                </div>

                <div class="ui-g dashboard">
                    <div class="ui-g-12">
                        <p:tabView id="tabModulos">
                            <c:forEach items="#{documentosClienteController.modulosConDocumentos}"
                                       var="item" varStatus="loop">
                                <p:tab id="tab#{loop.index}"
                                       title="#{documentosClienteController.tituloTab(item)}">

                                    <p:dataTable id="tblDocs#{loop.index}"
                                        var="doc"
                                        value="#{item.documentos}"
                                        emptyMessage="No se encontraron documentos para esta identificación."
                                        styleClass="hover-rows table table-body tbl-header-height"
                                        rowIndexVar="rowIndex"
                                        paginator="true" rows="10"
                                        paginatorPosition="bottom"
                                        paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}">

                                        <p:column headerText="N°" style="width:50px; text-align:center;">
                                            <h:outputText value="#{rowIndex + 1}" />
                                        </p:column>

                                        <p:column headerText="Tipo">
                                            <h:outputText value="#{doc.tipoDoc}" />
                                        </p:column>

                                        <p:column headerText="Nombre del archivo">
                                            <h:outputText value="#{doc.nombreArchivo}" />
                                        </p:column>                                       

                                        <p:column headerText="Fecha" style="width:120px;">
                                            <h:outputText value="#{doc.fechaIngresoDoc}" />
                                        </p:column>

                                        <p:column headerText="Descargar" style="width:110px; text-align:center;">
                                            <p:commandButton value="Descargar" icon="fa fa-download"
                                                styleClass="green-btn"
                                                ajax="false"
                                                actionListener="#{documentosClienteController.descargarDocumento(doc.pathDoc)}" />
                                        </p:column>

                                    </p:dataTable>

                                </p:tab>
                            </c:forEach>
                        </p:tabView>
                    </div>
                </div>

            </ui:fragment>

        </h:form>
    </ui:define>

</ui:composition>
