<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:composite="http://java.sun.com/jsf/composite"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<h:outputStylesheet name="css/layout-lightblue.css"
		library="serenity-layout" />
</h:head>
<h:body>
	<h:form id="form">
		<p:panel header="Reporte de tareas NPS" style="font-size:15px;">
			<b><p:messages id="messages" showDetail="true" autoUpdate="true"
					closable="true" /></b>
			<center>
				<p:panelGrid id="panelDataReport" columns="2">
					<h:outputText value="Fecha Desde:" />
					<p:calendar pattern="dd/MM/yyyy" showOn="button"
						value="#{repTareasNPSController.fechaDesde}"></p:calendar>

					<h:outputText value="Fecha Hasta:" />
					<p:calendar pattern="dd/MM/yyyy" showOn="button"
						value="#{repTareasNPSController.fechaHasta}"></p:calendar>
				</p:panelGrid>

				<p:commandButton value="Excel"
					style="margin-top:15px; margin-right: 15px;"
					icon="fa fa-file-excel-o" styleClass="green-btn" ajax="false"
					onclick="form.target='_blank'" process="@this, idForm:pnDownReport"
					partialSubmit="true" update="@this"
					actionListener="#{repTareasNPSController.descargarReporte()}">
					<f:param name="format" value="excel" />
				</p:commandButton>

				<p:commandButton value="PDF" style="margin-top:15px;"
					icon="fa fa-file-pdf-o" styleClass="blue-btn" ajax="false"
					onclick="form.target='_blank'" process="@this, idForm:pnDownReport"
					update="@this"
					actionListener="#{repTareasNPSController.descargarReporte()}">
					<f:param name="format" value="pdf" />
				</p:commandButton>

			</center>
		</p:panel>
		<h:inputHidden value="/reportes/reporteTareasNPS.jasper"
			binding="#{repTareasNPSController.reportPath}" />
	</h:form>
</h:body>
</html>
