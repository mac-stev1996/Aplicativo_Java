name: Diagnóstico SonarQube

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar directorio y POM
        shell: powershell
        run: |
          Write-Host "================================="
          Write-Host "DIRECTORIO ACTUAL"
          Write-Host "================================="
          Get-Location

          Write-Host ""
          Write-Host "================================="
          Write-Host "CONTENIDO DEL REPOSITORIO"
          Write-Host "================================="
          Get-ChildItem -Force

          Write-Host ""
          Write-Host "================================="
          Write-Host "POM.XML ENCONTRADOS"
          Write-Host "================================="

          Get-ChildItem -Path . -Filter pom.xml -Recurse -File |
            Select-Object -ExpandProperty FullName

      - name: Verificar Java
        shell: powershell
        run: |
          Write-Host "================================="
          Write-Host "JAVA"
          Write-Host "================================="
          java -version

      - name: Verificar Maven
        shell: powershell
        run: |
          Write-Host "================================="
          Write-Host "MAVEN"
          Write-Host "================================="
          mvn -version

      - name: Verificar SonarQube
        shell: powershell
        run: |
          Write-Host "================================="
          Write-Host "SONARQUBE"
          Write-Host "================================="
          Write-Host "Verificando localhost:9002..."

          $result = Test-NetConnection localhost -Port 9002

          if ($result.TcpTestSucceeded) {
              Write-Host "OK - SonarQube está accesible en localhost:9002"
          }
          else {
              Write-Host "ERROR - SonarQube NO está accesible en localhost:9002"
              exit 1
          }
