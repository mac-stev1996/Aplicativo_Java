name: Diagnóstico SonarQube

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verificar Java
        shell: powershell
        run: |
          Write-Host "JAVA_HOME:"
          Write-Host $env:JAVA_HOME

          Write-Host ""
          java -version

      - name: Verificar Maven
        shell: powershell
        run: |
          Write-Host "JAVA_HOME:"
          Write-Host $env:JAVA_HOME

          Write-Host ""
          mvn -version
