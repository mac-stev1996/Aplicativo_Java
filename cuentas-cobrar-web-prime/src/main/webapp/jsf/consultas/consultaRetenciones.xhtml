<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/jsf/templates/bodyTemplate.xhtml">

	<ui:define name="title">
		Consulta de retenciones
	</ui:define>

	<ui:define name="buttons">
		<p:commandButton icon="fa fa-undo" partialSubmit="true"
			process="@this, :frmConsultaRet"
			actionListener="#{consultaRetencionController.limpiarDatos}"
			title="limpiar datos consulta" update=":frmConsultaRet" />
	</ui:define>

	<ui:define name="content">
		<style type="text/css">
body {
	font-size: 11px !important;
}

body .ui-datatable thead th {
	background-color: #0288d1 !important;
}
</style>
		<h:form id="frmConsultaRet">
			<p:panelGrid id="pnlBusqueda" style="width:50%">
				<p:row>
					<p:column>
						<p:commandLink title="Seleccionar cliente"
							action="#{consultaRetencionController.cargarClientes}"
							value="Cliente:" style="font-weight:bold;" update=":frmClientes" />
					</p:column>
					<p:column>
						<p:outputPanel autoUpdate="true">
							<p:inputText value="#{consultaRetencionController.noCliente}"
								readonly="true" />
						</p:outputPanel>
					</p:column>
					<p:column>
						<p:outputLabel value="Número Ret.:" styleClass="bold" />
					</p:column>
					<p:column>
						<p:inputNumber value="#{consultaRetencionController.numeroRet}"
							maxlength="20" decimalPlaces="0" thousandSeparator=""
							decimalSeparator="" />
					</p:column>
					<p:column>
						<p:outputLabel value="Monto:" styleClass="bold" />
					</p:column>
					<p:column>
						<p:inputNumber value="#{consultaRetencionController.monto}"
							decimalPlaces="2" />
					</p:column>
					<p:column>
						<p:outputLabel value="Factura:" styleClass="bold" />
					</p:column>
					<p:column>
						<p:inputNumber value="#{consultaRetencionController.numeroFact}"
							maxlength="20" decimalPlaces="0" thousandSeparator=""
							decimalSeparator="" />
					</p:column>

					<p:column>
						<p:commandButton value="Consultar" partialSubmit="true"
							actionListener="#{consultaRetencionController.consultar}"
							update=":#{p:component('dtRetenciones')}" icon="ui-icon-search" />
					</p:column>
				</p:row>
			</p:panelGrid>
			<p:dataTable id="dtRetenciones"
				value="#{consultaRetencionController.retencionesLazyDataModel}"
				var="item" rowKey="#{item.pk}" rowIndexVar="row"
				emptyMessage="No existen retenciones a mostrar"
				paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
				paginator="true" rows="20" rowsPerPageTemplate="20,30,40"
				paginatorPosition="bottom" widgetVar="idRetenciones" lazy="true">

				<p:column headerText="Agencia" width="5%">
					<p:outputLabel value="#{item.centro}" />
				</p:column>
				<p:column headerText="Cliente" width="5%">
					<p:outputLabel value="#{item.pk.noCliente}" />
				</p:column>
				<p:column headerText="Cedula" width="9%">
					<p:outputLabel value="#{item.cedula}" />
				</p:column>
				<p:column headerText="Nombre" width="20%">
					<p:outputLabel value="#{item.nombre}" />
				</p:column>
				<p:column headerText="Fecha" width="7%">
					<p:outputLabel value="#{item.fecha}">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</p:outputLabel>
				</p:column>
				<p:column headerText="Fecha Ret." width="7%">
					<p:outputLabel value="#{item.fechaEmiRet}">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</p:outputLabel>
				</p:column>

				<p:column headerText="Clave" width="4%">
					<p:outputLabel value="#{item.clave}" />
				</p:column>

				<p:column headerText="Numero Ret." width="7%">
					<p:outputLabel value="#{item.numero}" />
				</p:column>
				<p:column headerText="Monto" width="8%">
					<p:outputLabel value="#{item.monto}" style="float:right" />
				</p:column>
				<p:column headerText="% Ret." width="4%">
					<p:outputLabel value="#{item.porcentaje}" />
				</p:column>
				<p:column headerText="Factura" width="8%">
					<p:outputLabel value="#{item.noRefe}" />
				</p:column>
				<p:column headerText="Ingreso" width="10%">
					<p:outputLabel value="#{item.ingreso eq '-'?'':item.ingreso}" />
				</p:column>
				<p:column headerText="Origen" width="8%">
					<p:outputLabel value="#{item.origen}" style="color:#{item.origen eq 'Diarios A'?'green':'blue'} !important"/>
				</p:column>

			</p:dataTable>
		</h:form>
		<ui:include src="/jsf/common/dialog/dialogClientes.xhtml" />
	</ui:define>
</ui:composition>
