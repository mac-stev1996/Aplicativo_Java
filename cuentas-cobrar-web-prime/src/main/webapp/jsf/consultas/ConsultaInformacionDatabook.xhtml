<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<style type="text/css">
body {
	font-size: 10px;
}

body .ui-toolbar {
	padding: 5px;
}

.columAlignCenter {
	text-align: center;
}

.columAlignRight {
	text-align: right;
}
</style>
	<script type="text/javascript">
		PrimeFaces.locales["es"] = {
			closeText : "Cerrar",
			prevText : "Anterior",
			nextText : "Siguiente",
			monthNames : [ "Enero", "Febrero", "Marzo", "Abril", "Mayo",
					"Junio", "Julio", "Agosto", "Septiembre", "Octubre",
					"Noviembre", "Diciembre" ],
			monthNamesShort : [ "Ene", "Feb", "Mar", "Abr", "May", "Jun",
					"Jul", "Ago", "Sep", "Oct", "Nov", "Dic" ],
			dayNames : [ "Domingo", "Lunes", "Martes", "Miércoles", "Jueves",
					"Viernes", "Sábado" ],
			dayNamesShort : [ "Dom", "Lun", "Mar", "Mie", "Jue", "Vie", "Sab" ],
			dayNamesMin : [ "Do", "Lu", "Ma", "Mi", "Ju", "Vi", "Sa" ],
			weekHeader : "Semana",
			firstDay : 0,
			isRTL : false,
			showMonthAfterYear : false,
			yearSuffix : "",
			timeOnlyTitle : "Solo hora",
			timeText : "Tiempo",
			hourText : "Hora",
			minuteText : "Minuto",
			secondText : "Segundo",
			currentText : "Fecha actual",
			ampm : false,
			month : "Mes",
			week : "Semana",
			day : "Día",
			allDayText : "Todo el día"
		};
	</script>
</h:head>
<h:body>
	<p:ajaxStatus onstart="PF('statusDialog').show()"
		onsuccess="PF('statusDialog').hide()"
		onerror="PF('statusDialog').hide()" />

	<p:dialog widgetVar="statusDialog" modal="true" draggable="false"
		closable="false" resizable="false" showHeader="false">
		<h:graphicImage value="/common/imgs/gifs/ajaxloadingbar.gif" />
	</p:dialog>
	<p:growl id="idGrowl" globalOnly="true" autoUpdate="true"
		widgetVar="groMessages" showDetail="true" life="5000" />

	<h:form id="idForm">
		<p:toolbar>
			<f:facet name="left">
				<h:outputLabel style="font-size: 15px;"
					value=" CONSULTA INFORMACION DATABOOK" />
			</f:facet>

			<f:facet name="right">
				<p:commandButton value="Limpiar" icon="fa fa-refresh"
					update="idForm"
					action="#{cxcConsultaInformacionDatabookController.limpiar}"></p:commandButton>
			</f:facet>

		</p:toolbar>

		<h:panelGrid columns="4">
			<f:facet name="header">
				<h:outputText value="B&#250;squeda por Cedula" />
			</f:facet>
			<h:outputText value="Cedula : " style="font-weight: bold;" />
			<p:inputText
				value="#{cxcConsultaInformacionDatabookController.cedulaConsulta}"
				size="15" />
			<p:spacer width="20" height="5" />
			<p:spacer width="20" height="5" />
			<h:outputText value="Consulta Directa Databook : "
				style="font-weight: bold;" />
			<p:selectBooleanCheckbox
				value="#{cxcConsultaInformacionDatabookController.consultaDirecta}" />
			<p:spacer width="20" height="5" />

			<p:commandButton value="Buscar" icon="fa fa-search"
				styleClass="orange-btn"
				action="#{cxcConsultaInformacionDatabookController.consultarDatabook}"
				update="idForm:pnlDatos, idForm:pnlContactos, idForm:pnlEmpleador, idForm:pnlInde, idForm:pnlEmpleador1, idForm:pnlEmpleador2" />
		</h:panelGrid>

		<p:panel id="pnlDatos" header="Datos Generales ">
			<h:panelGrid columns="2">
				<p:outputLabel value="Informacion Actualizada el:"/>
				<p:calendar
					value="#{cxcConsultaInformacionDatabookController.informacionDatabook.fechaRegistro}"
					readonly="true" pattern="yyyy-MM-dd" />
			</h:panelGrid>

			<h:panelGrid columns="4">
				<p:outputLabel value="Nombres:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.nombres}"
					readonly="true" size="50" />

				<p:outputLabel value="Apellidos:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.apellidos}"
					readonly="true" size="50" />

				<p:outputLabel value="Estado Civil:" />
				<p:selectOneMenu id="DbestadoCivilCliente"
					value="#{cxcConsultaInformacionDatabookController.informacionDatabook.estadoCivil}"
					styleClass="normal" title="estadoCivil">
					<f:selectItem itemLabel="SOLTERO/A" itemValue="1" />
					<f:selectItem itemLabel="CASADO/A" itemValue="2" />
					<f:selectItem itemLabel="DIVORCIADO/A" itemValue="3" />
					<f:selectItem itemLabel="VIUDO/A" itemValue="4" />
					<f:selectItem itemLabel="UNION LIBRE" itemValue="5" />
				</p:selectOneMenu>

				<p:outputLabel value="Sexo:" />
				<p:selectOneMenu id="DSexoCliente"
					value="#{cxcConsultaInformacionDatabookController.informacionDatabook.sexo}"
					styleClass="normal" title="Sexo">
					<f:selectItem itemLabel="MASCULINO" itemValue="1" />
					<f:selectItem itemLabel="FEMENINO" itemValue="2" />
				</p:selectOneMenu>

				<p:outputLabel value="Fecha de Nacimiento:" />
				<p:calendar
					value="#{cxcConsultaInformacionDatabookController.informacionDatabook.fechaNacimiento}"
					readonly="true" pattern="yyyy-MM-dd" />

			</h:panelGrid>

		</p:panel>

		<p:panel id="pnlContactos" header="Informacion de Contacto">
			<h:panelGrid columns="2">
				<p:outputLabel value="Direccion:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.mediosContactoDatabook.direccionAdicional}"
					readonly="true" size="100" />
			</h:panelGrid>
			<h:panelGrid columns="4">
				<p:outputLabel value="Telefono:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.mediosContactoDatabook.telefonoAdicional}"
					readonly="true" />

				<p:outputLabel value="email:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.mediosContactoDatabook.email1}"
					readonly="true" size="50" />
				<p:outputLabel value="email 2:" size="40" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.mediosContactoDatabook.email2}"
					readonly="true" size="40" />

				<p:outputLabel value="Telefono Ad. 1:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.mediosContactoDatabook.medioContacto1}"
					readonly="true" />
				<p:outputLabel value="Telefono Ad. 2:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.mediosContactoDatabook.medioContacto2}"
					readonly="true" />
				<p:outputLabel value="Telefono Ad. 3:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.mediosContactoDatabook.medioContacto3}"
					readonly="true" />
				<p:outputLabel value="Telefono Ad. 4:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.mediosContactoDatabook.medioContacto4}"
					readonly="true" />

				<p:outputLabel value="Telefono Ad. 5:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.mediosContactoDatabook.medioContacto5}"
					readonly="true" />
				<p:outputLabel value="Telefono Ad. 6:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.mediosContactoDatabook.medioContacto6}"
					readonly="true" />

			</h:panelGrid>

		</p:panel>

		<p:panel id="pnlEmpleador" header="Informacion del Empleador">
			<h:panelGrid columns="2">
				<p:outputLabel value="Empleador:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.datosDependencia.nombre1}"
					readonly="true" size="80" />
				<p:outputLabel value="Actividad:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.datosDependencia.actividad1}"
					readonly="true" size="100" />

				<p:outputLabel value="Direccion:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.datosDependencia.direccion1}"
					readonly="true" size="100" />
			</h:panelGrid>

			<h:panelGrid columns="4">
				<p:outputLabel value="Cargo:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.datosDependencia.ocupacion}"
					readonly="true" size="60" />

				<p:outputLabel value="Telefono:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.datosDependencia.telefono1}"
					readonly="true" />

				<p:outputLabel value="Rango salarial:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.datosDependencia.rango1}"
					readonly="true" />

				<p:outputLabel value="Fecha Ingreso:" />
				<p:calendar
					value="#{cxcConsultaInformacionDatabookController.datosDependencia.fecha4}"
					readonly="true" pattern="yyyy-MM-dd" />
				<p:outputLabel value="Fecha Salida:" />
				<p:calendar
					value="#{cxcConsultaInformacionDatabookController.datosDependencia.fecha5}"
					readonly="true" pattern="yyyy-MM-dd" />
			</h:panelGrid>
		</p:panel>

		<p:panel id="pnlInde"
			header="Informacion en Relacion de Independencia">
			<h:panelGrid columns="2">
				<p:outputLabel value="Ruc:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.datosIndependencia.id.ruc}"
					readonly="true" size="20"/>
					
				<p:outputLabel value="Razon Social:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.datosIndependencia.razonSocial}"
					readonly="true" size="60" />
				
				<p:outputLabel value="Fantasia:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.datosIndependencia.fantasia}"
					readonly="true" size="60" />
					
				<p:outputLabel value="Direccion:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.datosIndependencia.direccionRuc}"
					readonly="true" size="60" />
					
				<p:outputLabel value="Referencia:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.datosIndependencia.referencia}"
					readonly="true" size="60" />
			</h:panelGrid>
			<h:panelGrid columns="4">
				<p:outputLabel value="Fecha Inicio:" />
				<p:calendar
					value="#{cxcConsultaInformacionDatabookController.datosIndependencia.fechaInicio}"
					readonly="true" pattern="yyyy-MM-dd" />

				<p:outputLabel value="Fecha Suspension:" />
				<p:calendar
					value="#{cxcConsultaInformacionDatabookController.datosIndependencia.fechaSuspension}"
					readonly="true" pattern="yyyy-MM-dd" />
				<p:outputLabel value="Fecha Reinicio:" />
				<p:calendar
					value="#{cxcConsultaInformacionDatabookController.datosIndependencia.fechaReinicio}"
					readonly="true" pattern="yyyy-MM-dd" />
			</h:panelGrid>
		</p:panel>

		<p:panel id="pnlEmpleador1"
			header="Informacion del Empleador Antiguo 1">
			<h:panelGrid columns="2">
				<p:outputLabel value="Ruc:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.empleador1.id.empleadorRuc}"
					readonly="true" size="20"/>
				<p:outputLabel value="Empleador:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.empleador1.empleadorNombre}"
					readonly="true" size="80"/>
				<p:outputLabel value="Actividad:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.empleador1.empleadorActividad} - #{cxcConsultaInformacionDatabookController.empleador1.empleadorDescripcion}"
					readonly="true" size="100"/>
				<p:outputLabel value="Direccion:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.empleador1.empleadorDireccion}"
					readonly="true" size="100"/>
			</h:panelGrid>
			<h:panelGrid columns="4">
				<p:outputLabel value="Cargo:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.empleador1.empleadorCargo}"
					readonly="true" size="60" />
				<p:outputLabel value="Telefono:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.empleador1.empleadorTelefono}"
					readonly="true" />
				<p:outputLabel value="Salario:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.empleador1.empleadorSalario}"
					readonly="true" />
				<p:outputLabel value="Fecha Ingreso:" />
				<p:calendar
					value="#{cxcConsultaInformacionDatabookController.empleador1.empleadorFechaIngreso}"
					readonly="true" pattern="yyyy-MM-dd" />
				<p:outputLabel value="Fecha Salida:" />
				<p:calendar
					value="#{cxcConsultaInformacionDatabookController.empleador1.empleadorFechaSalida}"
					readonly="true" pattern="yyyy-MM-dd" />
			</h:panelGrid>
		</p:panel>

		<p:panel id="pnlEmpleador2"
			header="Informacion del Empleador Antiguo 2">
			<h:panelGrid columns="2">
				<p:outputLabel value="Ruc:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.empleador2.id.empleadorRuc}"
					readonly="true" size="20">
				</p:inputText>
				<p:outputLabel value="Empleador:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.empleador2.empleadorNombre}"
					readonly="true" size="80">
				</p:inputText>
				<p:outputLabel value="Actividad:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.empleador2.empleadorActividad} - #{cxcConsultaInformacionDatabookController.empleador2.empleadorDescripcion}"
					readonly="true" size="100">
				</p:inputText>
				<p:outputLabel value="Direccion:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.empleador2.empleadorDireccion}"
					readonly="true" size="100">
				</p:inputText>
			</h:panelGrid>
			<h:panelGrid columns="4">
				<p:outputLabel value="Cargo:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.empleador2.empleadorCargo}"
					readonly="true" size="60" />
				<p:outputLabel value="Telefono:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.empleador2.empleadorTelefono}"
					readonly="true" />
				<p:outputLabel value="Salario:" />
				<p:inputText
					value="#{cxcConsultaInformacionDatabookController.empleador2.empleadorSalario}"
					readonly="true" />
				<p:outputLabel value="Fecha Ingreso:" />
				<p:calendar
					value="#{cxcConsultaInformacionDatabookController.empleador2.empleadorFechaIngreso}"
					readonly="true" pattern="yyyy-MM-dd" />
				<p:outputLabel value="Fecha Salida:" />
				<p:calendar
					value="#{cxcConsultaInformacionDatabookController.empleador2.empleadorFechaSalida}"
					readonly="true" pattern="yyyy-MM-dd" />
			</h:panelGrid>
		</p:panel>
	</h:form>

	<h:outputStylesheet name="css/layout-lightblue.css"
		library="serenity-layout" />
</h:body>
</html>
