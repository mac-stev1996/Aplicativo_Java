<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/jsf/templates/bodyTemplate.xhtml">
	<ui:define name="title">
		Configuración tiempo pagos externos U
	</ui:define>

	<ui:define name="buttons">
		<h:form id="frmBotones">
			<p:commandButton value="Limpiar" styleClass="green-btn"
				id="btnLimpiar"
				actionListener="#{clientesTiempoExternoController.limpiarDatos}"
				icon="ui-icon-refresh" partialSubmit="true" update=":frmClientesU"
				style="margin-top:0px;font-size:12px !important;" />
		</h:form>
	</ui:define>
	<ui:define name="content">
		<style type="text/css">
body {
	font-size: 11px;
}

body .ui-panelgrid .ui-panelgrid-cell {
	padding: 2px 5px;
}

.table thead th, .table tbody tr td {
	font-size: 11px !important;
	padding: 3px 5px !important;
}

body .ui-messages>div {
	padding: 4px 4px;
	margin: 2px 2px;
}
</style>
		<h:form id="frmClientesU" onkeypress="return event.keyCode!=13">
			<p:messages id="messages" showDetail="true" autoUpdate="true"
				closable="true" showSummary="true" />
			<center>
				<p:panel>
					<p:panelGrid id="pnlBusqueda" columns="7" style="margin-top:3px">
						<p:outputLabel value="Identificación:" styleClass="bold" />
						<p:column>
							<p:inputNumber maxValue="999999999999999"
								inputStyle="width:120px"
								value="#{clientesTiempoExternoController.identificacion}"
								autocomplete="off" decimalPlaces="0" thousandSeparator=""
								decimalSeparator="" />
						</p:column>
						<p:outputLabel value="Nombre:" styleClass="bold" />
						<p:column>
							<p:inputText value="#{clientesTiempoExternoController.nombre}"
								style="width:400px" maxlength="100" onkeyup="mayus(this)"
								autocomplete="off" />
						</p:column>

						<p:commandButton value="Buscar" update="frmClientesU"
							icon="ui-icon-search" partialSubmit="true"
							process="@this, pnlBusqueda"
							actionListener="#{clientesTiempoExternoController.consultar}" />
					</p:panelGrid>
				</p:panel>
				<p:dataTable id="dtClientesU" widgetVar="dtClientesU" var="item"
					value="#{clientesTiempoExternoController.clientes}"
					styleClass="table" rowIndexVar="row" rows="20"
					emptyMessage="No existen clientes" style="width:70%"
					paginatorPosition="bottom" rowKey="#{item[0]}"
					paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
					currentPageReportTemplate="{startRecord} - {endRecord} de {totalRecords}"
					paginator="true">
					<p:column headerText="No cliente" width="10%"
						style="text-align:center">
						<p:outputLabel value="#{item[0]}" />
					</p:column>
					<p:column headerText="Identificación" width="15%">
						<p:outputLabel value="#{item[2]}" />
					</p:column>
					<p:column headerText="Nombre" width="70%">
						<p:outputLabel value="#{item[3]}" />
					</p:column>
					<p:column headerText="Días" width="5%">
						<p:inputNumber value="#{item[4]}" decimalPlaces="0"
							inputStyle="width:90%" thousandSeparator="" decimalSeparator=""
							styleClass="number" maxValue="999">
							<p:ajax event="change"
								listener="#{clientesTiempoExternoController.actualizarDias(item)}"
								update="frmClientesU" process="@this, dtClientesU"
								partialSubmit="true" />
						</p:inputNumber>
					</p:column>
				</p:dataTable>
			</center>
		</h:form>
	</ui:define>
</ui:composition>
