<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core">
<head>

</head>
<ui:composition>


	<p:toolbar>
		<f:facet name="left">

		</f:facet>
		<f:facet name="right">
			<h:panelGrid id="pgComandosPep" columns="2">
		
				<p:commandButton title="Editar" icon="fa fa-pencil"
					value="Editar" partialSubmit="true"
					actionListener="#{cmlPepController.mostrarDialogoPepEditar}"
					update=":form:tabViewTablas:pgPep"
					styleClass="green-btn" style="margin-top:0px !important;"
				 />	 

				 </h:panelGrid>
		</f:facet>
	</p:toolbar>

	<p:dataTable var="item" id="tblPep"
		value="#{cmlPepController.listaPep}"
		selectionMode="single"
         selection="#{cmlPepController.cmlPepSeleccionado}" rowKey="#{item.id.tipo}"
		 scrollable="true"
		scrollHeight="345" emptyMessage="No se han encontrado elementos"
		rowIndexVar="var" styleClass="hover-rows table table-body">
		<p:column headerText="Tipo" style="width:35px;padding-left:1px;">
			<h:outputText value="#{item.id.tipo}" />
		</p:column>
		<p:column headerText="Valor" style="width:35px;padding-left:1px;">
			<h:outputText value="#{item.valor}" />
		</p:column>
	</p:dataTable>

	<p:dialog id="dlgPep" widgetVar="dlgPepWV"
		header="Detalle Pep" style="position:fixed" responsive="true"
		closeOnEscape="true" modal="true" appendTo="@(body)" width="500"
		height="250">

		<p:toolbar>
			<f:facet name="left">

			</f:facet>
			<f:facet name="right">
				<p:commandButton title="Guardar" icon="fa fa-save"
					partialSubmit="true"
					process="@this, :form:tabViewTablas:pgPep"
					actionListener="#{cmlPepController.guardarPep()}"
					styleClass="deep-orange-btn" style="margin-top:0px !important;"
					update=":form:tabViewTablas:tblPep" />

			</f:facet>
		</p:toolbar>

		<h:panelGrid id="pgPep" columns="2"
			columnClasses="w30 txtR, w70 txtR" width="100%">

			<p:outputLabel style="float:right;font-weight:bold;"
				value="Tipo" />
			<p:outputLabel style="float:left;font-weight:bold;"
				value="#{cmlPepController.tipo}" />


			<p:outputLabel style="float:right;font-weight:bold;"
				value="Valor" />	
			<p:inputText style="float:left;" id="somValorPep"
				value="#{cmlPepController.valor}">
			</p:inputText>




		</h:panelGrid>
		
	</p:dialog>

</ui:composition>
</html>
