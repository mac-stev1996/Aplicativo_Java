<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core">
<head>

</head>
<ui:composition>


	<p:toolbar>
		<f:facet name="left">

		</f:facet>
		<f:facet name="right">
			<h:panelGrid id="pgComandosPais" columns="2">
		
				<p:commandButton title="Editar" icon="fa fa-pencil"
					value="Editar" partialSubmit="true"
					actionListener="#{cmlPaisController.mostrarDialogoPaisEditar}"
					update=":form:tabViewTablas:pgPais"
					styleClass="green-btn" style="margin-top:0px !important;"
				 />	 
				 </h:panelGrid>
		</f:facet>
	</p:toolbar>

	<p:dataTable var="item" id="tblPais"
		value="#{cmlPaisController.listaPais}"
		selectionMode="single"
         selection="#{cmlPaisController.cmlPaisSeleccionado}" rowKey="#{item.id.codigo}"
		 scrollable="true"
		scrollHeight="345" emptyMessage="No se han encontrado elementos"
		rowIndexVar="var" styleClass="hover-rows table table-body">
		<p:column headerText="Código" style="width:35px;padding-left:1px;">
			<h:outputText value="#{item.id.codigo}" />
		</p:column>
		<p:column headerText="Descripción" style="padding-left:1px;">
			<h:outputText value="#{item.descripcion}" />
		</p:column>
		<p:column headerText="Valor" style="width:35px;padding-left:1px;">
			<h:outputText value="#{item.valor}" />
		</p:column>
		<p:column headerText="Estado" style="width:35px;padding-left:1px;">
			<h:outputText value="#{item.estado}" />
		</p:column>
	</p:dataTable>

	<p:dialog id="dlgPais" widgetVar="dlgPaisWV"
		header="Detalle Pais" style="position:fixed" responsive="true"
		closeOnEscape="true" modal="true" appendTo="@(body)" width="500"
		height="250">

		<p:toolbar>
			<f:facet name="left">

			</f:facet>
			<f:facet name="right">
				<p:commandButton title="Guardar" icon="fa fa-save"
					partialSubmit="true"
					process="@this, :form:tabViewTablas:pgPais"
					actionListener="#{cmlPaisController.guardarPais()}"
					styleClass="deep-orange-btn" style="margin-top:0px !important;"
					update=":form:tabViewTablas:tblPais" />

			</f:facet>
		</p:toolbar>

		<h:panelGrid id="pgPais" columns="2"
			columnClasses="w30 txtR, w70 txtR" width="100%">

			<p:outputLabel style="float:right;font-weight:bold;" value="Código" />
			<p:outputLabel style="float:left;" id="somCodigoPais"
				value="#{cmlPaisController.codigo}">
			</p:outputLabel>

			<p:outputLabel style="float:right;font-weight:bold;" value="Descripción" />
			<p:outputLabel style="float:left;" id="somDescripcionPais"
				value="#{cmlPaisController.descripcion}">
			</p:outputLabel>


			<p:outputLabel style="float:right;font-weight:bold;"
				value="Valor" />	
			<p:inputText style="float:left;" id="somValorPais"
				value="#{cmlPaisController.valor}">
			</p:inputText>	


			<p:outputLabel style="float:right;font-weight:bold;"
				value="Estado" />
			<p:selectOneMenu style="float:left;" id="somEstadoPais"
				value="#{cmlPaisController.estado}">
				<f:selectItem itemLabel="Seleccione" itemValue="" />
				<f:selectItem itemLabel="Activo" itemValue="A" />
				<f:selectItem itemLabel="Inactivo" itemValue="I" />
			</p:selectOneMenu>


		</h:panelGrid>
		
	</p:dialog>

</ui:composition>
</html>
