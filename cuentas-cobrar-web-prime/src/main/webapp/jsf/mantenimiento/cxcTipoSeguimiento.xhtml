<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/jsf/templates/bodyTemplate.xhtml">

	<ui:define name="title">
		Mantenimiento Tipo Seguimiento
	</ui:define>

	<ui:define name="buttons">
		<h:form id="frmButtons">
			<p:commandButton title="Nuevo" partialSubmit="true"
				icon="fa fa-file-o" process="@this"
				style="margin-top: 0px !important; float:right;"
				styleClass="green-btn" update="@this, :dlgNuevo"
				actionListener="#{cxcTipoSeguimientoController.nuevo}" />
		</h:form>
	</ui:define>

	<ui:define name="content">
		<style>
.w25 {
	width: 25%;
}
</style>
		<script type="text/javascript">
		function mayus(e) {
		    e.value = e.value.toUpperCase();
		}
	
	</script>
		<h:form id="idForm">

			<div class="ui-g dashboard">
				<div class="ui-g-12 ui-fluid contact-form">
					<div class="ui-g-12">
						<p:dataTable id="tblTipoSeguimiento"
							widgetVar="tblTipoSeguimiento"
							emptyMessage="No existen registros"
							value="#{cxcTipoSeguimientoController.listadoTipoSeguimiento}"
							var="item" rowKey="#{item.id}" rowIndexVar="var" paginator="true"
							paginatorAlwaysVisible="false" filterDelay="1000" rows="10"
							paginatorPosition="bottom" editable="true" editMode="cell"
							paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

							<p:ajax event="cellEdit"
								listener="#{cxcTipoSeguimientoController.actualizar(item)}"
								update=":idForm:tblTipoSeguimiento" />
							<p:column headerText="Codigo" width="15%"
								filterBy="#{item.id.codigo}">
								<p:outputLabel value="#{item.id.codigo}" />
							</p:column>

							<p:column headerText="Descripcion" width="40%"
								filterBy="#{item.descripcion}">

								<p:cellEditor>
									<f:facet name="output">
										<p:outputLabel value="#{item.descripcion}" />
									</f:facet>
									<f:facet name="input">
										<p:inputText value="#{item.descripcion}" onkeyup="mayus(this)"
											style="width:100%" />
									</f:facet>
								</p:cellEditor>

							</p:column>

							<p:column headerText="Activo ?" width="10%">

								<p:cellEditor>
									<f:facet name="output">
										<p:outputLabel value="#{item.activo eq 'S'?'SI' :'NO'}" />
									</f:facet>
									<f:facet name="input">
										<p:selectOneMenu value="#{item.activo}" style="width:100%">
											<f:selectItem itemLabel="Seleccione" noSelectionOption="true" />
											<f:selectItem itemLabel="SI" itemValue="S" />
											<f:selectItem itemLabel="NO" itemValue="N" />

										</p:selectOneMenu>
									</f:facet>
								</p:cellEditor>

							</p:column>

						</p:dataTable>
					</div>
				</div>
			</div>
		</h:form>
		<p:dialog widgetVar="dlgNuevo" id="dlgNuevo"
			header="Nuevo Tipo Seguimiento" resizable="true" modal="true"
			closable="true" appendTo="@(body)" width="350" height="250"
			closeOnEscape="true">
			<h:form id="idFrmNuevo">
				<div class="ui-g dashboard">
					<div class="ui-g-18 ui-fluid contact-form">
						<div class="ui-g-18">
							<div class="ui-g-12">
								<div class="ui-g-6">
									<p:outputLabel value="Descripcion : " style="width:100%" />

									<p:inputText
										value="#{cxcTipoSeguimientoController.cxcTipoSeguimientoNuevo.descripcion}"
										onkeyup="mayus(this)" maxlength="13">
									</p:inputText>
								</div>
								<div class="ui-g-6">

									<p:outputLabel value="Estado : " style="width:100%" />

									<p:selectOneRadio
										value="#{cxcTipoSeguimientoController.cxcTipoSeguimientoNuevo.activo}"
										columns="2">
										<f:selectItem itemLabel="SI" itemValue="S" />
										<f:selectItem itemLabel="NO" itemValue="N" />

										<p:ajax event="change" process="@this" partialSubmit="true"
											global="flase"></p:ajax>
									</p:selectOneRadio>
								</div>


							</div>

						</div>
					</div>
				</div>
				<br />
				<center>
					<p:commandButton value="Grabar" partialSubmit="true"
						process="@this, dlgNuevo"
						action="#{cxcTipoSeguimientoController.grabar}" update=":idForm"></p:commandButton>
				</center>
			</h:form>
		</p:dialog>


	</ui:define>

</ui:composition>
