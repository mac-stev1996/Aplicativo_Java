<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/jsf/templates/bodyTemplate.xhtml">

	<ui:define name="title">
		Reporte Matriz de Riesgos
	</ui:define>

	<ui:define name="buttons">
		<h:form id="frmButtons">
			<p:commandButton value="Html" partialSubmit="true"
				process="@this, :idForm" styleClass="secondary-btn"
				actionListener="#{cxcDatMatrizRiesgosController.html}" />
			<p:commandButton value="Pdf" partialSubmit="true"
				process="@this, :idForm" styleClass="red-btn"
				actionListener="#{cxcDatMatrizRiesgosController.pdf}" />
			<p:commandButton value="Excel" partialSubmit="true"
				process="@this, :idForm" styleClass="green-btn"
				actionListener="#{cxcDatMatrizRiesgosController.excel}" />
		</h:form>
	</ui:define>

	<ui:define name="content">	
		<h:form id="idForm">
						
			<div class="ui-g dashboard">
				<div class="ui-g-12 ui-fluid contact-form">
					<div class="ui-g">
						<div class="ui-g-4">

							<p:fieldset legend="Parámetros">
								<h:panelGrid id="pgFiltrosFechas" style="width:600px" columns="2" columnClasses="w30,w20">
								
									<h:outputText value="Fecha Desde: " styleClass="normal" />
									<p:calendar id="FechaDesde" 
										maxdate="new Date()" autocomplete="off"
										value="#{cxcDatMatrizRiesgosController.fechaDesde}"
										pattern="dd/MM/yyyy" />					
										
									<h:outputText value="Fecha Hasta: " styleClass="normal" />
									<p:calendar id="FechaHasta" 
										maxdate="new Date()" autocomplete="off"
										value="#{cxcDatMatrizRiesgosController.fechaHasta}" 
										pattern="dd/MM/yyyy"   />

								</h:panelGrid>

								<h:panelGrid id="pgParametros" style="width:600px" columns="2" columnClasses="w30,w20">
					                
					                <h:outputText value="Imprime Cabecera: " styleClass="normal" />
									<p:selectOneMenu id="imprimeCabeceraOpt" value="#{cxcDatMatrizRiesgosController.imprimeCabecera}">
					                    <f:selectItem itemLabel="Si" itemValue="1"/>
					                    <f:selectItem itemLabel="No" itemValue="0"/>
					                </p:selectOneMenu>

								</h:panelGrid>


							</p:fieldset>

						</div>
					</div>
				</div>
			</div>

		</h:form>
	</ui:define>
</ui:composition>
