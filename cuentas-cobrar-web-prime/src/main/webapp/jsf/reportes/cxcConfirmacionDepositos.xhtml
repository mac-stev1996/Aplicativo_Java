<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/jsf/templates/bodyTemplate.xhtml">

	<ui:define name="title">
		Reporte Comprobantes de Depósito
	</ui:define>

	<ui:define name="buttons">
		<h:form id="frmButtons">
		</h:form>
	</ui:define>

	<ui:define name="content">
		<style type="text/css">
			.ui-calendar input {
				width: auto !important;
				min-width: auto !important;
			}
			
			input, .ui-selectcheckboxmenu, .ui-selectonemenu {
				width: 95% !important;
				min-width: 100% !important;
			}
		</style>
		<h:form id="reportForm" >
			<p:messages id="messages" showDetail="true" autoUpdate="true"
				closable="true" />
			<p:ajaxStatus onstart="PF('statusDialog').show()"
				onsuccess="PF('statusDialog').hide()" />
			<p:dialog widgetVar="statusDialog" modal="true" draggable="false"
				closable="false" resizable="false" showHeader="false">
				<h:graphicImage value="/common/imgs/gifs/ajaxloadingbar.gif" />
			</p:dialog>
	
			<p:panel id="basic" style="display: flex; justify-content: center;">
	
					<p>Por favor ingrese los datos solicitados de la consulta y
						seleccione el formato deseado</p>
				<p:panelGrid id="idPanelGridParametros" layout="grid" 
						columns="2" columnClasses="ui-grid-col-4,ui-grid-col-8">
		
						<h:outputText for="fechaDesde" value="Fecha Desde:"
							styleClass="normal" />
						<p:calendar id="fechaDesde" pattern="dd/MM/yyyy" showOn="button"
							size="20" locale="es" navigator="true"
							value="#{cxcConfirmacionDepositoController.fechaDesde}"/>
		
						<h:outputText for="fechaHasta" value="Fecha Hasta:" />
						<p:calendar id="fechaHasta" pattern="dd/MM/yyyy" showOn="button"
							size="20" locale="es" navigator="true"
							value="#{cxcConfirmacionDepositoController.fechaHasta}"/>
				</p:panelGrid>
			</p:panel>
				
			<p:panel id="botones" style="display: flex; justify-content: center;">
				<p:panelGrid id="pgBotones" layout="grid" columns="2" 
					columnClasses="ui-grid-col-6,ui-grid-col-6">
					<h:commandLink target="_blank"
						action="#{cxcConfirmacionDepositoController.report}">
						<h:graphicImage value="/common/imgs/reports/excel.png"
							style="border:none" title="Excel" alt="Excel" width="25"
							height="25" />
						<f:param name="format" value="excel" />
					</h:commandLink>
					<h:commandLink target="_blank"
						action="#{cxcConfirmacionDepositoController.report}">
						<h:graphicImage value="/common/imgs/reports/adobe.png"
							style="border:none" title="Adobe" alt="Adobe" width="25"
							height="25" />
						<f:param name="format" value="pdf" />
					</h:commandLink>
					<h:outputText value="Excel" styleClass="normal" />
					<h:outputText value="Pdf" styleClass="normal" />
	
				</p:panelGrid>
			</p:panel>
	
			<h:inputHidden value="/reportes/cxcConfirmacionDepositos.jasper"
				binding="#{cxcConfirmacionDepositoController.reportPath}" />
		</h:form>

	</ui:define>
</ui:composition>
