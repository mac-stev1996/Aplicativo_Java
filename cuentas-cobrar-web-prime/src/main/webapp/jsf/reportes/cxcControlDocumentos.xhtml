<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"> 
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      	xmlns:p="http://primefaces.org/ui"> 

<h:head>
	<f:facet name="first">
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
	</f:facet>
	<title>Reporte Control de Documentos</title>
	<h:outputScript name="js/layout.js" library="serenity-layout" />
	<h:outputScript name="js/ripple.js" library="serenity-layout" />
	<h:outputStylesheet name="css/layout-lightblue.css"
		library="serenity-layout" />
</h:head> 
<h:body> 
<p:ajaxStatus onstart="PF('statusDialog').show()"
		onsuccess="PF('statusDialog').hide()"
		onerror="PF('statusDialog').hide()" />
	<p:dialog widgetVar="statusDialog" modal="true" draggable="false"
		closable="false" resizable="false" showHeader="false">
		<h:graphicImage value="/common/imgs/gifs/ajaxloadingbar.gif" />
	</p:dialog>
	
	<h:form id="frmPrincipal">
		<p:toolbar styleClass="toolbarStyle">
			<f:facet name="left">
				Reporte Control de Documentos
			</f:facet>
		</p:toolbar>
		
		<p:panelGrid columns="2">
			<p:outputLabel value="Fecha Inicial Entrega a Cobranzas"></p:outputLabel>
			<p:calendar value="#{cxcReporteControlDocumentosCtrl.fechaInicio}">
				<p:ajax event="dateSelect" update=":frmPrincipal:calFechaFin"></p:ajax>
			</p:calendar>
			<p:outputLabel value="Fecha Final Entrega a Cobranzas"></p:outputLabel>
			<p:calendar id="calFechaFin" value="#{cxcReporteControlDocumentosCtrl.fechaFin}"
				mindate="#{cxcReporteControlDocumentosCtrl.fechaInicio}"
				validatorMessage="Ingrese una fecha válida"></p:calendar>
			<p:outputLabel value="Cedula Cliente"></p:outputLabel>
			<p:inputText
			value="#{cxcReporteControlDocumentosCtrl.cedulaCliente}"></p:inputText>
			
			<p:outputLabel></p:outputLabel>
			<p:commandLink action="#{cxcReporteControlDocumentosCtrl.generarReporteExcel}"
				ajax="false">
				<p:graphicImage value="/common/imgs/reports/excel.png"></p:graphicImage>
			</p:commandLink>
		</p:panelGrid>
		
	</h:form>
</h:body> 
</html>
