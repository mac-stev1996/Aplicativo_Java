<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core">
<head>
<script type="text/javascript">
	function mayus(e) {
		e.value = e.value.toUpperCase();
	}
</script>
</head>
<ui:composition>
	<p:dialog id="idDialogLineasNegocioLOV"
		widgetVar="dialogLineasNegocioLOV"
		header="Seleccione una linea de negocio..." style="position:fixed"
		responsive="true" closeOnEscape="true" modal="true" appendTo="@(body)"
		width="380" height="360">
		<h:form  id="frmLinea">
			<h:panelGrid id="idPanelLineasNegocioLOV" columns="1">
				<p:dataTable id="idTableLineasNegocioLOV" var="item"
					multiViewState="true" rowIndexVar="row" rows="10" filterDelay="600"
					rowKey="#{item.pk}" paginatorPosition="bottom"
					paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
					currentPageReportTemplate="{startRecord} - {endRecord} de {totalRecords}"
					paginator="true" lazy="true"
					value="#{dialogLineasNegocioController.lazyDataModelLineasNegocioLOV}"
					selection="#{dialogLineasNegocioController.lineaNegocioLOVDto}"
					selectionMode="single" styleClass="no-cell-padding">

					<p:ajax event="rowSelect"
						listener="#{dialogLineasNegocioController.seleccionarLineaNegocioLOV}"
						process="@this" partialSubmit="true" update="@parent" />

					<p:column headerText="No linea" filterBy="#{item.noLinea}"
						style="width:17%;text-align:center"
						filterStyle="background:#e3e3e3;width:80%;color:black;">
						<h:outputText value="#{item.pk.noLinea}" />
					</p:column>
					<p:column headerText="Descripcion" filterBy="#{item.descripcion}"
						filterStyle="background:#e3e3e3;width:80%;color:black;">
						<h:outputText value="#{item.descripcion}" />
					</p:column>
				</p:dataTable>
			</h:panelGrid>
		</h:form>
	</p:dialog>
</ui:composition>
</html>
