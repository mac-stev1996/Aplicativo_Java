<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core">
<head>

</head>
<ui:composition>


	<p:toolbar>
		<f:facet name="left">

		</f:facet>
		<f:facet name="right">
			<h:panelGrid id="pgComandosRangosMontoTransaccion" columns="2">
		
				<p:commandButton title="Editar" icon="fa fa-pencil"
					value="Editar" partialSubmit="true"
					actionListener="#{cmlRangosMontoTransaccionController.mostrarDialogoRangosMontoTransaccionEditar}"
					update=":form:tabViewTablas:pgRangosMontoTransaccion"
					styleClass="green-btn" style="margin-top:0px !important;"
				 />	 
				 <p:commandButton title="Anadir" icon="fa fa-plus"
					value="Anadir" partialSubmit="true"
					actionListener="#{cmlRangosMontoTransaccionController.mostrarDialogoRangosMontoTransaccion}"
					update=":#{p:component('pgRangosMontoTransaccion')}"
					styleClass="deep-orange-btn" style="margin-top:0px !important;"
				 />
				 </h:panelGrid>
		</f:facet>
	</p:toolbar>

	<p:dataTable var="item" id="tblRangosMontoTransaccion"
		value="#{cmlRangosMontoTransaccionController.listaRangosMontoTransaccion}"
		selectionMode="single"
         selection="#{cmlRangosMontoTransaccionController.cmlRangosMontoTransaccionSeleccionado}" rowKey="#{item.id.codigo}"
		 scrollable="true"
		scrollHeight="345" emptyMessage="No se han encontrado elementos"
		rowIndexVar="var" styleClass="hover-rows table table-body">
		<p:column headerText="Código" style="width:35px;padding-left:1px;">
			<h:outputText value="#{item.id.codigo}" />
		</p:column>
		<p:column headerText="Desde" style="width:35px;padding-left:1px;">
			<h:outputText value="#{item.desde}" />
		</p:column>
		<p:column headerText="Hasta" style="width:35px;padding-left:1px;">
			<h:outputText value="#{item.hasta}" />
		</p:column>
		<p:column headerText="Valor" style="width:35px;padding-left:1px;">
			<h:outputText value="#{item.valor}" />
		</p:column>
		<p:column headerText="Estado" style="width:35px;padding-left:1px;">
			<h:outputText value="#{item.estado}" />
		</p:column>
	</p:dataTable>

	<p:dialog id="dlgRangosMontoTransaccion" widgetVar="dlgRangosMontoTransaccionWV"
		header="Detalle RangosMontoTransaccion" style="position:fixed" responsive="true"
		closeOnEscape="true" modal="true" appendTo="@(body)" width="500"
		height="250">

		<p:toolbar>
			<f:facet name="left">

			</f:facet>
			<f:facet name="right">
				<p:commandButton title="Guardar" icon="fa fa-save"
					partialSubmit="true"
					process="@this, :form:tabViewTablas:pgRangosMontoTransaccion"
					actionListener="#{cmlRangosMontoTransaccionController.guardarRangosMontoTransaccion()}"
					styleClass="deep-orange-btn" style="margin-top:0px !important;"
					update=":form:tabViewTablas:tblRangosMontoTransaccion" />

			</f:facet>
		</p:toolbar>

		<h:panelGrid id="pgRangosMontoTransaccion" columns="2"
			columnClasses="w30 txtR, w70 txtR" width="100%">

			<p:outputLabel style="float:right;font-weight:bold;" value="Código" />
			<p:inputText style="float:left;" id="somCodigoRangosMontoTransaccion"
				value="#{cmlRangosMontoTransaccionController.codigo}">
			</p:inputText>

			<p:outputLabel style="float:right;font-weight:bold;" value="Desde" />
			<p:inputNumber  style="float:left;" value="#{cmlRangosMontoTransaccionController.desde}" decimalPlaces="2" />

			<p:outputLabel style="float:right;font-weight:bold;" value="Hasta" />
			<p:inputNumber  style="float:left;" value="#{cmlRangosMontoTransaccionController.hasta}" decimalPlaces="2" />

			<p:outputLabel style="float:right;font-weight:bold;"
				value="Valor" />
			<p:inputText style="float:left;" id="somValorRangosMontoTransaccion"
				value="#{cmlRangosMontoTransaccionController.valor}">
			</p:inputText>	

			<p:outputLabel style="float:right;font-weight:bold;"
				value="Estado" />
			<p:selectOneMenu style="float:left;" id="somEstadoRangosMontoTransaccion"
				value="#{cmlRangosMontoTransaccionController.estado}">
				<f:selectItem itemLabel="Seleccione" itemValue="" />
				<f:selectItem itemLabel="Activo" itemValue="A" />
				<f:selectItem itemLabel="Inactivo" itemValue="I" />
			</p:selectOneMenu>




		</h:panelGrid>
		
	</p:dialog>

</ui:composition>
</html>
