<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<style type="text/css">
body {
	font-size: 10px;
}

body .ui-toolbar {
	padding: 5px;
}

.columAlignCenter {
	text-align: center;
}

.columAlignRight {
	text-align: right;
}
</style>
	<script type="text/javascript">
		PrimeFaces.locales["es"] = {
			    closeText: "Cerrar",
			    prevText: "Anterior",
			    nextText: "Siguiente",
			    monthNames: ["Enero","Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"],
			    monthNamesShort: ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"],
			    dayNames: ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"],
			    dayNamesShort: ["Dom", "Lun", "Mar", "Mie", "Jue", "Vie", "Sab"],
			    dayNamesMin: ["Do", "Lu", "Ma", "Mi", "Ju", "Vi", "Sa"],
			    weekHeader: "Semana",
			    firstDay: 0,
			    isRTL: false,
			    showMonthAfterYear: false,
			    yearSuffix: "",
			    timeOnlyTitle: "Solo hora",
			    timeText: "Tiempo",
			    hourText: "Hora",
			    minuteText: "Minuto",
			    secondText: "Segundo",
			    currentText: "Fecha actual",
			    ampm: false,
			    month: "Mes",
			    week: "Semana",
			    day: "Día",
			    allDayText : "Todo el día"
			};

		</script>
</h:head>
<h:body>
	<p:ajaxStatus onstart="PF('statusDialog').show()"
		onsuccess="PF('statusDialog').hide()"
		onerror="PF('statusDialog').hide()" />

	<p:dialog widgetVar="statusDialog" modal="true" draggable="false"
		closable="false" resizable="false" showHeader="false">
		<h:graphicImage value="/common/imgs/gifs/ajaxloadingbar.gif" />
	</p:dialog>
	<p:growl id="idGrowl" globalOnly="true" autoUpdate="true"
		widgetVar="groMessages" showDetail="true" life="5000" />

	<h:form id="idForm">
		<p:toolbar>
			<f:facet name="left">
				<h:outputLabel style="font-size: 15px;" value="BUSCADOR DE FACTURAS" />
			</f:facet>

			<f:facet name="right">

			</f:facet>

		</p:toolbar>

		<h:panelGrid columns="4" id="pnlFiltros">
			<p:outputLabel value="Cédula"></p:outputLabel>

			<p:inputText
				value="#{cxcBuscadorControlDocumentos.cedula}" required="true" requiredMessage="Debe ingresar un número de factura"></p:inputText>

			<div></div>
			<p:commandButton value="Buscar" icon="fa fa-search"
				action="#{cxcBuscadorControlDocumentos.buscarFacturas}"
				update="idForm:idTblFacturas"></p:commandButton>
		</h:panelGrid>


		<p:dataTable id="idTblFacturas"
			emptyMessage="La búsqueda no ha devuelto resultados."
			value="#{cxcBuscadorControlDocumentos.facturasEncontradas}"
			var="item"
			paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
			rows="15" paginator="true">
			<p:column headerText="Agencia" styleClass="columAlignCenter"
				>
				<p:outputLabel value="#{item[15]}"></p:outputLabel>
			</p:column>
			
			<p:column headerText="Cotización" styleClass="columAlignCenter"
				>
				<p:outputLabel value="#{item[0]}"></p:outputLabel>
			</p:column>
			<p:column headerText="Factura" styleClass="columAlignCenter"
				>
				<p:outputLabel value="#{item[10]}"></p:outputLabel>
			</p:column>
			<p:column headerText="Línea" styleClass="columAlignCenter"
				>
				<p:outputLabel value="#{item[12]}"></p:outputLabel>
			</p:column>
			<p:column headerText="Financiamiento" styleClass="columAlignCenter"
				>
				<p:outputLabel value="#{item[14]}"></p:outputLabel>
			</p:column>
			<p:column headerText="Cliente " styleClass="columAlignCenter"
				>
				<p:outputLabel value="#{item[4]}"></p:outputLabel>
			</p:column>
			<p:column headerText="Fecha" styleClass="columAlignCenter"
				>
				<p:outputLabel value="#{item[3]}">
					<f:convertDateTime pattern="dd/MM/yyyy"></f:convertDateTime>
				</p:outputLabel>
			</p:column>
			<p:column styleClass="columAlignCenter" width="120">
				<p:commandButton icon="ui-icon ui-icon-document"
					title="Control de Documentos"
					action="#{cxcBuscadorControlDocumentos.irControlDocumentos(item)}"
					process="@this">
				</p:commandButton>
			</p:column>

		</p:dataTable>
	</h:form>

	<h:outputStylesheet name="css/layout-lightblue.css"
		library="serenity-layout" />
</h:body>
</html>
