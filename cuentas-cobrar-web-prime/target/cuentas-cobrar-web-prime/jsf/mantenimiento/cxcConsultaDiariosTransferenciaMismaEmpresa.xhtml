<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<style type="text/css">
body {
	font-size: 10px;
}

body .ui-toolbar {
	padding: 5px;
}

.columAlignCenter {
	text-align: center;
}

.columAlignRight {
	text-align: right;
}
</style>
	<script type="text/javascript">
		PrimeFaces.locales["es"] = {
			    closeText: "Cerrar",
			    prevText: "Anterior",
			    nextText: "Siguiente",
			    monthNames: ["Enero","Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"],
			    monthNamesShort: ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"],
			    dayNames: ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"],
			    dayNamesShort: ["Dom", "Lun", "Mar", "Mie", "Jue", "Vie", "Sab"],
			    dayNamesMin: ["Do", "Lu", "Ma", "Mi", "Ju", "Vi", "Sa"],
			    weekHeader: "Semana",
			    firstDay: 0,
			    isRTL: false,
			    showMonthAfterYear: false,
			    yearSuffix: "",
			    timeOnlyTitle: "Solo hora",
			    timeText: "Tiempo",
			    hourText: "Hora",
			    minuteText: "Minuto",
			    secondText: "Segundo",
			    currentText: "Fecha actual",
			    ampm: false,
			    month: "Mes",
			    week: "Semana",
			    day: "Día",
			    allDayText : "Todo el día"
			};

		</script>
</h:head>
<h:body>
	<p:ajaxStatus onstart="PF('statusDialog').show()"
		onsuccess="PF('statusDialog').hide()"
		onerror="PF('statusDialog').hide()" />

	<p:dialog widgetVar="statusDialog" modal="true" draggable="false"
		closable="false" resizable="false" showHeader="false">
		<h:graphicImage value="/common/imgs/gifs/ajaxloadingbar.gif" />
	</p:dialog>
	<p:growl id="idGrowl" globalOnly="true" autoUpdate="true"
		widgetVar="groMessages" showDetail="true" life="5000" />
	<h:form id="idForm">
		<p:toolbar>
			<f:facet name="left">
				<h:outputLabel style="font-size: 13px;"
					value=" DIAIROS GENERADOS POR TRANFERENCIA A LA MISMA EMPRESA" />
			</f:facet>
			<f:facet name="right">
				<p:commandButton title="Limpiar" icon="fa fa-refresh"
					update="idForm" styleClass="orange-btn"
					action="#{cxcDiairosTransferenciaMismaEmpresaController.limpiar}"></p:commandButton>
			</f:facet>
			<f:facet name="right">
				<p:commandButton title="Procesar" icon="fa fa-save"
					styleClass="green-btn"
					update="idForm :#{p:component('idTblDiarios')}"
					action="#{cxcDiairosTransferenciaMismaEmpresaController.guardarNumerosConciliaion}"></p:commandButton>
			</f:facet>
		</p:toolbar>
		<h:panelGrid columns="4">
			<f:facet name="header">
				<h:outputText value="Filtros de B&#250;squeda"></h:outputText>
			</f:facet>
			<h:panelGrid columns="2">
				<h:outputText value="Fecha Inicio: " style="font-weight: bold;"></h:outputText>
				<p:calendar title="Fecha Inicial"
					value="#{cxcDiairosTransferenciaMismaEmpresaController.fechaInicial}"
					pattern="dd/MM/yyyy" autocomplete="off"></p:calendar>
			</h:panelGrid>
			<h:panelGrid columns="2">
				<h:outputText value="Fecha Fin: " style="font-weight: bold;"></h:outputText>
				<p:calendar title="Fecha Final"
					value="#{cxcDiairosTransferenciaMismaEmpresaController.fechaFinal}"
					pattern="dd/MM/yyyy" autocomplete="off"></p:calendar>
			</h:panelGrid>
			<p:spacer width="5" height="5"></p:spacer>
			<h:outputLabel />
			<h:panelGrid columns="2">
				<h:outputText value="N&#250;mero Diario Desde: "
					style="font-weight: bold;"></h:outputText>
				<p:inputText
					value="#{cxcDiairosTransferenciaMismaEmpresaController.noFisicoInicial}"></p:inputText>
			</h:panelGrid>
			<h:panelGrid columns="2">
				<h:outputText value="N&#250;mero Diario Hasta: "
					style="font-weight: bold;"></h:outputText>
				<p:inputText
					value="#{cxcDiairosTransferenciaMismaEmpresaController.noFisicoFinal}"></p:inputText>
			</h:panelGrid>
			<p:spacer width="5" height="5"></p:spacer>
		</h:panelGrid>
		<h:panelGrid columns="2">
			<h:outputText value="Concilliado:" style="font-weight: bold;"></h:outputText>
			<p:selectOneMenu id="idEstadoConciliacion"
				value="#{cxcDiairosTransferenciaMismaEmpresaController.envioMail}">
				<f:selectItem itemLabel="Conciliado" itemValue="S" />
				<f:selectItem itemLabel="No Conciliado" itemValue="N" />
			</p:selectOneMenu>
		</h:panelGrid>

		<h:panelGrid columns="2">
			<h:outputText value="Banco" style="font-weight: bold;"></h:outputText>
			<p:selectOneMenu style="width: 50%"
				value="#{cxcDiairosTransferenciaMismaEmpresaController.noCtaBanco}">
				<f:selectItem itemLabel="Seleccione" itemValue="" />
				<f:selectItems
					value="#{cxcDiairosTransferenciaMismaEmpresaController.ctasBancariasSelectItems}" />
			</p:selectOneMenu>
		</h:panelGrid>


		<h:panelGrid columns="4" id="pnlFiltros">
			<h:panelGrid columns="2">
				<p:commandLink style="font-weight: bold;"
					oncomplete="PF('DlgClientes').show();" value="Cliente: "
					update="FrmClientes" />
				<p:inputText
					value="#{cxcDiairosTransferenciaMismaEmpresaController.clienteSeleccionado.nombre}"
					style="width:270px;" readonly="true"></p:inputText>
			</h:panelGrid>
			<p:spacer width="20" height="5"></p:spacer>
			<p:commandButton title="Buscar" icon="fa fa-search"
				styleClass="orange-btn"
				action="#{cxcDiairosTransferenciaMismaEmpresaController.buscarDiarios}"
				update="idForm:idTblDiarios"></p:commandButton>
		</h:panelGrid>


		<p:dataTable id="idTblDiarios" emptyMessage="Sin Registros"
			value="#{cxcDiairosTransferenciaMismaEmpresaController.listarDiariosTransferenciaMismaEmpresa}"
			var="item"
			paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
			rows="15" paginator="true"
			selection="#{cxcDiairosTransferenciaMismaEmpresaController.listaDiariosSeleccionados}"
			rowIndexVar="var" rowKey="#{item.noDocu}">
			<p:ajax event="rowSelectCheckbox" partialSubmit="true" global="false"
				process="@this :#{p:component('idTblDiarios')}"
				update=":#{p:component('idTblDiarios')}" />

			<p:column selectionMode="multiple" width="20" />
			<p:column headerText="Agencia " styleClass="columAlignCenter"
				width="40">
				<p:outputLabel value="#{item.agencia}" />
			</p:column>
			<p:column headerText="Mail " styleClass="columAlignCenter" width="70">
				<p:outputLabel
					value="#{item.envioMail eq 'S'?'ENVIADO':'NO ENVIADO'}" />
			</p:column>
			<p:column headerText="Conciliado " styleClass="columAlignCenter"
				width="70">
				<p:outputLabel
					value="#{item.envioMail eq 'S'?'CONCILIADO':'NO CONCILIADO'}" />
			</p:column>
			<p:column headerText="Fecha" styleClass="columAlignCenter" width="60">
				<p:outputLabel value="#{item.fecha}">
					<f:convertDateTime pattern="dd-MM-yyyy" />
				</p:outputLabel>
			</p:column>
			<p:column headerText="No. Diario A " styleClass="columAlignCenter"
				width="40">
				<p:outputLabel value="#{item.numeroDiario}" />
			</p:column>
			<p:column headerText="Tipo Transaccion "
				styleClass="columAlignCenter" width="130">
				<p:outputLabel value="#{item.descripcionTipoDocumento}" />
			</p:column>
			<p:column headerText="Numero Cta." styleClass="columAlignCenter"
				width="70">
				<p:outputLabel value="#{item.noCuenta}" />
			</p:column>
			<p:column headerText="Banco " styleClass="columAlignCenter"
				width="120">
				<p:outputLabel value="#{item.banco}" />
			</p:column>
			<p:column headerText="No. Cliente Original"
				styleClass="columAlignCenter" width="60">
				<p:outputLabel value="#{item.clienteOriginal}" />
			</p:column>
			<p:column headerText="Cedula Cliente Original "
				styleClass="columAlignCenter" width="90">
				<p:outputLabel value="#{item.cedulaOriginal}" />
			</p:column>
			<p:column headerText="Nombre Cliente Original"
				styleClass="columAlignCenter" width="300">
				<p:outputLabel value="#{item.nombreOriginal}" />
			</p:column>
			<p:column headerText="Numero Cliente " styleClass="columAlignCenter"
				width="60">
				<p:outputLabel value="#{item.noCliente}" />
			</p:column>
			<p:column headerText="Cedula Cliente " styleClass="columAlignCenter"
				width="90">
				<p:outputLabel value="#{item.cedula}" />
			</p:column>
			<p:column headerText="Nombre Cliente " styleClass="columAlignCenter"
				width="120">
				<p:outputLabel value="#{item.nombreCliente}" />
			</p:column>
			<p:column headerText="Comentario" styleClass="columAlignCenter"
				width="300">
				<p:outputLabel value="#{item.comentar}" />
			</p:column>
			<p:column headerText="Usuario" styleClass="columAlignCenter"
				width="60">
				<p:outputLabel value="#{item.usuario}" />
			</p:column>
			<p:column headerText="Monto" styleClass="columAlignCenter" width="50">
				<p:outputLabel value="#{item.monto}">
					<f:convertNumber pattern="#0.00" />
				</p:outputLabel>
			</p:column>
			<p:column headerText="Documento" styleClass="columAlignCenter"
				width="60">
				<p:commandLink ajax="false" target="_blank"
					action="#{cxcDiairosTransferenciaMismaEmpresaController.imprimirDiario(item)}">
					<p:commandButton icon="fa fa-file-pdf-o" styleClass="red-btn"
						title="Descargar Documento" ajax="false">
					</p:commandButton>
				</p:commandLink>
			</p:column>
			<p:column headerText="No. Conciliacion" styleClass="columAlignCenter"
				width="70">
				<p:outputLabel value="#{item.documentoConcilia}"
					rendered="#{item.documentoConcilia != null}"></p:outputLabel>
				<p:inputText value="#{item.numeroConcilicacion}"
					rendered="#{item.documentoConcilia == null}"></p:inputText>
			</p:column>
			<p:column headerText="Fecha Deposito" styleClass="columAlignCenter"
				width="90">
				<p:outputLabel value="#{item.fechaDeposito}"
					rendered="#{item.fechaDeposito != null}">
					<f:convertDateTime pattern="dd/MM/yyyy" />
				</p:outputLabel>
				<p:calendar value="#{item.fechaDeposito}"
					rendered="#{item.documentoConcilia == null}" pattern="dd/MM/yyyy" />
			</p:column>
			<p:column headerText="Tipo Movimiento" styleClass="columAlignCenter"
				width="200">
				<p:outputLabel value="#{item.tipoMovimiento}"
					rendered="#{item.tipoMovimiento != null}"></p:outputLabel>

				<p:selectOneMenu filter="true" filterMatchMode="contains"
					rendered="#{item.documentoConcilia == null}"
					value="#{item.tipoMovimiento}">
					<f:selectItem itemLabel="Seleccione" itemValue="" />
					<f:selectItems
						value="#{cxcDiairosTransferenciaMismaEmpresaController.listaSelectItemsDocumentos}" />
				</p:selectOneMenu>
			</p:column>
		</p:dataTable>

		<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
			<p:commandButton value="Yes" type="button"
				styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
			<p:commandButton value="No" type="button"
				styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
		</p:confirmDialog>
	</h:form>
	<p:dialog widgetVar="DlgClientes" id="DlgClientes"
		header="Seleccione Cliente" resizable="true" modal="true"
		closable="true" appendTo="@(body)" width="480" height="500">
		<h:form id="FrmClientes">
			<p:dataTable id="dtClientes"
				value="#{cxcDiairosTransferenciaMismaEmpresaController.clientes}"
				var="cliente" emptyMessage="No existen registros"
				selectionMode="single"
				selection="#{cxcDiairosTransferenciaMismaEmpresaController.clienteSeleccionado}"
				rowKey="#{cliente.clientePK}" paginator="true" rows="10" lazy="true"
				paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}">
				<p:column headerText="Cedula/Ruc" filterBy="#{cliente.cedula}"
					width="90">
					<h:outputText value="#{cliente.cedula}" />
				</p:column>
				<p:column headerText="Nombre" filterBy="#{cliente.nombre}"
					filterMatchMode="startsWith">
					<h:outputText value="#{cliente.nombre}" />
				</p:column>
			</p:dataTable>
			<br> </br>
			<center>
				<p:commandButton value="Seleccionar "
					action="#{cxcDiairosTransferenciaMismaEmpresaController.seleccionarCliente}"
					update="idForm:pnlFiltros"></p:commandButton>
			</center>
		</h:form>
	</p:dialog>


	<h:outputStylesheet name="css/layout-lightblue.css"
		library="serenity-layout" />
</h:body>
</html>
