<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<h:head>

	<h:outputScript library="js" name="util.js"></h:outputScript>

	<h:outputStylesheet name="css/layout-lightblue.css"
		library="serenity-layout" />

	<style type="text/css">
body {
	font-size: 14px;
}

table.companyHeaderGrid.ui-panelgrid>tbody>tr {
	border-color: white;
}

body .ui-toolbar {
	padding: 0px;
}

body .ui-dialog .ui-dialog-titlebar {
	background-color: #0288D1;
}
</style>

</h:head>
<h:body>
	<p:ajaxStatus onstart="PF('statusDialog').show()"
		onsuccess="PF('statusDialog').hide()"
		onerror="PF('statusDialog').hide()" />
	<p:dialog widgetVar="statusDialog" modal="true" draggable="false"
		closable="false" resizable="false" showHeader="false">
		<h:graphicImage value="/common/imgs/gifs/ajaxloadingbar.gif" />
	</p:dialog>
	<h:form id="form">
		<p:growl id="messages" globalOnly="true" autoUpdate="true"
			widgetVar="groMessages" showDetail="true" life="3000" />
		<p:toolbar styleClass="toolbarStyle">
			<f:facet name="left">
				<i class="file-chart-line"></i>


				<b><p:outputLabel style="font-size: 15px;"
						value="REPORTE DE CREDITOS " /></b>
			</f:facet>

		</p:toolbar>
		<p:panel>
			<center>
				<h:panelGrid id="idPnlgDatos" style="width: 50%" columns="2"
					styleClass="companyHeaderGrid">

					<p:outputLabel value="Fecha Desde :" />
					<p:calendar value="#{cxcReporteCreditosController.fechaDesde}"
						autocomplete="off"></p:calendar>

					<p:outputLabel value="Fecha Hasta :" />
					<p:calendar value="#{cxcReporteCreditosController.fechaHasta}"
						autocomplete="off"></p:calendar>


					<p:outputLabel value="Agencia :" />
					<p:selectOneMenu id="idConce"
						value="#{cxcReporteCreditosController.agencia}">
						<f:selectItem itemLabel="Todos" />
						<f:selectItems value="#{cxcReporteCreditosController.agencias}"
							var="ag" itemLabel="#{ag.nombre}"
							itemValue="#{ag.agenciaPK.codigo}" />
					</p:selectOneMenu>

					<p:outputLabel value="Estado :" />
					<p:selectOneMenu value="#{cxcReporteCreditosController.estado}">
						<f:selectItem itemLabel="Todos" />
						<f:selectItem itemLabel="INGRESADO" itemValue="I" />
						<f:selectItem itemLabel="ENVIADO" itemValue="E" />
						<f:selectItem itemLabel="REVISADO" itemValue="R" />
						<f:selectItem itemLabel="APROBADO" itemValue="A" />
						<f:selectItem itemLabel="DEVUELTO" itemValue="D" />
						<f:selectItem itemLabel="NEGADO" itemValue="N" />
					</p:selectOneMenu>


					<p:outputLabel value="Asesor :" />
					<p:inputText value="#{cxcReporteCreditosController.asesor}"
						autocomplete="off"></p:inputText>

				</h:panelGrid>
				<p:spacer height="20"></p:spacer>
				<h:panelGrid columns="3" border="0"
					columnClasses="iconCell, iconCell, iconCell" cellpadding="0"
					cellspacing="0" width="550">
					<h:commandLink target="_blank"
						action="#{cxcReporteCreditosController.report(false)}">
						<h:graphicImage value="/common/imgs/reports/excel.png"
							style="border:none;align:center;" title="Excel" alt="Excel"
							width="25" height="25" />
						<f:param name="format" value="excel" />
					</h:commandLink>
					<h:commandLink target="_blank"
						action="#{cxcReporteCreditosController.report(false)}">
						<h:graphicImage value="/common/imgs/reports/adobe.png"
							style="border:none" title="Adobe" alt="Adobe" width="25"
							height="25" />
						<f:param name="format" value="pdf" />
					</h:commandLink>

					<h:commandLink target="_blank"
						action="#{cxcReporteCreditosController.report(true)}">
						<h:graphicImage value="/common/imgs/reports/adobe.png"
							style="border:none" title="Adobe" alt="Adobe" width="25"
							height="25" />
						<f:param name="format" value="pdf" />
					</h:commandLink>

					<h:outputText value="Excel" styleClass="normal" />
					<h:outputText value="Pdf" styleClass="normal" />
					<h:outputText value="Pdf(Resumen Totalizado)" styleClass="normal" />
				</h:panelGrid>

			</center>
		</p:panel>

	</h:form>

</h:body>
</html>
