<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/jsf/templates/bodyTemplate.xhtml">

	<ui:define name="title">
		Reporte cartera vencida y por vencer general
	</ui:define>
	
	<ui:define name="buttons">
		<h:form id="frmButtons">
			<p:commandButton id="btnPDF" 
			    title="Generar el reporte en PDF" 
				icon="fa fa-file-pdf-o fa-2x"
				actionListener="#{cxcCarteraVenxVenSinEmpRelaController.report('pdf')}"
				styleClass="deep-orange-btn"
				ajax="false"
				onclick="form.target='_blank'"
				process="@this" 
				partialSubmit="true" 
				update="@this"
				/>
			<p:commandButton id="btnExcel" 
				title="Generar el reporte en Excel" 
				icon="fa fa-file-excel-o fa-2x"
				actionListener="#{cxcCarteraVenxVenSinEmpRelaController.report('excel')}"
				styleClass="green-btn"
				ajax="false"
				onclick="form.target='_blank'"
				process="@this" 
				partialSubmit="true" 
				update="@this"
				/>
		</h:form>
	</ui:define>

	<ui:define name="content">
	<style type="text/css">
			.ui-calendar input {
				width: auto !important;
				min-width: auto !important;
			}
			
			input, .ui-selectcheckboxmenu, .ui-selectonemenu {
				width: auto !important;
				min-width: auto !important;
			}
			.gridSinBordes.ui-panelgrid>*>tr, .gridSinBordes.ui-panelgrid .ui-panelgrid-cell
				{
				border: none !important;
				border-right-width: 0px !important;
				border-left-width: 0px !important;
				padding-right: 1px !important;
				padding-left: 1px !important;
				padding-top: 1px !important;
				padding-bottom: 1px !important
			}
		</style>
	<h:form id="reportForm" >
			<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" />
			<div class="ui-g dashboard">
				<div class="ui-g-12 ui-fluid contact-form">
					
					<div class="ui-g-6">
						<p:fieldset id="fsParametros" legend="Por favor ingrese los datos solicitados" >
							<p:panelGrid columns="2" style="width:100%" styleClass="gridSinBordes"  >
							
								<h:outputText value="Año Cierre (YYYY):" />
								<p:inputMask value="#{cxcCarteraVenxVenSinEmpRelaController.anoHasta}" size="4" mask="9999">
									<p:ajax event="change" partialSubmit="true" process="@this"></p:ajax>
								</p:inputMask>
								
								<h:outputText value="Mes Cierre (MM):" />
								<p:inputMask value="#{cxcCarteraVenxVenSinEmpRelaController.mesHasta}" size="2" mask="99">
									<p:ajax event="change" partialSubmit="true" process="@this"></p:ajax>
								</p:inputMask>
							</p:panelGrid>
						</p:fieldset>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
