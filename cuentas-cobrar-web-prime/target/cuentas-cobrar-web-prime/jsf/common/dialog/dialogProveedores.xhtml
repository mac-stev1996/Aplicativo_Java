<html xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://java.sun.com/jsf/html"
  xmlns:ui="http://java.sun.com/jsf/facelets"
  xmlns:p="http://primefaces.org/ui"
  xmlns:f="http://java.sun.com/jsf/core">
<head>	
	<script type="text/javascript">
		function mayus(e) {
		    e.value = e.value.toUpperCase();
		}
	</script>
</head>
<ui:composition>
	<h:panelGrid id="idPanelProveedores" columns="1">		
		<p:dataTable id="idTableProveedores" var="item" selectionMode="single" multiViewState="true" rowIndexVar="row" rows="10" filterDelay="600"	rowKey="#{item.pk}"				
				paginatorPosition="bottom" paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
				paginator="true" lazy="true" value="#{dialogProveedoresController.lazyDataModelProveedores}" selection="#{dialogProveedoresController.proveedor}" >
				
			<p:ajax event="rowSelect" process="@this" partialSubmit="true" update="@(form)" listener="#{dialogProveedoresController.seleccionarProveedor}"/>							
							
			<p:column headerText	="Cedula" filterBy="#{item.cedula}" filterStyle="background:#e3e3e3;width:80%" width="40%">
				<h:outputText value="#{item.cedula}" />
			</p:column>
			<p:column headerText="Nombre" filterBy="#{item.nombre}" filterStyle="background:#e3e3e3;width:80%" width="60%">
				<h:outputText value="#{item.nombre}" />
			</p:column>
				
		</p:dataTable>					
	</h:panelGrid>						
</ui:composition>
</html>
