<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<style type="text/css">
body {
	font-size: 10px;
}

body .ui-toolbar {
	padding: 5px;
}

.columAlignCenter {
	text-align: center;
}

.columAlignRight {
	text-align: right;
}
</style>
</h:head>
<h:body>
	<p:growl id="growl" showDetail="true" sticky="true" life="5000" />
	<h:form>
		<p:toolbar>
			<f:facet name="left">
				<i class="fa fa-users fa-3x"></i>
				<h:outputLabel style="font-size: 15px;"
					value=" CANCELACION DE CLIENTES" />
			</f:facet>

			<f:facet name="right">
				<p:commandButton style="font-size: 12px;" value="Aprobar"
					partialSubmit="true"
					update=":#{p:component('idTblLisLiquidacionPago')}, :#{p:component('growl')}"
					process="@this, :#{p:component('idTblLisLiquidacionPago')}"
					actionListener="#{cancelacionAutomaticaClientesController.realizarAprobacion}"
					rendered="#{cancelacionAutomaticaClientesController.usuarioAdministrador}"
					icon="fa fa-check-square-o">
					<p:confirm header="Confirmacion"
						message="Se procedera a la aprobacion!!!" icon="ui-icon-alert" />
				</p:commandButton>

				<p:commandButton style="font-size: 12px;" value="Enviar"
					partialSubmit="true"
					update=":#{p:component('idTblLisLiquidacionPago')}, :#{p:component('growl')}"
					process="@this, :#{p:component('idTblLisLiquidacionPago')}"
					actionListener="#{cancelacionAutomaticaClientesController.enviarAprobacion}"
					icon="fa fa-send-o">
					<p:confirm header="Confirmacion"
						message="Se enviara a aprobacion los registros seleccionados."
						icon="ui-icon-alert" />
				</p:commandButton>

				<p:commandButton style="font-size: 12px;" value="Nuevo"
					icon="fa fa-file-text-o"
					action="/jsf/mantenimiento/formCancelacionAutomaticaDiarios.xhtml">
					<f:param name="new" value="true" />
				</p:commandButton>
			</f:facet>

		</p:toolbar>
		<p:dataTable id="idTblLisLiquidacionPago" emptyMessage="Sin Registros"
			value="#{cancelacionAutomaticaClientesController.listLiquidacionPago}"
			var="item">
			<p:column headerText="SECUENCIA" styleClass="columAlignCenter">
				<p:outputLabel value="#{item.secuencia}"></p:outputLabel>
			</p:column>
			<p:column headerText="FECHA" styleClass="columAlignCenter">
				<p:outputLabel value="#{item.fecha}">
					<f:convertDateTime
						locale="#{cancelacionAutomaticaClientesController.locale}"
						pattern="dd-MM-yyyy HH:mm:ss" />
				</p:outputLabel>
			</p:column>
			<p:column headerText="CLIENTE" styleClass="columAlignCenter">
				<p:outputLabel value="#{item.cliente.clientePK.noCliente}"></p:outputLabel>
			</p:column>
			<p:column headerText="CEDULA" styleClass="columAlignCenter">
				<p:outputLabel value="#{item.cliente.cedula}"></p:outputLabel>
			</p:column>
			<p:column headerText="NOMBRE">
				<p:outputLabel value="#{item.cliente.nombre}"></p:outputLabel>
			</p:column>
			<p:column headerText="ESTADO" styleClass="columAlignCenter">
				<p:outputLabel value="#{item.descripcionEstado}"></p:outputLabel>
			</p:column>
			<p:column headerText="TOTAL" styleClass="columAlignRight">
				<p:outputLabel value="#{item.total}"></p:outputLabel>
			</p:column>
			<p:column styleClass="columAlignCenter">
				<p:selectBooleanCheckbox value="#{item.seleccionado}" rendered="#{!item.estado.equals('A')}">
				</p:selectBooleanCheckbox>
			</p:column>
		</p:dataTable>

		<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
			<p:commandButton value="Yes" type="button"
				styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
			<p:commandButton value="No" type="button"
				styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
		</p:confirmDialog>
	</h:form>

	<h:outputStylesheet name="css/layout-lightblue.css"
		library="serenity-layout" />
</h:body>
</html>
