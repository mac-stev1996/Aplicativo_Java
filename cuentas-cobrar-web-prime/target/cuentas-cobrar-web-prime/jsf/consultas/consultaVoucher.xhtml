<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/jsf/templates/bodyTemplate.xhtml">

	<ui:define name="title">
		Consulta de Vouchers
	</ui:define>

	<ui:define name="buttons">
		<h:form id="frmButtons">
			<p:commandButton icon="fa fa-refresh" partialSubmit="true"
				process="@this, :idForm"
				actionListener="#{consultaVoucherController.init}"
				title="limpiar datos consulta" update="idForm :frmButtons" />
			<p:commandButton id="btnConsultar" value="Buscar"
				partialSubmit="true"
				actionListener="#{consultaVoucherController.buscar}"
				process="@this, :idForm" update=":idForm, :frmButtons" />
		</h:form>
	</ui:define>

	<ui:define name="content">
		<style>
.w25 {
	width: 25%;
}

.verde {
	background-color: #03f44d !important;
}
</style>
		<script type="text/javascript">
		function mayus(e) {
		    e.value = e.value.toUpperCase();
		}
	
	</script>
		<h:form id="idForm">

			<div class="ui-g dashboard">
				<div class="ui-g-12 ui-fluid contact-form">
					<div class="ui-g-12">
						<p:panelGrid columns="2" style="width: 50%;">
							<p:column>
								<p:commandLink title="Seleccionar cliente"
									action="#{consultaVoucherController.cargarClientes}"
									value="Cliente:" style="font-weight:bold;"
									update=":frmClientes" />
							</p:column>
							<p:column>
								<p:outputPanel autoUpdate="true">
									<p:inputText
										value="#{consultaVoucherController.cliente.cedula} / #{consultaVoucherController.cliente.nombre}"
										maxlength="100" style="width: 100%;" readonly="true" />
								</p:outputPanel>
							</p:column>
						</p:panelGrid>
						<p:panelGrid columns="10">
							<p:outputLabel value="No Voucher:" styleClass="bold" />
							<p:inputText value="#{consultaVoucherController.noVoucher}" />
							<p:outputLabel value="No Recap:" styleClass="bold" />
							<p:inputText value="#{consultaVoucherController.noRecap}" />
							<p:outputLabel value="Fecha Inicio:" styleClass="bold" />
							<p:calendar navigator="true" pattern="dd/MM/yyyy"
								value="#{consultaVoucherController.fechaInicio}"
								showButtonPanel="true"></p:calendar>
							<p:outputLabel value="Fecha Fin:" styleClass="bold" />
							<p:calendar navigator="true" pattern="dd/MM/yyyy"
								value="#{consultaVoucherController.fechaFin}"
								showButtonPanel="true"></p:calendar>
						</p:panelGrid>
					</div>
				</div>
				<div class="ui-g-12">

					<p:dataTable id="tblContatos" widgetVar="tblContatos"
						emptyMessage="No existen registros"
						value="#{consultaVoucherController.listadoVouchers}" var="item"
						rowIndexVar="var" paginator="true" paginatorAlwaysVisible="false"
						filterDelay="1000" rows="10" paginatorPosition="bottom"
						rowStyleClass="#{item[13]}"
						paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}">

						<p:column headerText="Cedula Cliente" width="11%"
							style="text-align: center;">
							<p:outputLabel value="#{item[3]}" />
						</p:column>

						<p:column headerText="Nombre Cliente" width="30%"
							style="text-align: center;">
							<p:outputLabel value="#{item[4]}" />
						</p:column>
						<p:column headerText="Recap" width="10%"
							style="text-align: center;">
							<p:outputLabel value="#{item[5]}" />
						</p:column>

						<p:column headerText="Voucher" width="10%"
							style="text-align: center;">
							<p:outputLabel value="#{item[6]}" />
						</p:column>
						<p:column headerText="Emisor" width="11%"
							style="text-align: center;">
							<p:outputLabel value="#{item[7]}" />
						</p:column>

						<p:column headerText="Nombre Emisor" width="30%"
							style="text-align: center;">
							<p:outputLabel value="#{item[8]}" />
						</p:column>
						<p:column headerText="Porcentaje" width="10%"
							style="text-align: center;">
							<p:outputLabel value="#{item[9]}" />
						</p:column>
						<p:column headerText="Comision" width="10%"
							style="text-align: center;">
							<p:outputLabel value="#{item[10]}" />
						</p:column>
						<p:column headerText="Monto" width="10%"
							style="text-align: center;">
							<p:outputLabel value="#{item[11]}" />
						</p:column>
						<p:column headerText="Saldo" width="10%"
							style="text-align: center;">
							<p:outputLabel value="#{item[12]}" />
						</p:column>
						<p:column headerText="Fecha" width="10%"
							style="text-align: center;">
							<p:outputLabel value="#{item[1]}">
								<f:convertDateTime pattern="dd/MM/yyyy" />
							</p:outputLabel>
						</p:column>
					</p:dataTable>

				</div>

			</div>
		</h:form>
		<ui:include src="/jsf/common/dialog/dialogClientes.xhtml" />
	</ui:define>

</ui:composition>
