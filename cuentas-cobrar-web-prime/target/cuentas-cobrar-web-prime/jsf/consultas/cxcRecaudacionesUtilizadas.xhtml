<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<style type="text/css">
body {
	font-size: 10px;
}

body .ui-toolbar {
	padding: 5px;
}

.columAlignCenter {
	text-align: center;
}

.columAlignRight {
	text-align: right;
}
</style>
	<script type="text/javascript">
		PrimeFaces.locales["es"] = {
			    closeText: "Cerrar",
			    prevText: "Anterior",
			    nextText: "Siguiente",
			    monthNames: ["Enero","Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"],
			    monthNamesShort: ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"],
			    dayNames: ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"],
			    dayNamesShort: ["Dom", "Lun", "Mar", "Mie", "Jue", "Vie", "Sab"],
			    dayNamesMin: ["Do", "Lu", "Ma", "Mi", "Ju", "Vi", "Sa"],
			    weekHeader: "Semana",
			    firstDay: 0,
			    isRTL: false,
			    showMonthAfterYear: false,
			    yearSuffix: "",
			    timeOnlyTitle: "Solo hora",
			    timeText: "Tiempo",
			    hourText: "Hora",
			    minuteText: "Minuto",
			    secondText: "Segundo",
			    currentText: "Fecha actual",
			    ampm: false,
			    month: "Mes",
			    week: "Semana",
			    day: "Día",
			    allDayText : "Todo el día"
			};

		</script>
</h:head>
<h:body>
	<p:ajaxStatus onstart="PF('statusDialog').show()"
		onsuccess="PF('statusDialog').hide()"
		onerror="PF('statusDialog').hide()" />

	<p:dialog widgetVar="statusDialog" modal="true" draggable="false"
		closable="false" resizable="false" showHeader="false">
		<h:graphicImage value="/common/imgs/gifs/ajaxloadingbar.gif" />
	</p:dialog>
		<p:growl id="idGrowl" globalOnly="true" autoUpdate="true"
		widgetVar="groMessages" showDetail="true" life="5000" />
	
	<h:form id="idForm">
		<p:toolbar>
			<f:facet name="left">
				<h:outputLabel style="font-size: 15px;" value="REGISTRO LOTE EN RECAUDACIONES" />
			</f:facet>

			<f:facet name="right">
			<p:commandButton  title="Agregar Lote" styleClass="green-btn" icon="fa fa-plus" value="Lote" action="#{cxcRecaudacionesUtilizadasController.abrirRecaudacion}" update="PnlRecaudacion"></p:commandButton>
			<p:commandButton value="Limpiar" icon="fa fa-refresh"
					update="idForm" action="#{cxcRecaudacionesUtilizadasController.limpiar}"></p:commandButton>
					
			</f:facet>

		</p:toolbar>

		<h:panelGrid columns="5">
			<f:facet name="header">
				<h:outputText value="Filtros de B&#250;squeda"></h:outputText>
			</f:facet>
			<h:outputText value="Por Fecha: " style="font-weight: bold;"></h:outputText>
			<h:panelGrid columns="2">
				<p:calendar title="Fecha "
					value="#{cxcRecaudacionesUtilizadasController.fechaInicial}"
					autocomplete="off" locale="es"></p:calendar>
			</h:panelGrid>
			
					<p:spacer width="20" height="5"></p:spacer>
			<p:commandButton value="Buscar" icon="fa fa-search"
				styleClass="orange-btn"
				action="#{cxcRecaudacionesUtilizadasController.buscarDiariosCriterios}"
				update="idForm:idTblDiarios"></p:commandButton>
		</h:panelGrid>
		

		<p:dataTable id="idTblDiarios" emptyMessage="Sin Registros"
			value="#{cxcRecaudacionesUtilizadasController.recaudaciones}" var="item"
			paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
			rows="10" paginator="true">
			<p:column headerText="Banco " styleClass="columAlignCenter"
				width="100">
				<p:outputLabel value="#{item.descrip}"></p:outputLabel>
			</p:column>
			<p:column headerText="Cuenta " styleClass="columAlignCenter">
				<p:outputLabel value="#{item.cuenta}"></p:outputLabel>
			</p:column>
			<p:column headerText="Documento " styleClass="columAlignCenter">
				<p:outputLabel value="#{item.noFisico}"></p:outputLabel>
			</p:column>
			<p:column headerText="Fecha Deposito " styleClass="columAlignCenter">
				<p:outputLabel value="#{item.fechaDeposito}">
					<f:convertDateTime pattern="dd-MM-yyyy" />
				</p:outputLabel>
			</p:column>
			<p:column headerText="Fecha " styleClass="columAlignCenter">
				<p:outputLabel value="#{item.fecha}">
				<f:convertDateTime pattern="dd-MM-yyyy" />
				</p:outputLabel>
			</p:column>
			<p:column headerText="Cedula " styleClass="columAlignCenter">
				<p:outputLabel value="#{item.cedula}"></p:outputLabel>
			</p:column>
			<p:column headerText="Cliente " styleClass="columAlignCenter" width="150">
				<p:outputLabel value="#{item.nombre}"></p:outputLabel>
			</p:column>
			<p:column headerText="Valor " styleClass="columAlignCenter"
				width="90">
				<p:outputLabel value="#{item.valor}" ></p:outputLabel>
			</p:column>
			<p:column headerText="Lote " styleClass="columAlignCenter"
				width="90">
				<p:outputLabel value="#{item.lote}" rendered="#{item.lote != null}"></p:outputLabel>
				
			</p:column>
			
		</p:dataTable>

		<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
			<p:commandButton value="Yes" type="button"
				styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
			<p:commandButton value="No" type="button"
				styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
		</p:confirmDialog>

	</h:form>

	<p:dialog header="Lote de Recaudacion" widgetVar="DlgRecaudacion" modal="true"
		showEffect="fade" hideEffect="fade" resizable="true"  position="center center" closeOnEscape="true">

		<h:form id="PnlRecaudacion">
			<h:panelGrid columns="2">
				<h:outputText value="Fecha Lote: "></h:outputText>
				<p:outputLabel value="#{cxcRecaudacionesUtilizadasController.fechaInicial}">
					<f:convertDateTime pattern="dd-MM-yyyy" />
				</p:outputLabel>
				<h:outputText value="Lote: "></h:outputText>
				<p:inputText value="#{cxcRecaudacionesUtilizadasController.lote}" />
				<h:outputText value="Valor Total Lote: "></h:outputText>
				<p:inputText value="#{cxcRecaudacionesUtilizadasController.totalLote}" />
			
			</h:panelGrid>

			<br />
			<center>
				<p:commandButton value="Guardar"
					action="#{cxcRecaudacionesUtilizadasController.guardarLote}"
					title="Agregar Lote" process="PnlRecaudacion" partialSubmit="true"
					 update="idForm:idTblDiarios"></p:commandButton>
			</center>
		</h:form>
	</p:dialog>


	<h:outputStylesheet name="css/layout-lightblue.css"
		library="serenity-layout" />
</h:body>
</html>
