<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/jsf/templates/bodyTemplate.xhtml">

	<ui:define name="title">
		Consulta Cupo Post Venta 
	</ui:define>

	<ui:define name="buttons">
		<h:form id="frmBotones">
			<p:commandButton icon="fa fa-undo" partialSubmit="true"
				process="@this, :frmDocHistoricos"
				actionListener="#{consultaCupoPostVentController.init}"
				title="limpiar datos consulta"
				update=":frmDocHistoricos :frmBotones" />
			<p:commandButton id="btnConsultar" value="Consultar"
				partialSubmit="true"
				action="#{consultaCupoPostVentController.buscar}"
				process="@this, :frmDocHistoricos"
				update=":frmDocHistoricos:dtDocHist, :frmBotones, :frmDocHistoricos:dtPago, :frmDocHistoricos:cupo" />
		</h:form>
	</ui:define>

	<ui:define name="content">
		<style type="text/css">
form#frmBotones button {
	padding: 0 6px !important;
	margin-right: 5px !important;
	font-size: 11px !important;
	line-height: 22px !important;
	margin-right: 5px !important;
}

body {
	font-size: 11px !important;
}

input:read-only {
	background-color: #dcecf5;
}

body .ui-datatable.ui-datatable-scrollable thead tr th {
	font-size: 12px !important;
}

.tblHistorico tbody tr td {
	font-size: 9px !important;
	padding: 4px 7px !important;
}

.ui-inputnumber input {
	text-align: right;
	width: 100%;
}
</style>
		<script type="text/javascript">
			function showStatus() {
				PF('statusDialog').show();
			}

			function hideStatus() {
				PF('statusDialog').hide();
			}
		</script>
		<h:form id="frmDocHistoricos">
			<p:outputPanel autoUpdate="true">
				<div class="ui-g dashboard">
					<div class="ui-g-12 ui-fluid contact-form">
						<div class="ui-g-12">
							<h:panelGrid columns="4">
								<p:commandLink title="Seleccionar cliente"
									action="#{consultaCupoPostVentController.cargarClientes}"
									value="Cliente:" style="font-weight:bold;"
									update=":frmClientes" />
								<p:inputText
									value="#{consultaCupoPostVentController.cliente.clientePK.noCliente}"
									readonly="true" style="width:60px" />
								<p:inputText
									value="#{consultaCupoPostVentController.cliente.cedula}"
									readonly="true" style="width:100px" />
								<p:inputText
									value="#{consultaCupoPostVentController.cliente.nombre}"
									readonly="true" style="width:300px" />
							</h:panelGrid>
							<h:panelGrid columns="2">
								<p:outputLabel value="Linea Negocio:" styleClass="bold" />
								<p:selectOneMenu id="somLineaNeg" filter="true"
									filterMatchMode="contains"
									value="#{consultaCupoPostVentController.lineaNegocio}">
									<f:selectItem itemLabel="Todos" itemValue="%" />
									<f:selectItems
										value="#{consultaCupoPostVentController.lineasNegocio}"
										var="lineaNeg" itemValue="#{lineaNeg.lineaNegocioPK.noLinea}"
										itemLabel="#{lineaNeg.lineaNegocioPK.noLinea} - #{lineaNeg.descripcion}" />
								</p:selectOneMenu>

								<p:outputLabel value="Desde:" styleClass="bold" />
								<h:panelGrid columns="3">
									<p:calendar placeholder="Desde" locale="es"
										value="#{consultaCupoPostVentController.fechaDesde}"
										pattern="dd/MM/yyyy" />
									<p:outputLabel value="Hasta:" styleClass="bold" />
									<p:calendar placeholder="Hasta" locale="es"
										value="#{consultaCupoPostVentController.fechaHasta}"
										pattern="dd/MM/yyyy" />
								</h:panelGrid>
							</h:panelGrid>
							<h:panelGrid columns="2" id="cupo"  rendered="#{consultaCupoPostVentController.activarCupoRepuestos}">
								<p:outputLabel value="Cupo:" styleClass="bold" />
								<p:outputLabel
									value="#{consultaCupoPostVentController.cupoRepuestos}"></p:outputLabel>
							</h:panelGrid>
						</div>
					</div>
				</div>
			</p:outputPanel>
			<div class="ui-g-12">
				<div class="ui-g-6">
					<p:dataTable id="dtDocHist" widgetVar="dtDocHist"
						styleClass="tblHistorico"
						value="#{consultaCupoPostVentController.listadoFacturas}"
						var="item" emptyMessage="No hay documentos" scrollable="true"
						scrollHeight="200"
						paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
						rows="5" paginator="true" paginatorPosition="bottom">
						<f:facet name="header">
           				 Facturas Cliente
        			</f:facet>

						<p:column headerText="Tipo Doc" width="3%">
							<p:outputLabel value="#{item[0]}" />
						</p:column>
						<p:column headerText="Descripcion Doc" width="20%">
							<p:outputLabel value="#{item[1]}" />
						</p:column>

						<p:column headerText="Serie" width="3%">
							<p:outputLabel value="#{item[5]}" />
						</p:column>
						<p:column headerText="No Fisico" width="8%">
							<p:outputLabel value="#{item[6]}" />
						</p:column>
						<p:column headerText="Fecha" width="8%">
							<p:outputLabel value="#{item[2]}">
								<f:convertDateTime pattern="dd/MM/yyyy" />
							</p:outputLabel>
						</p:column>
						<p:column headerText="Linea Negocio" width="5%">
							<p:outputLabel value="#{item[15]}" />
						</p:column>

						<p:column headerText="Total Bruto" width="5%">
							<p:outputLabel value="#{item[9]}" style="float:right" />
						</p:column>
						<p:column headerText="Descuento" width="10%">
							<p:outputLabel value="#{item[8]}" style="float:right" />
						</p:column>
						<p:column headerText="Sub Total" width="10%">
							<p:outputLabel value="#{item[7]}" style="float:right" />
						</p:column>

						<p:column headerText="Impuesto" width="5%">
							<p:outputLabel value="#{item[10]}" style="float:right" />
						</p:column>

						<p:column headerText="Total" width="4%">
							<p:outputLabel value="#{item[11]}" />
						</p:column>

						<p:column width="5%" headerText="Doc">
							<p:commandButton style="float: right;" icon="fa fa-file-pdf-o"
							partialSubmit="true" styleClass="boton"
							actionListener="#{consultaCupoPostVentController.imprimirRide(item)}"
							title="Factura PDF" id="idPdf" />
						</p:column>

					</p:dataTable>
				</div>
				<div class="ui-g-6">
					<p:dataTable id="dtPago" widgetVar="dtPago"
						value="#{consultaCupoPostVentController.listadoPagos}" var="item"
						emptyMessage="No hay documentos" scrollable="true"
						scrollHeight="200" styleClass="tblHistorico"
						paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
						rows="5" paginator="true" paginatorPosition="bottom">
						<f:facet name="header">
           				 Pagos Cliente
        			</f:facet>
						<p:column headerText="Origen" width="5%">
							<p:outputLabel value="#{item[0]}" />
						</p:column>
						<p:column headerText="Centro" width="10%">
							<p:outputLabel
								value="#{consultaCupoPostVentController.nombreAgencia(item[1])}" />
						</p:column>

						<p:column headerText="Descripcion Doc" width="20%">
							<p:outputLabel value="#{item[6]} / #{item[11]}" />
						</p:column>
						<p:column headerText="No Fisico" width="8%">
							<p:outputLabel value="#{item[8]}" />
						</p:column>
						<p:column headerText="Fecha" width="8%">
							<p:outputLabel value="#{item[3]}">
								<f:convertDateTime pattern="dd/MM/yyyy" />
							</p:outputLabel>
						</p:column>
						<p:column headerText="Linea Negocio" width="5%">
							<p:outputLabel value="#{item[12]}" />
						</p:column>

						<p:column headerText="Pago" width="5%">
							<p:outputLabel value="#{item[5]}" style="float:right" />
						</p:column>
						<p:column headerText="Total" width="5%">
							<p:outputLabel value="#{item[10]}" style="float:right" />
						</p:column>
						<p:column width="5%" headerText="Doc">
							<p:commandButton ajax="false" icon="fa fa-print"
								title="Generar comprobante pago" onclick="form.target='_blank'"
								style="margin-top:1px;height:22px"
								actionListener="#{consultaCupoPostVentController.generarComprobantePago(item)}"
								rendered="#{item[0] eq 'CAJAS'}" />
							<p:commandLink ajax="false" target="_blank"
								action="#{consultaCupoPostVentController.imprimirDiario(item)}"
								rendered="#{item[0] eq 'DIARIO A'}">
								<p:commandButton icon="fa fa-print" title="Descargar Documento"
									ajax="false">
								</p:commandButton>
							</p:commandLink>
						</p:column>

					</p:dataTable>
				</div>
			</div>
		</h:form>
		<ui:include src="/jsf/common/dialog/dialogClientes.xhtml" />
	</ui:define>
</ui:composition>
