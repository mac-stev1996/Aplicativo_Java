<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/jsf/templates/bodyTemplate.xhtml">
	<ui:define name="title">
		Seguimiento Cobranzas
	</ui:define>

	<ui:define name="buttons">
		<h:form id="frmBotones">
			<p:commandButton id="refesh" partialSubmit="true"
				process="@this,:frmCobranzas" update="frmBotones, :frmCobranzas"
				icon="fa fa-refresh"
				action="#{seguimientoCobranzasController.refrescar}" />
			<p:commandButton value="Buscar" styleClass="orange-btn"
				update=":frmCobranzas" id="buscar"
				action="#{seguimientoCobranzasController.buscar}" />

		</h:form>
	</ui:define>
	<ui:define name="content">
		<style type="text/css">
body {
	font-size: 10px;
}

.ui-g-12 {
	padding: .2em .5em !important;
}

.w5 {
	width: 5%;
}

.dashboard .contact-form .ui-button {
	margin-top: 0px;
}

body .ui-button .ui-button-text {
	font-size: 10px !important;
}

.table thead th, .table tbody tr td {
	font-size: 10px !important;
	padding: 2px 7px !important;
}

body .ui-messages>div {
	padding: 4px 4px;
	margin: 2px 2px;
}
</style>
		<h:form id="frmCobranzas" onkeypress="return event.keyCode!=13">
			<p:messages showDetail="true" autoUpdate="true" closable="true"
				showSummary="true" />
			<p:panel id="pnlPedido">
				<div class="ui-g dashboard">
					<div class="ui-g-12 ui-fluid contact-form">
						<div class="ui-g-12">
								<h:panelGrid columns="6" style="width:100%">
									<p:outputLabel value="Antigüedad: " styleClass="bold" />
									<p:selectOneMenu
										value="#{seguimientoCobranzasController.rangoAntiguedad}"
										filter="true" filterMatchMode="contains" autoWidth="false">
										<f:selectItem itemLabel="Seleccione" noSelectionOption="true" />
										<f:selectItems
											value="#{seguimientoCobranzasController.listadoRangoAntiguedad}"
											var="a" itemValue="#{a[1]}" itemLabel="#{a[0]}" />
										<p:ajax event="change" process="@this" partialSubmit="true"
											global="false"></p:ajax>
									</p:selectOneMenu>
									<p:outputLabel value="Linea de Negocio: " styleClass="bold" />
									<p:selectOneMenu
										value="#{seguimientoCobranzasController.lineaNegocioSelected}"
										filter="true" filterMatchMode="contains" autoWidth="false">
										<f:selectItem itemLabel="Seleccione" itemValue="" />
										<f:selectItems
											value="#{seguimientoCobranzasController.listadoLineasNegocio}"
											var="l" itemValue="#{l.lineaNegocioPK.noLinea}"
											itemLabel="#{l.lineaNegocioPK.noLinea} - #{l.descripcion}" />
										<p:ajax event="change" process="@this" partialSubmit="true"
											global="false"></p:ajax>
									</p:selectOneMenu>
									
									<p:outputLabel value="Incluye Alistamiento: " styleClass="bold" />
									<p:selectOneMenu
										value="#{seguimientoCobranzasController.incluyeAlistamiento}" 
										autoWidth="true">
										<f:selectItem itemLabel="Seleccione" itemValue="" noSelectionOption="true"/>
										<f:selectItem itemLabel="Si" itemValue="true"/>
										<f:selectItem itemLabel="No" itemValue="false"/>
										<p:ajax event="change" process="@this" partialSubmit="true"
											global="false"></p:ajax>
									</p:selectOneMenu>
									
									<p:outputLabel value="Canales: " styleClass="bold" />
									<p:selectOneMenu
										value="#{seguimientoCobranzasController.canal}" filter="true"
										filterMatchMode="contains" autoWidth="false">
										<f:selectItem itemLabel="Seleccione" noSelectionOption="true" />
										<f:selectItems
											value="#{seguimientoCobranzasController.listadoCanales}"
											var="t" itemValue="#{t.paramDetPK.codigoDet}"
											itemLabel="#{t.paramDetPK.codigoDet} - #{t.descripcion}" />
										<p:ajax event="change" process="@this" partialSubmit="true"
											global="false"></p:ajax>
									</p:selectOneMenu>


									<p:outputLabel value="Tipo Financiamiento: " styleClass="bold" />
									<p:selectOneMenu
										value="#{seguimientoCobranzasController.tipoFinanciamiento}"
										filter="true" filterMatchMode="contains" autoWidth="false">
										<f:selectItem itemLabel="Seleccione" noSelectionOption="true" />
										<f:selectItems
											value="#{seguimientoCobranzasController.listadoTipoFinanciamiento}"
											var="p" itemValue="#{p.arcctfPK.tipo}"
											itemLabel="#{p.arcctfPK.tipo} - #{p.entidad}" />
										<p:ajax event="change" process="@this" partialSubmit="true"
											global="false"></p:ajax>
									</p:selectOneMenu>
									
									<p:outputLabel></p:outputLabel>
									<p:outputLabel></p:outputLabel>

									<p:commandLink process="pnlPedido"
										actionListener="#{seguimientoCobranzasController.cargarClientes}"
										value="Cliente" style="font-weight: bold;"
										title="Click para Seleccionar Cliente" update=":frmClientes">
									</p:commandLink>
									<p:outputPanel autoUpdate="true">
										<p:inputText id="codigo"
											value="#{seguimientoCobranzasController.cliente.cedula} - #{seguimientoCobranzasController.cliente.nombre}"
											readonly="true" style="width:100%" />
									</p:outputPanel>
									<p:outputLabel value="Clase: " styleClass="bold" />
									<p:selectOneMenu
										value="#{seguimientoCobranzasController.clase}" filter="true"
										filterMatchMode="contains" autoWidth="false">
										<f:selectItem itemLabel="Seleccione" noSelectionOption="true" />
										<f:selectItems
											value="#{seguimientoCobranzasController.listaClaseClientes}"
											var="c" itemValue="#{c.cxcClaseClientePK.clase}"
											itemLabel="#{c.cxcClaseClientePK.clase} - #{c.descripcion}" />
										<p:ajax event="change" process="@this" partialSubmit="true"
											global="false"></p:ajax>
									</p:selectOneMenu>
									
									<p:outputLabel></p:outputLabel>
									<p:outputLabel></p:outputLabel>
									
									<p:outputLabel value="Agencias: " styleClass="bold" />
									<p:selectOneMenu
										value="#{seguimientoCobranzasController.agencia}"
										filter="true" filterMatchMode="contains" autoWidth="false">
										<f:selectItem itemLabel="Seleccione" noSelectionOption="true" />
										<f:selectItems
											value="#{seguimientoCobranzasController.listadoAgencias}"
											var="a" itemValue="#{a.pk.codigo}" itemLabel="#{a.nombre}" />
										<p:ajax event="change" process="@this" partialSubmit="true"
											global="false"></p:ajax>
									</p:selectOneMenu>
									<p:commandLink process="pnlPedido"
										actionListener="#{seguimientoCobranzasController.cargarZonas}"
										value="Zonas" style="font-weight: bold;"
										title="Click para Seleccionar Zona" update=":frmZonas">
									</p:commandLink>
									<p:outputPanel autoUpdate="true">
										<p:inputText
											value="#{seguimientoCobranzasController.zonasDto.zona} - #{seguimientoCobranzasController.zonasDto.nombreVendedorDirecto}"
											readonly="true" style="width:100%" />
									</p:outputPanel>
								</h:panelGrid>
						</div>
						<div class="ui-g-12">
							<p:dataTable id="detCartera" var="item" rowIndexVar="row"
								styleClass="table"
								value="#{seguimientoCobranzasController.listadoCartera}"
								rowKey="#{item}" emptyMessage="No existe detalle de Cartera"
								paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
								paginator="true" rows="15" rowsPerPageTemplate="20,30,40"
								paginatorPosition="bottom" sortBy="#{item[2]}">
								<p:column width="2%"
									style="color:blue; font-weight: bold; text-align: center !important">
									<p:commandLink value="#{row + 1}" partialSubmit="true"
										style="font-size: 12px; font-weight: bold;" process="@this"
										actionListener="#{seguimientoCobranzasController.detalleDeuda(item)}">
									</p:commandLink>
								</p:column>
								<p:column headerText="No Cliente" width="8%"
									filterBy="#{item[0]}" filterMatchMode="contains"
									sortBy="#{item[0]}">
									<p:outputLabel value="#{item[0]}" />
								</p:column>
								<p:column headerText="Cédula" width="10%" filterBy="#{item[1]}"
									filterMatchMode="contains" sortBy="#{item[1]}">
									<p:outputLabel value="#{item[1]}" />
								</p:column>
								<p:column headerText="Nombre Cliente" width="25%"
									filterBy="#{item[2]}" filterMatchMode="contains"
									sortBy="#{item[2]}">
									<p:outputLabel value="#{item[2]}" />
								</p:column>
								<p:column headerText="Saldo Total" width="10%"
									styleClass="number">
									<p:outputLabel value="#{item[3]}">
										<f:convertNumber pattern="¤#,##0.00" />
									</p:outputLabel>
								</p:column>
								<p:column headerText="Saldo Vencido" width="10%"
									styleClass="number">
									<p:outputLabel value="#{item[4]}">
										<f:convertNumber pattern="¤#,##0.00" />
									</p:outputLabel>
								</p:column>
								<p:column headerText="Linea Negocio Real" width="10%"
									styleClass="number">
									<p:outputLabel value="#{item[5]}">
									</p:outputLabel>
								</p:column>
								<p:column width="5%">
									<p:commandButton partialSubmit="true" value="Det. Seguimiento"
										process="@this" style="width:100%"
										action="#{seguimientoCobranzasController.abrirDialogoSeguimientoCliente(item)}"
										update=":dlgDetalle" styleClass="boton" />
								</p:column>
							</p:dataTable>
						</div>
					</div>
				</div>
			</p:panel>
		</h:form>
		<p:dialog widgetVar="dlgDetalle" id="dlgDetalle"
			header="Detalle Seguimiento" resizable="true" modal="true"
			closable="true" appendTo="@(body)" width="700" height="450"
			closeOnEscape="true">
			<h:form id="idFrmDetalle">
				<div class="ui-g dashboard">
					<div class="ui-g-12 ui-fluid contact-form">
						<div class="ui-g-12">
							<p:dataTable id="detSeguimiento" var="item" rowIndexVar="row"
								styleClass="table"
								value="#{seguimientoCobranzasController.listadoSegClientes}"
								rowKey="#{item}"
								emptyMessage="No existe detalle Seguimiento de Cartera"
								paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
								paginator="true" rows="15" rowsPerPageTemplate="20,30,40"
								paginatorPosition="bottom">
								<p:column headerText="Comentario" width="55%">
									<p:outputLabel value="#{item[0]}" />
								</p:column>
								<p:column headerText="Usuario" width="15%">
									<p:outputLabel value="#{item[1]}">

									</p:outputLabel>
								</p:column>
								<p:column headerText="Usuario Cobro" width="15%">
									<p:outputLabel value="#{item[4]}">

									</p:outputLabel>
								</p:column>
								<p:column headerText="Fecha Seguimiento" width="15%">
									<p:outputLabel value="#{item[2]}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm" />
									</p:outputLabel>
								</p:column>
								<p:column headerText="Fecha  prox. Seguimiento" width="15%">
									<p:outputLabel value="#{item[3]}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm" />
									</p:outputLabel>
								</p:column>
							</p:dataTable>
						</div>
					</div>
				</div>
			</h:form>
		</p:dialog>
		<ui:include src="/jsf/common/dialog/dialogClientes.xhtml" />
		<ui:include src="/jsf/common/dialog/dialogZonas.xhtml" />
	</ui:define>
</ui:composition>
