<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core">

	<p:panelGrid columns="1" id="pnlContactos" width="100%" layout="grid"
		columnClasses="ui-grid-col-12">
		<p:panel styleClass="noborder">
			<p:toolbar style="background: #0288d1 !important; background-color: #0288d1 !important; color: #ffffff !important;">
				<f:facet name="left">
					<h:panelGroup layout="block"
						style="display: flex; align-items: center; color: #ffffff !important;">
						<i class="fa fa-edit fa-2x"
							style="color: #ffffff !important; margin-right: 5px;"></i>
						<p:outputLabel
							value=" Registro de información de contactos de vehículos "
							style="font-size: 14px; color: #ffffff !important;" />
					</h:panelGroup>
				</f:facet>

				<f:facet name="right">
					<p:commandButton process="@this" styleClass="orange-btn"
						title="Regresar" icon="fa fa-reply"
						action="#{cxcAsignacionVehiculosController.regresar}"
						update=":idForm" />
				</f:facet>
			</p:toolbar>
			<h:panelGrid columns="2" width="100%">
				<p:fieldset legend="Datos del cliente:" toggleable="false"
					style="font-size:13px;font-weight:bold">
					<h:panelGrid id="pnlInfoCliente" columns="4">
						<p:outputLabel value="No. Cliente: " styleClass="bold" />
						<p:inputText readonly="true"
							value="#{cxcAsignacionVehiculosController.seguimientoVeh.noCliente}" />

						<p:outputLabel value="Cedula: " styleClass="bold" />
						<p:inputText readonly="true" style="width:300px !important"
							value="#{cxcAsignacionVehiculosController.seguimientoVeh.cedulaCliente}" />

						<p:outputLabel value="Nombre: " styleClass="bold" />
						<p:inputText readonly="true" style="width:300px !important"
							value="#{cxcAsignacionVehiculosController.seguimientoVeh.nombreCliente}" />

						<p:outputLabel value="Telefono: " styleClass="bold" />
						<p:inputText readonly="true" style="width:300px !important"
							value="#{cxcAsignacionVehiculosController.seguimientoVeh.fonoCliente}" />

						<p:outputLabel value="Email: " styleClass="bold" />
						<p:inputText readonly="true" style="width:300px !important"
							value="#{cxcAsignacionVehiculosController.seguimientoVeh.emailCliente}" />

						<p:column></p:column>
						<p:commandButton value="Agregar Contactos"
							rendered="#{empty cxcAsignacionVehiculosController.listaContactosServicio and empty cxcAsignacionVehiculosController.listaContactosVehiculos and !cxcAsignacionVehiculosController.verBotonContactos}"
							style="width: auto; float: right;" icon="fa fa-user-plus"
							process="@this" id="btnAgrPropietario" styleClass="green-btn"
							action="#{cxcAsignacionVehiculosController.inicializarContactoPropietario}"
							oncomplete="PF('dialogConfirmRegpropietario').show();"
							update="@this :idForm:diaContactosVeh" />


					</h:panelGrid>
				</p:fieldset>

				<p:fieldset legend="Datos del vehículo:" toggleable="false"
					style="font-size:13px;font-weight:bold">
					<h:panelGrid id="pnlInfoVehiculo" columns="2">
						<p:outputLabel value="Placa: " styleClass="bold" />
						<p:inputText readonly="true" style="width:250px !important"
							value="#{cxcAsignacionVehiculosController.seguimientoVeh.placa}" />

						<p:outputLabel value="Chasis: " styleClass="bold" />
						<p:inputText readonly="true" style="width:250px !important"
							value="#{cxcAsignacionVehiculosController.seguimientoVeh.chasis}" />

						<p:outputLabel value="Modelo: " styleClass="bold" />
						<p:inputText readonly="true" style="width:250px !important"
							value="#{cxcAsignacionVehiculosController.seguimientoVeh.descripcion}" />
					</h:panelGrid>
				</p:fieldset>
			</h:panelGrid>
			<br />
			<p:toolbar id="idToolbarCon" style="border: none; box-shadow: none;">
				<f:facet name="right">
					<p:commandButton value="Agregar Contactos"
						rendered="#{not empty cxcAsignacionVehiculosController.listaContactosServicio  or not empty cxcAsignacionVehiculosController.listaContactosVehiculos or cxcAsignacionVehiculosController.verBotonContactos }"
						style="width: auto; float: right;" icon="fa fa-user-plus"
						process="@this" id="btnAgrConSer" styleClass="green-btn"
						action="#{cxcAsignacionVehiculosController.inicializarContactoServicio}"
						oncomplete="PF('diaContactosVeh').show();"
						update="@this :idForm:diaContactosVeh" />
				</f:facet>
			</p:toolbar>

			<p:fieldset legend="Contactos de Servicio" toggleable="false"
				style="font-weight:bold">
				<p:dataTable id="tblDetContactos" var="item" rowIndexVar="row"
					styleClass="table" widgetVar="wtblDetContactos" rendered="true"
					value="#{cxcAsignacionVehiculosController.listaContactosServicio}"
					rowKey="#{item.codContacto}"
					emptyMessage="No existen contactos de Servico registrados"
					paginator="true" paginatorPosition="bottom"
					paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
					style="margin-bottom:20px">

					<f:facet name="header">
						<h:outputLabel value="CONTACTOS DE SERVICIO"
							style="font-weight: bold;" />
					</f:facet>


					<p:column headerText="No." style="text-align:left" width="5%">
						<p:outputLabel value="#{row + 1}" />
					</p:column>
					<p:column headerText="Nombre Contacto" style="text-align:center"
						width="50%">
						<p:outputLabel value="#{item.nombreContacto}" />
					</p:column>
					<p:column headerText="Telefono Contacto" style="text-align:center"
						width="30%">
						<p:outputLabel value="#{item.telefono}" />
					</p:column>
					<p:column headerText="Email Contacto" style="text-align:center"
						width="40%">
						<p:outputLabel value="#{item.email}" />
					</p:column>
					<p:column headerText="Fecha Registro" style="text-align:center"
						width="30%">
						<p:outputLabel value="#{item.fechaCrea}" />
					</p:column>
					<p:column headerText="Usuario Registra" style="text-align:center"
						width="30%">
						<p:outputLabel value="#{item.usuarioCrea}" />
					</p:column>
					<p:column headerText="Estado" style="text-align:center" width="30%">
						<p:outputLabel value="#{item.estado eq 'A' ? 'Activo':'Inactivo'}" />
					</p:column>
					<p:column headerText="Control"
						style="text-align:center;color:red !important" width="20%">
						<p:commandButton id="btnEditar" icon="fa fa-pencil" title="Editar"
							styleClass="blue-btn" partialSubmit="true" process="@this"
							action="#{cxcAsignacionVehiculosController.editarContacto}"
							update=":idForm" oncomplete="PF('diaContactosVeh').show();">
							<f:setPropertyActionListener value="#{item}"
								target="#{cxcAsignacionVehiculosController.contactoSeleccionado}" />
						</p:commandButton>

						<p:commandButton id="btnEliminar" icon="fa fa-times-circle"
							title="Eliminar" partialSubmit="true" styleClass="red-btn"
							process="@this" oncomplete="PF('diaEliminar').show();">
							<f:setPropertyActionListener value="#{item}"
								target="#{cxcAsignacionVehiculosController.contactoSeleccionado}" />
						</p:commandButton>
					</p:column>
				</p:dataTable>
			</p:fieldset>

			<p:fieldset legend="Contactos de Vehiculo - Usuarios"
				style="font-weight:bold" toggleable="false">
				<p:dataTable id="tblDetConUsuarios" var="item" rowIndexVar="row"
					widgetVar="wtblDetConUsuarios" rendered="true"
					value="#{cxcAsignacionVehiculosController.listaContactosVehiculos}"
					rowKey="#{item.codContacto}"
					emptyMessage="No existen contactos de vehiculos registrados"
					paginator="true" paginatorPosition="bottom"
					paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
					style="margin-bottom:20px">
					<f:facet name="header">
						<h:outputLabel value="CONTACTOS DE VEHÍCULOS"
							style="font-weight: bold;" />
					</f:facet>

					<p:column headerText="No." style="text-align:left" width="5%">
						<p:outputLabel value="#{row + 1}" />
					</p:column>

					<p:column headerText="Nombre Contacto" style="text-align:center"
						width="50%">
						<p:outputLabel value="#{item.nombreContacto}" />
					</p:column>

					<p:column headerText="Telefono Contacto" style="text-align:center"
						width="30%">
						<p:outputLabel value="#{item.telefono}" />
					</p:column>

					<p:column headerText="Email Contacto" style="text-align:center"
						width="40%">
						<p:outputLabel value="#{item.email}" />
					</p:column>

					<p:column headerText="Placa Vehiculo" style="text-align:left"
						width="30%">
						<p:outputLabel value="#{item.placa}" />
					</p:column>

					<p:column headerText="Fecha Registro" style="text-align:center"
						width="30%">
						<p:outputLabel value="#{item.fechaCrea}" />
					</p:column>

					<p:column headerText="Usuario Registra" style="text-align:center"
						width="30%">
						<p:outputLabel value="#{item.usuarioCrea}" />
					</p:column>
					<p:column headerText="Estado" style="text-align:center" width="30%">
						<p:outputLabel value="#{item.estado eq 'A' ? 'Activo':'Inactivo'}" />
					</p:column>
					<p:column headerText="Control"
						style="text-align:center;color:red !important" width="20%">
						<p:commandButton id="btnEditarV" icon="fa fa-pencil"
							title="Editar" styleClass="blue-btn" partialSubmit="true"
							process="@this"
							action="#{cxcAsignacionVehiculosController.editarContacto}"
							update=":idForm" oncomplete="PF('diaContactosVeh').show();">
							<f:setPropertyActionListener value="#{item}"
								target="#{cxcAsignacionVehiculosController.contactoSeleccionado}" />
						</p:commandButton>

						<p:commandButton id="btnEliminarV" icon="fa fa-times-circle"
							title="Eliminar" partialSubmit="true" styleClass="red-btn"
							process="@this" oncomplete="PF('diaEliminar').show();">
							<f:setPropertyActionListener value="#{item}"
								target="#{cxcAsignacionVehiculosController.contactoSeleccionado}" />
						</p:commandButton>
					</p:column>
				</p:dataTable>
			</p:fieldset>

		</p:panel>

	</p:panelGrid>
</ui:composition>
