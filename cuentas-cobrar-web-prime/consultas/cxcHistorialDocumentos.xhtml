<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/jsf/templates/bodyTemplate.xhtml">

	<ui:define name="title">
		Cuentas por Cobrar - Historial de Documentos
	</ui:define>

	<ui:define name="buttons">
		<h:form id="frmButtons">
		</h:form>
	</ui:define>

	<ui:define name="content">
		<style>
.w25 {
	width: 25%;
}
</style>
		<h:form id="idForm">

			<div class="ui-g dashboard">
				<div class="ui-g-12 ui-fluid contact-form">

					<div class="ui-g-6">

						<p:fieldset legend="Buscador">

							<div class="ui-g-12">

								<div class="ui-g-3">
									<p:outputLabel value="No. Transa" />
									<p:inputText id="noDocuFiltro"
										value="#{cxcHistorialDocumentosController.noDocu}" />
								</div>
								<div class="ui-g-3">
									<p:outputLabel value="No. Cliente" />
									<p:inputText id="noClienteFiltro"
										value="#{cxcHistorialDocumentosController.noCliente}" />
								</div>
								<div class="ui-g-3">
									<p:outputLabel value="Cédula" />
									<p:inputText id="cedulaFiltro"
										value="#{cxcHistorialDocumentosController.cedula}" />
								</div>
								<div class="ui-g-3">
									<p:outputLabel value="# Documento" />
									<p:inputText id="noFisicoFiltro"
										value="#{cxcHistorialDocumentosController.noFisico}" />
								</div>
								<div class="ui-g-3">
									<p:outputLabel value="Fecha Desde" />
									<p:calendar id="fechaDesdeFiltro" locale="es"
										pattern="dd/MM/yyyy"
										value="#{cxcHistorialDocumentosController.fechaDesde}" />
								</div>
								<div class="ui-g-3">
									<p:outputLabel value="Fecha Hasta" />
									<p:calendar id="fechaHastaFiltro" locale="es"
										pattern="dd/MM/yyyy"
										value="#{cxcHistorialDocumentosController.fechaHasta}" />
								</div>
								<div class="ui-g-3">
									<p:commandButton title="Buscar" icon="ui-icon ui-icon-search"
										style="margin-top:0px !important"
										process="@this, :idForm:noDocuFiltro, :idForm:noClienteFiltro, :idForm:cedulaFiltro, :idForm:noFisicoFiltro, :idForm:fechaDesdeFiltro, :idForm:fechaHastaFiltro"
										partialSubmit="true"
										actionListener="#{cxcHistorialDocumentosController.buscarDocumentos}"
										update="@this, :idForm:tblBuscador, :idForm:pg, #{p:component('pgBotones')}" />
								</div>

							</div>
							<div class="ui-g-12">

								<p:dataTable id="tblBuscador" widgetVar="tblBuscadorW"
									emptyMessage="No existen registros"
									value="#{cxcHistorialDocumentosController.lista}" var="item"
									selection="#{cxcHistorialDocumentosController.seleccionado}"
									selectionMode="single" rowKey="#{item.noDocu}"
									rowIndexVar="var" styleClass="table table-body"
									paginator="true" paginatorAlwaysVisible="true"
									paginatorPosition="top" filterDelay="1000" rows="10"
									currentPageReportTemplate="{startRecord} - {endRecord} de {totalRecords}"
									paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}">

									<p:ajax event="rowSelect" partialSubmit="true" process="@this"
										listener="#{cxcHistorialDocumentosController.seleccionarDocumento}"
										update="@this, :idForm:pg, #{p:component('pgBotones')}"
										global="false" />

									<p:column headerText="No. Cliente" width="15%">
										<p:outputLabel value="#{item.noCliente}" />
									</p:column>
									<p:column headerText="Cliente" width="30%">
										<p:outputLabel value="#{item.nomCliente}" />
									</p:column>
									<p:column headerText="No. Transa" width="15%">
										<p:outputLabel value="#{item.noDocu}" />
									</p:column>
									<p:column headerText="Tipo Doc" width="10%">
										<p:outputLabel value="#{item.tipoDoc}" />
									</p:column>
									<p:column headerText="Documento" width="15%">
										<p:outputLabel value="#{item.noFisico}" />
									</p:column>
									<p:column headerText="Fecha" width="15%">
										<p:outputLabel value="#{item.fechaDocumento}">
											<f:convertDateTime pattern="dd/MM/yyyy" />
										</p:outputLabel>
									</p:column>
								</p:dataTable>

							</div>

						</p:fieldset>

					</div>

					<div class="ui-g-6">

						<p:fieldset legend="Documento">

							<h:panelGrid id="pg" columns="2" columnClasses="w25,dummy">
								<p:outputLabel value="Centro:" />
								<p:inputText readonly="true" style="width:10% !important"
									value="#{cxcHistorialDocumentosController.seleccionado.centro}" />
								<p:outputLabel value="Grupo:" />
								<h:panelGrid columns="2" width="100%"
									style="padding:0px !important;" columnClasses="w20,dummy">
									<p:inputText readonly="true"
										value="#{cxcHistorialDocumentosController.seleccionado.grupo}" />
									<p:inputText readonly="true"
										value="#{cxcHistorialDocumentosController.seleccionado.nomGrupo}" />
								</h:panelGrid>
								<p:outputLabel value="No. Transa:"
									style="font-size:16px !important;" />
								<p:inputText readonly="true"
									style="font-size:16px !important; width:30% !important"
									value="#{cxcHistorialDocumentosController.seleccionado.noDocu}" />
								<p:outputLabel value="Orígen:" />
								<p:inputText readonly="true" style="width:10% !important"
									value="#{cxcHistorialDocumentosController.seleccionado.origen}" />
								<p:outputLabel value="Cliente:" />
								<h:panelGrid columns="3" width="100%"
									style="padding:0px !important;" columnClasses="w20,w30,w50">
									<p:inputText readonly="true"
										value="#{cxcHistorialDocumentosController.seleccionado.noCliente}" />
									<p:inputText readonly="true"
										value="#{cxcHistorialDocumentosController.seleccionado.cedula}" />
									<p:inputText readonly="true"
										value="#{cxcHistorialDocumentosController.seleccionado.nomCliente}" />
								</h:panelGrid>
								<p:outputLabel value="Tipo Documento:" />
								<h:panelGrid columns="2" width="100%"
									style="padding:0px !important;" columnClasses="w10,w60">
									<p:inputText readonly="true"
										value="#{cxcHistorialDocumentosController.seleccionado.tipoDoc}" />
									<p:inputText readonly="true"
										value="#{cxcHistorialDocumentosController.seleccionado.nomTipoDocumento}" />
								</h:panelGrid>
								<p:outputLabel value="Período:" />
								<h:panelGrid columns="3" width="100%"
									style="padding:0px !important;" columnClasses="w30,w10,w30">
									<p:inputText readonly="true"
										value="#{cxcHistorialDocumentosController.seleccionado.periodo}" />
									<p:outputLabel value="Ruta:" />
									<p:inputText readonly="true"
										value="#{cxcHistorialDocumentosController.seleccionado.ruta}" />
								</h:panelGrid>
								<p:outputLabel value="Moneda:" />
								<p:inputText readonly="true" style="width:40% !important"
									value="#{cxcHistorialDocumentosController.seleccionado.nomMoneda}" />
								<p:outputLabel value="# Documento:" />
								<h:panelGrid columns="4" width="100%"
									style="padding:0px !important;" columnClasses="w30,w20,w10,w20">
									<p:inputText readonly="true"
										value="#{cxcHistorialDocumentosController.seleccionado.noFisico}" />
									<p:inputText readonly="true"
										value="#{cxcHistorialDocumentosController.seleccionado.serieFisico}" />
									<p:outputLabel value="Doc:" />
									<p:inputText readonly="true"
										value="#{cxcHistorialDocumentosController.seleccionado.noDocuRefe} / #{cxcHistorialDocumentosController.seleccionado.numLetras}" />
								</h:panelGrid>
								<p:outputLabel value="Transacción Caja:" />
								<p:inputText readonly="true" style="width:30% !important"
									value="#{cxcHistorialDocumentosController.seleccionado.numDoc}" />
								<p:outputLabel value="Fecha Registro:" />
								<h:panelGrid columns="3" width="100%"
									style="padding:0px !important;" columnClasses="w30,w40,w30">
									<p:inputText readonly="true"
										value="#{cxcHistorialDocumentosController.seleccionado.fechaDocumento}">
										<f:convertDateTime pattern="dd/MM/yyyy" />
									</p:inputText>
									<p:outputLabel value="Fecha Documento:" />
									<p:inputText readonly="true"
										value="#{cxcHistorialDocumentosController.seleccionado.fecha}">
										<f:convertDateTime pattern="dd/MM/yyyy" />
									</p:inputText>
								</h:panelGrid>
								<p:outputLabel
									value="Monto Original #{cxcHistorialDocumentosController.seleccionado.simboloMoneda}:" />
								<h:panelGrid columns="3" width="100%"
									style="padding:0px !important;" columnClasses="w30,w40,w30">
									<p:inputText readonly="true" styleClass="number"
										value="#{cxcHistorialDocumentosController.seleccionado.mOriginal}" />
									<p:outputLabel value="Total Doc:" />
									<p:inputText readonly="true" styleClass="number"
										value="#{cxcHistorialDocumentosController.seleccionado.totalDoc}" />
								</h:panelGrid>
								<p:outputLabel value="Pago Fact. Contado:" />
								<h:panelGrid columns="3" width="100%"
									style="padding:0px !important;" columnClasses="w30,w30,w30">
									<p:inputText readonly="true" styleClass="number"
										value="#{cxcHistorialDocumentosController.seleccionado.totalContado}" />
									<p:outputLabel value="Saldo:" />
									<p:inputText readonly="true" styleClass="number"
										value="#{cxcHistorialDocumentosController.seleccionado.saldo}" />
								</h:panelGrid>
							</h:panelGrid>
							<h:panelGrid id="pgBotones" style="float:right">
								<h:panelGrid columns="2" style="float:right">
									<p:commandButton value="Afectando a" style="margin-top:0px;"
										icon="ui-icon ui-icon-arrow-upward" styleClass="secondary-btn"
										disabled="#{cxcHistorialDocumentosController.seleccionado eq null}"
										partialSubmit="true" process="@this"
										actionListener="#{cxcHistorialDocumentosController.cargarAfectandoA}"
										update="@this, :idForm:tblAfectandoA" />
									<p:commandButton value="Afectado por" style="margin-top:0px;"
										icon="ui-icon ui-icon-arrow-downward"
										styleClass="secondary-btn"
										disabled="#{cxcHistorialDocumentosController.seleccionado eq null or !cxcHistorialDocumentosController.afectadoPor}"
										partialSubmit="true" process="@this"
										actionListener="#{cxcHistorialDocumentosController.cargarAfectadoPor}"
										update="@this, :idForm:tblAfectadoPor" />
								</h:panelGrid>
								<h:panelGrid columns="2" style="float:right">
									<p:commandButton value="Detalle contable"
										style="margin-top:0px;" icon="ui-icon ui-icon-list"
										disabled="#{cxcHistorialDocumentosController.seleccionado eq null}"
										partialSubmit="true" process="@this"
										actionListener="#{cxcHistorialDocumentosController.cargarDetalleContable}"
										update="@this, :idForm:tblDetalleContable" />
									<p:commandButton value="Imprimir" style="margin-top:0px;"
										icon="ui-icon ui-icon-print" styleClass="deep-orange-btn"
										disabled="#{cxcHistorialDocumentosController.seleccionado eq null}"
										partialSubmit="true" process="@this, :idForm"
										actionListener="#{cxcHistorialDocumentosController.imprimirDocumento}" />
								</h:panelGrid>
							</h:panelGrid>

						</p:fieldset>

					</div>
				</div>
			</div>

			<p:dialog id="dlgAfectandoA" widgetVar="dlgAfectandoAw" width="600"
				height="500" header="Afectando A" modal="true">
				<p:dataTable id="tblAfectandoA" widgetVar="tblAfectandoAw"
					emptyMessage="No existen registros"
					value="#{cxcHistorialDocumentosController.listaAfectandoA}"
					var="item" rowKey="#{item.arccrdPk}" rowIndexVar="var"
					styleClass="table table-body" paginator="true"
					paginatorAlwaysVisible="true" paginatorPosition="top" rows="10"
					currentPageReportTemplate="{startRecord} - {endRecord} de {totalRecords}"
					paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}">

					<p:column headerText="Tipo" width="10%">
						<p:outputLabel value="#{item.tipoRefe}" />
					</p:column>

					<p:column headerText="Per." width="15%">
						<p:outputLabel value="#{item.periRefe}" />
					</p:column>

					<p:column headerText="Documento" width="30%">
						<p:outputLabel value="#{item.documento}" />
					</p:column>

					<p:column headerText="Valor Abono" width="15%">
						<p:outputLabel value="#{item.monto}" styleClass="number" />
					</p:column>

					<p:column headerText="Moneda" width="15%">
						<p:outputLabel value="#{item.nombreMoneda}" />
					</p:column>

					<p:column headerText="Valor" width="15%">
						<p:outputLabel value="#{item.montoDoc}" styleClass="number" />
					</p:column>

				</p:dataTable>
			</p:dialog>

			<p:dialog id="dlgAfectadoPor" widgetVar="dlgAfectadoPorw" width="600"
				height="500" header="Afectado Por" modal="true">
				<p:dataTable id="tblAfectadoPor" widgetVar="tblAfectadoPorw"
					emptyMessage="No existen registros"
					value="#{cxcHistorialDocumentosController.listaAfectadoPor}"
					var="item" rowKey="#{item.arccrdPk}" rowIndexVar="var"
					styleClass="table table-body" paginator="true"
					paginatorAlwaysVisible="true" paginatorPosition="top" rows="10"
					currentPageReportTemplate="{startRecord} - {endRecord} de {totalRecords}"
					paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}">

					<p:column headerText="Tipo" width="8%">
						<p:outputLabel value="#{item.tipoDoc}" />
					</p:column>

					<p:column headerText="Per." width="10%">
						<p:outputLabel value="#{item.periodo}" />
					</p:column>

					<p:column headerText="Ag." width="5%">
						<p:outputLabel value="#{item.centro}" />
					</p:column>

					<p:column headerText="Fecha" width="15%">
						<p:outputLabel value="#{item.fecha}">
							<f:convertDateTime pattern="dd/MM/yyyy" />
						</p:outputLabel>
					</p:column>

					<p:column headerText="Documento" width="25%">
						<p:outputLabel value="#{item.documento}" />
					</p:column>

					<p:column headerText="Valor Abono" width="10%">
						<p:outputLabel value="#{item.monto}" styleClass="number" />
					</p:column>

					<p:column headerText="Moneda" width="15%">
						<p:outputLabel value="#{item.nombreMoneda}" />
					</p:column>

					<p:column headerText="Valor" width="12%">
						<p:outputLabel value="#{item.montoDoc}" styleClass="number" />
					</p:column>

				</p:dataTable>
			</p:dialog>

			<p:dialog id="dlgDetalleContable" widgetVar="dlgDetalleContablew"
				width="700" height="500" header="Detalle Contable" modal="true">
				<p:dataTable id="tblDetalleContable" widgetVar="tblDetalleContablew"
					emptyMessage="No existen registros"
					value="#{cxcHistorialDocumentosController.listaDetalleContable}"
					var="item" rowKey="#{item.id}" rowIndexVar="var"
					styleClass="table table-body" paginator="true"
					paginatorAlwaysVisible="true" paginatorPosition="top" rows="10"
					currentPageReportTemplate="{startRecord} - {endRecord} de {totalRecords}"
					paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}">

					<p:column headerText="Cuenta Contable" width="15%">
						<p:outputLabel value="#{item.id.ctaconId}" />
					</p:column>

					<p:column width="30%">
						<p:outputLabel value="#{item.nombreC}" />
					</p:column>

					<p:column headerText="Centro Costo" width="13%">
						<p:outputLabel value="#{item.uniadminId}" />
					</p:column>

					<p:column headerText="Tipo" width="10%">
						<p:outputLabel
							value="#{item.id.tipo eq 'C' ? 'Crédito' : 'Débito'}" />
					</p:column>

					<p:column headerText="Monto Dol" width="10%">
						<p:outputLabel value="#{item.montoDol}" styleClass="number" />
					</p:column>

					<p:column headerText="No Asiento" width="10%">
						<p:outputLabel value="#{item.noAsiento}" />
					</p:column>

					<p:column headerText="Año" width="7%">
						<p:outputLabel value="#{item.ano}" />
					</p:column>

					<p:column headerText="Mes" width="5%">
						<p:outputLabel value="#{item.mes}" />
					</p:column>

				</p:dataTable>
			</p:dialog>

		</h:form>
	</ui:define>

</ui:composition>
