<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/jsf/templates/bodyTemplate.xhtml">

	<ui:define name="title">
		INFORMACION ENTREGA DE VEHICULOS
	</ui:define>
	 
	
	<ui:define name="content">
		<style type="text/css">
body {
	font-size: 11px !important;
}

body .ui-datatable.ui-datatable-scrollable thead tr th {
	font-size: 11px !important;
	padding: 0px 3px !important;
}

body .ui-datatable thead tr th {
	padding: 4px 3px;
}

body .ui-datatable tbody tr td {
	font-size: 10px !important;
	padding: 2px 3px;
}

body .ui-panelgrid .ui-panelgrid-cell {
	padding: 3px 4px;
}

.noborder, .noborder>tbody>tr, .noborder>tbody>tr>td, .noborder>*>div,
	.noborder>.ui-widget-content {
	border: 0px !important;
	padding: 4px 3px !important;
	background-color: transparent !important;
}

.gridSinBordes.ui-panelgrid>*>tr, .gridSinBordes.ui-panelgrid .ui-panelgrid-cell
	{
	border: none !important;
	border-right-width: 0px !important;
	border-left-width: 0px !important;
	padding-right: 2px !important;
	padding-left: 2px !important;
	padding-top: 2px !important;
	padding-bottom: 2px !important
}

.topAligned {
	vertical-align: top;
}

body .ui-tabs .ui-tabs-nav>li.ui-state-default a {
	background: #d8f1ff;
	border-radius: 10px 10px 0px 0px;
}

.centrado {
	display: flex;
	align-items: center;
}

.ui-dialog .ui-dialog-titlebar {
	background-color: #4aaff7 !important;
}

.ui-dialog .ui-dialog-content {
	border: 1px solid #d8d8d8 !important;
}

.btnGris {
	background-color: #607d8b !important;
}

.forty-percent {
	width: 42%;
}

.sixty-percent {
	width: 58%;
}

.top-alignment {
	vertical-align: top;
}

.procesado {
	color: #03A9F4 !important;
}

.generado {
	color: #4CAF50 !important;
}

.enviado {
	color: #F44336 !important;
}

.flex-center {
	display: flex;
	justify-content: center; /* Centra horizontalmente */
	align-items: center; /* Centra verticalmente */
	width: 100%;
	padding: 1px 10px 20px 40px;
}
</style>

		<h:form id="idForm" enctype="multipart/form-data">
			<p:messages id="messages" showDetail="true" autoUpdate="true"
				closable="true" showSummary="true" />
			<div align="center">
				<h:panelGrid columns="12" id="pgListado" width="100%" layout="grid"
					rendered="#{cxcContactoServicioController.pantalla eq 'LISTADO'}">
					<ui:include src="listaVehContactoServicio.xhtml" />
				</h:panelGrid>
				 
				<h:panelGrid columns="12" id="pgContacto" width="100%" layout="grid"
					rendered="#{cxcContactoServicioController.pantalla eq 'CONTACTOS'}">
					<ui:include src="contactoServicio.xhtml" />
				</h:panelGrid>
			 
				<h:panelGrid columns="12" id="pgEntregaVeh" width="100%"
					layout="grid"
					rendered="#{cxcContactoServicioController.pantalla eq 'ENTREGAS'}">
					<ui:include src="entregaVehiculo.xhtml" />
				</h:panelGrid>
			</div>

		 

			<!-- DIALOGO MODAL DE CLIENTES -->
			<p:dialog header="Clientes" widgetVar="modalCLientes" modal="true"
				showEffect="fade" hideEffect="fade" id="modalCLientes"
				resizable="true" width="600" height="300" position="center center"
				closeOnEscape="true">
				<p:panelGrid columns="5" layout="grid">
					<p:outputLabel value="Cedula:" />
					<p:inputText id="clienteIdCC"
						value="#{cxcContactoServicioController.cedulaClienteConsulta}"
						size="10" />

					<p:outputLabel value="Nombre:" />
					<p:inputText id="idNombreClieC"
						value="#{cxcContactoServicioController.nombreClienteConsulta}" />

					<p:commandButton id="clienteCommandink1" icon="ui-icon-search"
						action="#{cxcContactoServicioController.ejecutarConsultaClientes}"
						update="tblCliente" />
				</p:panelGrid>

				<p:dataTable var="item" id="tblCliente" widgetVar="tblCliente"
					value="#{cxcContactoServicioController.lazyModel}" paginator="true"
					rows="10" lazy="true" rowIndexVar="var" scrollWidth="100%"
					scrollable="true"
					paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
					rowsPerPageTemplate="25,50" paginatorPosition="bottom"
					style="width:90%;">

					<p:column headerText="No" width="5%">
						<p:outputLabel value="#{var + 1}" />
					</p:column>
					<p:column headerText="Codigo" width="15%">
						<p:commandLink id="viClieCommandLink"
							value="#{item.clientePK.noCliente}"
							action="#{cxcContactoServicioController.seleccionarCliente(item)}"
							oncomplete="PF('modalCLientes').hide();" partialSubmit="true"
							update=":#{p:component('idPgFiltros')}" process="@this">
						</p:commandLink>
					</p:column>
					<p:column headerText="Cedula" width="30%">
						<p:outputLabel value="#{item.cedula}" />
					</p:column>
					<p:column headerText="Nombres/Apellidos " width="50%"
						styleClass="txtL">
						<p:outputLabel value="#{item.nombre}" />
					</p:column>

				</p:dataTable>
			</p:dialog>

			<p:dialog id="idDialogVendedores" header="Seleccione Vendedor..."
				widgetVar="dialogVendedores" style="position:fixed"
				responsive="true" closeOnEscape="true" modal="true"
				appendTo="@(body)" width="350" height="300">
				<h:panelGrid id="idPanelVendedores" columns="1">
					<p:dataTable id="idTableVendedores" var="item"
						selectionMode="single" multiViewState="true" rowIndexVar="indice"
						rows="10" filterDelay="600" rowKey="#{item.svfvendPK}"
						paginatorPosition="bottom"
						paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
						paginator="true" lazy="true"
						value="#{cxcContactoServicioController.lazyDataModelVendedores}">

						<p:column headerText="Codigo"
							filterBy="#{item.svfvendPK.svvecodi}"
							filterStyle="background:#e3e3e3;width:80%" width="20%">
							<p:commandLink id="vendedorCommandLink"
								value="#{item.svfvendPK.svvecodi}"
								action="#{cxcContactoServicioController.seleccionarVendedor(item)}"
								oncomplete="PF('idDialogVendedores').hide();"
								partialSubmit="true" update=":#{p:component('idPgFiltros')}"
								process="@this">
							</p:commandLink>
						</p:column>
						<p:column headerText="Nombre" filterBy="#{item.svvenomb}"
							filterStyle="background:#e3e3e3;width:80%" width="80%">
							<h:outputText value="#{item.svvenomb}" />
						</p:column>

					</p:dataTable>
				</h:panelGrid>

			</p:dialog>

			<!-- Cuadro de Dialogo Eliminar Contacto de Servicio -->
			<p:confirmDialog widgetVar="diaEliminar" modal="true"
				header="Confirmación"
				message="Está seguro de ELIMINAR el Contacto seleccionado?">
				<p:commandButton value="Si" process="@this"
					actionListener="#{cxcContactoServicioController.eliminarContacto}"
					update="@this :idForm" oncomplete="PF('diaEliminar').hide();" />
				<p:commandButton value="No" onclick="PF('diaEliminar').hide();" />
			</p:confirmDialog>

			<!-- Cuadro de Dialogo Notificacion Arribo Cliente -->
			<p:confirmDialog widgetVar="diaArriboCliente" modal="true"
				header="Confirmación"
				message="Confirma que el cliente se encuentra en la Agencia?">
				<p:commandButton value="Si" process="@this"
					actionListener="#{cxcContactoServicioController.notificarArriboCLiente}"
					update=":idForm" oncomplete="PF('diaArriboCliente').hide();" />
				<p:commandButton value="No" onclick="PF('diaArriboCliente').hide();" />
			</p:confirmDialog>

		</h:form>

	</ui:define>
</ui:composition>
