<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<style type="text/css">
body {
	font-size: 10px;
}

body .ui-toolbar {
	padding: 5px;
}

.columAlignCenter {
	text-align: center;
}

.columAlignRight {
	text-align: right;
}
</style>
	<script type="text/javascript">
		//<![CDATA[
		function setaFoco(elemento)  {
    		var keyCode = event.keyCode ? event.keyCode : event.which ? event.which : event.charCode;
	    	if (keyCode == 13) {

        		var i;
        		for (i = 0; i < elemento.form.elements.length; i++)
            		if (elemento == elemento.form.elements[i])
                		break;
        		i = (i + 1) % elemento.form.elements.length;
        		elemento.form.elements[i].focus();
        		event.preventDefault();
        		return false;
    		}
    		return false;
		};

		function sinSet()  {
    		if (keyCode == 13) {
    	    		return false;
    		}
		};
		//]]>

		</script>
</h:head>
<h:body>
	<p:ajaxStatus onstart="PF('statusDialog').show()"
		onsuccess="PF('statusDialog').hide()"
		onerror="PF('statusDialog').hide()" />

	<p:dialog widgetVar="statusDialog" modal="true" draggable="false"
		closable="false" resizable="false" showHeader="false">
		<h:graphicImage value="/common/imgs/gifs/ajaxloadingbar.gif" />
	</p:dialog>
	<p:growl id="idGrowl" globalOnly="true" autoUpdate="true"
		widgetVar="groMessages" showDetail="true" life="5000" />

	<h:form id="idForm">
		<p:toolbar id="idtoolBar">
			<f:facet name="left">
				<h:outputLabel style="font-size: 15px;"
					value="REASIGNACION DE UNA CC A OTRA ENTIDAD EMISORA DE TARJETAS DE CREDITO" />
			</f:facet>

			<f:facet name="right">
				<p:commandButton id="btnProcesar" value="Procesar" icon="fa fa-cog"
					update="idForm, FrmResult"
					rendered="#{cxcReasignacionEmisorTarjetaController.activarProceso}"
					action="#{cxcReasignacionEmisorTarjetaController.procesar}"
					styleClass="green-btn" process="idForm"></p:commandButton>

				<p:commandButton value="Limpiar" icon="fa fa-refresh"
					update="idForm"
					action="#{cxcReasignacionEmisorTarjetaController.limpiar}"></p:commandButton>

			</f:facet>

		</p:toolbar>

		<h:panelGrid columns="4">
			

			<h:panelGrid columns="4" id="pnlFiltros">

				<p:commandLink oncomplete="PF('DlgClientes').show();"
					value="Por Cliente: " update="FrmClientes" action="#{cxcReasignacionEmisorTarjetaController.limpiarClientes}"/>
				<h:panelGrid columns="2">
					<p:inputText
						value="#{cxcReasignacionEmisorTarjetaController.clienteSeleccionado.clientePK.noCliente}"
						style="width:60px;" readonly="true"></p:inputText>
					<p:inputText
						value="#{cxcReasignacionEmisorTarjetaController.clienteSeleccionado.nombre}"
						style="width:290px;" readonly="true"></p:inputText>
				</h:panelGrid>


				<p:spacer width="20" height="5"></p:spacer>
				<p:spacer width="20" height="5"></p:spacer>
				<p:outputLabel value="Por No Interno CC:"></p:outputLabel>
				<p:inputText size="15" value="#{cxcReasignacionEmisorTarjetaController.filtroVoucher}"></p:inputText>
				<p:commandButton value="Buscar" icon="fa fa-search"
					styleClass="orange-btn"
					action="#{cxcReasignacionEmisorTarjetaController.buscarDeudaTarjeta}"
					update="idForm:idTblDiarios" process="@this,idForm:pnlFiltros"></p:commandButton>
						
			</h:panelGrid>
			
				<p:fileUpload
			fileUploadListener="#{cxcReasignacionEmisorTarjetaController.listener}"
			mode="advanced" dragDropSupport="false"
			update="idForm:idTblDiarios" sizeLimit="6000000"
			fileLimit="1" allowTypes="/(\.|\/)(xls|xlsx)$/"
			label="Seleccionar Archivo" uploadLabel="Subir Archivo"
			cancelLabel="Cancelar">
		</p:fileUpload>
		</h:panelGrid>
		<p:panel header="Cuentas por Cobrar de Tarjetas">
			<p:dataTable id="idTblDiarios" emptyMessage="Sin Registros"
				value="#{cxcReasignacionEmisorTarjetaController.deudasTarjeta}"
				var="item">

				<p:column headerText="Agencia" styleClass="columAlignCenter"
					width="100">
					<p:outputLabel value="#{item.agencia}"></p:outputLabel>
				</p:column>
				<p:column headerText="Cedula" styleClass="columAlignCenter"
					width="100">
					<p:outputLabel value="#{item.cedula}"></p:outputLabel>
				</p:column>
				<p:column headerText="Cliente" styleClass="columAlignCenter">
					<p:outputLabel value="#{item.cliente}"></p:outputLabel>
				</p:column>

				<p:column headerText="Fecha" styleClass="columAlignCenter"
					width="130">
					<p:outputLabel value="#{item.fecha}">
						<f:convertDateTime pattern="dd-MM-yyyy" />
					</p:outputLabel>

				</p:column>
				<p:column headerText="Numero CC" styleClass="columAlignCenter">
					<p:outputLabel value="#{item.numeroCC}"></p:outputLabel>
				</p:column>
				<p:column headerText="Interno CC" styleClass="columAlignCenter">
					<p:outputLabel value="#{item.internoCC}"></p:outputLabel>
				</p:column>
				<p:column headerText="Recap" styleClass="columAlignCenter">
					<p:outputLabel value="#{item.recap}"></p:outputLabel>
				</p:column>
				<p:column headerText="Emisor" styleClass="columAlignCenter"
					width="100">
					<p:outputLabel value="#{item.emisor}"></p:outputLabel>
				</p:column>
				<p:column headerText="Monto Total" styleClass="columAlignCenter">
					<p:outputLabel value="#{item.montoTotal}"></p:outputLabel>
				</p:column>
				
			</p:dataTable>
		</p:panel>
		<p:panel header="Reasignar Cxc a Cliente" id="dtDocumentosCli">
			<h:panelGrid columns="4" >
				<p:commandButton value="Seleccionar Cliente "
					oncomplete="PF('DlgClientesDest').show();" update="FrmClientesDes"
					styleClass="green-btn" action="#{cxcReasignacionEmisorTarjetaController.limpiarClientes}"></p:commandButton>
				<p:spacer width="5" height="5"></p:spacer>
				<p:inputText size="15" value="#{cxcReasignacionEmisorTarjetaController.clienteDestino.cedula}"/>
				<p:inputText size="80" value="#{cxcReasignacionEmisorTarjetaController.clienteDestino.nombre}"/>
			</h:panelGrid>
	</p:panel>


		<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
			<p:commandButton value="Yes" type="button"
				styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
			<p:commandButton value="No" type="button"
				styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
		</p:confirmDialog>
	</h:form>
	<p:dialog widgetVar="DlgClientesDest" id="DlgClientesDest"
		header="Seleccione Cliente" resizable="true" modal="true"
		closable="true" appendTo="@(body)" width="480" height="500">
		<h:form id="FrmClientesDes">
			<p:dataTable id="dtClientes"
				value="#{cxcReasignacionEmisorTarjetaController.clientes}"
				var="cliente" emptyMessage="No existen registros"
				selectionMode="single"
				selection="#{cxcReasignacionEmisorTarjetaController.clienteDestino}"
				rowKey="#{cliente.clientePK}" paginator="true" rows="10" 
				paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}">
				<p:column headerText="Cedula/Ruc" filterBy="#{cliente.cedula}"
					width="90">
					<h:outputText value="#{cliente.cedula}" />
				</p:column>
				<p:column headerText="Nombre" filterBy="#{cliente.nombre}"
					filterMatchMode="startsWith">
					<h:outputText value="#{cliente.nombre}" />
				</p:column>
			</p:dataTable>
			<br> </br>
			<center>
				<p:commandButton value="Seleccionar "
					action="#{cxcReasignacionEmisorTarjetaController.seleccionarClienteDestino}"
					update="idForm:dtDocumentosCli, idForm:idtoolBar"></p:commandButton>
			</center>
		</h:form>
	</p:dialog>

	<p:dialog widgetVar="DlgClientes" id="DlgClientes"
		header="Seleccione Cliente" resizable="true" modal="true"
		closable="true" appendTo="@(body)" width="480" height="500">
		<h:form id="FrmClientes">
			<p:dataTable id="dtClientes"
				value="#{cxcReasignacionEmisorTarjetaController.clientes}"
				var="cliente" emptyMessage="No existen registros"
				selectionMode="single"
				selection="#{cxcReasignacionEmisorTarjetaController.clienteSeleccionado}"
				rowKey="#{cliente.clientePK}" paginator="true" rows="10" 
				paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}">
				<p:column headerText="Cedula/Ruc" filterBy="#{cliente.cedula}"
					width="90">
					<h:outputText value="#{cliente.cedula}" />
				</p:column>
				<p:column headerText="Nombre" filterBy="#{cliente.nombre}"
					filterMatchMode="startsWith">
					<h:outputText value="#{cliente.nombre}" />
				</p:column>
			</p:dataTable>
			<br> </br>
			<center>
				<p:commandButton value="Seleccionar "
					action="#{cxcReasignacionEmisorTarjetaController.seleccionarCliente}"
					update="idForm:pnlFiltros, idForm:idtoolBar"></p:commandButton>
			</center>
		</h:form>
	</p:dialog>

	<p:dialog widgetVar="DlgResult" id="DlgResult" header="Proceso Exitoso"
		resizable="true" modal="true" closable="false" appendTo="@(body)"
		width="480" height="250">
		<h:form id="FrmResult">
			<p:outputLabel
				value="Se ha procesado el cambio de linea de anticipo exitosamente, como resultado se han generado los siguientes diarios: "></p:outputLabel>
			<p:dataTable
				value="#{cxcReasignacionEmisorTarjetaController.diariosResult}"
				var="diario">
				<p:column headerText="Numero Diario">
					<p:outputLabel value="#{diario.serieFisico} - #{diario.noFisico}"></p:outputLabel>
				</p:column>
				<p:column headerText="Ver" width="120">
					<p:commandLink ajax="false" target="_blank"
						action="#{cxcReasignacionEmisorTarjetaController.imprimirDiario(diario)}">
						<p:commandButton icon="fa fa-print" title="Ver Diario A"
							ajax="false">
						</p:commandButton>
					</p:commandLink>
				</p:column>
			</p:dataTable>

			<br />
			<center>
				<p:commandButton value="Cerrar"
					action="#{cxcReasignacionEmisorTarjetaController.cerrarDialogo}" update="idForm"></p:commandButton>
			</center>
		</h:form>
	</p:dialog>

	<h:outputStylesheet name="css/layout-lightblue.css"
		library="serenity-layout" />
</h:body>
</html>
