<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/jsf/templates/bodyTemplate.xhtml">
	
	<ui:param name="readonly"
		value="#{cxcEntradaChequesDevueltosController.readonly}" />

	<ui:define name="title">
		Cuentas por Cobrar - Entrada de Cheques Devueltos
	</ui:define>

	<ui:define name="buttons">
		<h:form id="fmrButtons">
			<p:commandButton partialSubmit="true"
				process="@this :idForm:pgFiltro" icon="ui-icon ui-icon-search"
				actionListener="#{cxcEntradaChequesDevueltosController.buscarEntradas}"
				update="@this :idForm:tblEntradas" />
			<p:commandButton icon="ui-icon ui-icon-create" disabled="#{readonly}"
				actionListener="#{cxcEntradaChequesDevueltosController.getUrlNuevo}" />
		</h:form>
	</ui:define>

	<ui:define name="content">
		<style type="text/css">
input {
	width: 95%;
}
</style>

		<h:form id="idForm">

			<p:panelGrid id="pgFiltro" columns="10">
				<p:outputLabel value="No Docu" />
				<p:inputText
					value="#{cxcEntradaChequesDevueltosController.filtro.id.noDocu}" />
				<p:outputLabel value="Nota Débito" />
				<p:inputText
					value="#{cxcEntradaChequesDevueltosController.filtro.notaDebito}" />
				<p:outputLabel value="Número Cheque" />
				<p:inputText
					value="#{cxcEntradaChequesDevueltosController.filtro.noCheque}" />
				<p:outputLabel value="No Cliente" />
				<p:inputText
					value="#{cxcEntradaChequesDevueltosController.filtro.noCliente}" />
				<p:outputLabel value="Cédula" />
				<p:inputText
					value="#{cxcEntradaChequesDevueltosController.filtro.cedula}" />
				<p:outputLabel value="Fecha" />
				<p:calendar
					value="#{cxcEntradaChequesDevueltosController.filtro.fecha}"
					locale="es" pattern="dd/MM/yyyy" />
			</p:panelGrid>

			<p:dataTable id="tblEntradas" var="item" lazy="true"
				value="#{cxcEntradaChequesDevueltosController.model}"
				emptyMessage="No existen documentos" styleClass="table table-body"
				paginator="true" rows="#{cxcEntradaChequesDevueltosController.size}"
				rowIndexVar="var" rowKey="#{item.id}" paginatorPosition="bottom"
				currentPageReportTemplate="{startRecord} - {endRecord} de {totalRecords}"
				paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}">

				<f:facet name="header">
					Listado de Cheques Devueltos
				</f:facet>

				<p:column headerText="No Docu" width="10%">
					<p:commandLink value="#{item.id.noDocu}"
						actionListener="#{cxcEntradaChequesDevueltosController.getUrlConsulta(item)}" />
				</p:column>

				<p:column headerText="No Cliente" width="5%">
					<p:outputLabel value="#{item.noCliente}" />
				</p:column>

				<p:column headerText="Cliente" width="25%">
					<p:outputLabel value="#{item.nomCliente}" />
				</p:column>

				<p:column headerText="Tipo" width="5%">
					<p:outputLabel value="#{item.tipoDoc}" />
				</p:column>

				<p:column headerText="Banco Nd" width="10%">
					<p:outputLabel value="#{item.nomBancoNd}" />
				</p:column>

				<p:column headerText="Banco Ch" width="10%">
					<p:outputLabel value="#{item.nomBancoCh}" />
				</p:column>

				<p:column headerText="Cajero" width="10%">
					<p:outputLabel value="#{item.usuarioCajero}" />
				</p:column>

				<p:column headerText="Nota Débito" width="5%">
					<p:outputLabel value="#{item.notaDebito}" />
				</p:column>

				<p:column headerText="Cheque" width="5%">
					<p:outputLabel value="#{item.noCheque}" />
				</p:column>

				<p:column headerText="Fecha" width="10%">
					<p:outputLabel value="#{item.fecha}">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</p:outputLabel>
				</p:column>

				<p:column headerText="Valor Nd" width="5%">
					<p:outputLabel value="#{item.valorNd}" />
				</p:column>

				<p:column headerText="Monto" width="5%">
					<p:outputLabel value="#{item.monto}" />
				</p:column>
				
			</p:dataTable>

		</h:form>
	</ui:define>

</ui:composition>
