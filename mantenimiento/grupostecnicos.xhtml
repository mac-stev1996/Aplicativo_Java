<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:composite="http://java.sun.com/jsf/composite"
	xmlns:a4j="http://richfaces.org/a4j"
	xmlns:c="http://java.sun.com/jstl/core">
<style>
input, .ui-selectcheckboxmenu, .ui-selectonemenu {
	width: 95% !important;
}

::ng-deep p-dialog .ui-dialog {
	overflow: scroll;
	max-height: 100%;
}
</style>

<h:head>
	<h:outputStylesheet name="css/layout-lightblue.css"
		library="serenity-layout" />
</h:head>
<h:body>
	<h:form id="idForm">

		<p:ajaxStatus onstart="PF('statusDialog').show()"
			onsuccess="PF('statusDialog').hide()"
			onerror="PF('statusDialog').hide()" />

		<p:dialog widgetVar="statusDialog" modal="true" draggable="false"
			closable="false" resizable="false" showHeader="false">
			<h:graphicImage value="/common/imgs/gifs/ajaxloadingbar.gif" />
		</p:dialog>

		<p:growl id="idGrowl" showDetail="true" autoUpdate="true" life="3000" />

		<p:toolbar id="menuSuperior">
			<p:toolbarGroup align="left">
				<b> <p:outputLabel style="font-size: 15px;"
						value="Mantenimiento Grupos de Tecnicos" />
				</b>
			</p:toolbarGroup>

			<p:toolbarGroup align="right">
				<p:commandButton title="TECNICO FIN SEMANA 2"
					value = "TECNICO PROGRAMADO" styleClass="ui-button-success"
					style="margin-right: .5rem"
					action="#{SisGruposTecnicosController.gruposTecnicosActivosListar()}"
					onclick="PF('dlgSisGruposTecFINS2').show();"
					update ='saveForm2:idTable ' >
				</p:commandButton>
				
			</p:toolbarGroup>


			<p:toolbarGroup align="right">
				<p:commandButton title="Nuevo" icon="fa fa-plus-square-o"
					styleClass="ui-button-success" style="margin-right: .5rem"
					action="#{SisGruposTecnicosController.cargarSisGrupoTecnico()}"
					onclick="PF('dlgSisGruposTec').show();">
				</p:commandButton>
			</p:toolbarGroup>

		</p:toolbar>

		<center>
			<p:outputLabel>

			</p:outputLabel>
			<p:panelGrid id="SisPanelBuscar" columns="4"
				contentStyleClass="align-items-baseline ui-fluid"
				style="margin-top:30px;">

				<p:outputLabel value="Grupos" />
				<p:selectCheckboxMenu label="Seleccione" panelStyle="width:280px"
					scrollHeight="150" id="filterselectegrupo2"
					value="#{SisGruposTecnicosController.selectgrupoString}">
					<f:selectItems onclick="PF('tblSisgrupostec').clearFilters()"
						value="#{SisGruposTecnicosController.uniqueListaGruposString}"></f:selectItems>
					<p:ajax event="change"
						update="idForm:filterselectegrupo2 sisGruposTecnicos"
						process="@this"
						listener="#{SisGruposTecnicosController.filtradasListaSisGruposTec}" />
				</p:selectCheckboxMenu>

				<p:outputLabel value="Codigo Clientes" />
				<p:selectCheckboxMenu label="Seleccione" panelStyle="width:280px"
					scrollHeight="150" id="filterselectcodcliente2"
					value="#{SisGruposTecnicosController.selectCodigoClienteString}">
					<f:selectItems onclick="PF('tblSisgrupostec').clearFilters()"
						value="#{SisGruposTecnicosController.uniqueListaCodClienteString}"></f:selectItems>
					<p:ajax event="change"
						update="idForm:filterselectcodcliente2 sisGruposTecnicos"
						process="@this"
						listener="#{SisGruposTecnicosController.filtradasListaSisGruposTec}" />
				</p:selectCheckboxMenu>

			</p:panelGrid>



			<h:panelGrid id="sisGruposTecnicos" width="1200px"
				style="margin-top:30px;">

				<p:dataTable id="tblSisgrupostec" reflow="true" var="item"
					value="#{SisGruposTecnicosController.listaGruposTec}"
					widgetVar="tblSisgrupostec" rowIndexVar="var" rowKey="#{item.id}"
					paginator="true" rows="20" paginatorPosition="bottom"
					selectionMode="single" styleClass="table table-body"
					emptyMessage="No existen Registros" paginatorAlwaysVisible="true"
					sortBy="#{item.id.grupo}" sortOrder="ascending"
					paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
					filteredValue="#{SisGruposTecnicosController.listaGruposTecSelecte}">

					<p:column width="3%">
						<f:facet name="header">
							<h:outputText value="No" />
						</f:facet>
						<p:outputLabel value="#{var + 1}" process="@this"></p:outputLabel>

						<!--  <p:commandLink value="#{var + 1}" update=":idForm:dlgSisGruposTec"
							oncomplete="PF('dlgSisGruposTec').show()" process="@this">
							<f:setPropertyActionListener value="#{item}"
								target="#{SisGruposTecnicosController.selectedgruposTecnicos}" />
						</p:commandLink>
						-->
					</p:column>
					<p:column headerText="GRUPO" sortBy="#{item.id.grupo}"
						filterBy="#{item.id.grupo}"
						onchange="PF('tblSisgrupostec').filter()"
						style="text-align:center">
						<p:outputLabel value="#{item.id.grupo}" />
					</p:column>

					<p:column headerText="USUARIO" sortBy="#{item.id.usuario_sistemas}"
						filterBy="#{item.id.usuario_sistemas}"
						onchange="PF('tblSisgrupostec').filter()"
						style="text-align:center">
						<p:outputLabel value="#{item.id.usuario_sistemas}" />
					</p:column>

					<p:column headerText="NOMBRES"
						sortBy="#{SisGruposTecnicosController.metoNUsuario(item.id.usuario_sistemas)}"
						style="text-align:center"
						filterBy="#{SisGruposTecnicosController.metoNUsuario(item.id.usuario_sistemas)}"
						onchange="PF('tblSisgrupostec').filter()">
						<p:outputLabel
							value="#{SisGruposTecnicosController.metoNUsuario(item.id.usuario_sistemas)}" />
					</p:column>

					<p:column headerText="ESTADO" sortBy="#{item.estado}"
						filterBy="#{item.estado}"
						onchange="PF('tblSisgrupostec').filter()"
						style="text-align:center">
						<p:outputLabel value="#{item.estado}" />
					</p:column>

					<p:column headerText="CLIENTE" style="text-align:center"
						sortBy="#{item.id.codigo_cliente}"
						filterBy="#{item.id.codigo_cliente}"
						onchange="PF('tblSisgrupostec').filter()">
						<p:outputLabel value="#{item.id.codigo_cliente}" />
					</p:column>

					<p:column headerText="Acciones" style="text-align:center">
						<p:commandButton icon="ui-icon-trash" title="Inactivar Registro"
							actionListener="#{SisGruposTecnicosController.inhabilitarGruposTecnicos(item)}"
							update="idForm:tblSisgrupostec" rendered="#{item.estado == 'A'}">
							<p:confirm header="Confirmación"
								message="Esta Seguro de Inactivar Registro?"
								icon="ui-icon-alert" />
						</p:commandButton>
						<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
							<p:commandButton value="Si" type="button"
								styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
							<p:commandButton value="No" type="button"
								styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
						</p:confirmDialog>

						<p:commandButton icon="ui-icon-check" title="Activar Registro"
							actionListener="#{SisGruposTecnicosController.habilitarGruposTecnicos(item)}"
							update="idForm:tblSisgrupostec" rendered="#{item.estado == 'I'}"
							styleClass="green-btn">
							<p:confirm header="Confirmación"
								message="Esta Seguro de activar Registro?" icon="ui-icon-alert" />

						</p:commandButton>
						<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
							<p:commandButton value="Si" type="button"
								styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
							<p:commandButton value="No" type="button"
								styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
						</p:confirmDialog>


					</p:column>

				</p:dataTable>
			</h:panelGrid>


		</center>
	</h:form>

	<p:dialog id="dlgSisGruposTec" widgetVar="dlgSisGruposTec"
		style="position:fixed" modal="true" closeOnEscape="true"
		header="Nuevo Sis grupos tecnicos">
		<h:form id="saveForm">
			<center>
				<p:panelGrid columns="2" style="padding:2px; margin:0px;">

					<p:outputLabel value="usuario_sistemas: "></p:outputLabel>
					<p:selectOneMenu id="saveUsuarioSis"
						value="#{SisGruposTecnicosController.selectSaveUsuarioSistemas}">
						<f:selectItems
							value="#{SisGruposTecnicosController.listaUsuariosSistema}"></f:selectItems>
						<p:ajax event="change" update="saveForm:saveUsuarioSis" />
					</p:selectOneMenu>

					<p:outputLabel value="Grupos:"></p:outputLabel>
					<p:selectCheckboxMenu label="Seleccione" panelStyle="width:280px"
						scrollHeight="150" id="groupSave"
						value="#{SisGruposTecnicosController.selectSaveGrupo}">
						<f:selectItems
							value="#{SisGruposTecnicosController.uniqueListaGruposString}"></f:selectItems>
						<p:ajax event="change" update="saveForm:groupSave" />
					</p:selectCheckboxMenu>



					<p:outputLabel value="Codigo Cliente:"></p:outputLabel>
					<p:selectCheckboxMenu label="Seleccione" panelStyle="width:280px"
						id="codClienteSave" scrollHeight="150"
						value="#{SisGruposTecnicosController.selectSaveCodigoCliente}">
						<f:selectItems
							value="#{SisGruposTecnicosController.uniqueListaCodClienteString}"></f:selectItems>
						<p:ajax event="change" update="saveForm:codClienteSave" />
					</p:selectCheckboxMenu>

				</p:panelGrid>
				<h:panelGrid id="idBotones" columns="1"
					style="text-align:center;width:100%">
					<p:commandButton value="Guardar"
						action="#{SisGruposTecnicosController.guardarSisGrupoTecnicos()}"
						partialSubmit="true" process="@this"
						oncomplete="PF('dlgSisGruposTec').hide();"
						update="idForm:tblSisgrupostec" />
				</h:panelGrid>
			</center>
		</h:form>
	</p:dialog>

	<p:dialog id="dlgSisGruposTecFINS2" widgetVar="dlgSisGruposTecFINS2"
		style="position:top" modal="true" height="150%" width="50%"
		closeOnEscape="true" header="Tecnicos Feriado/Fin Semana">
		<h:form id="saveForm2" style="font-size: 10px;">
			<center>
				<p:panelGrid columns="2" style="padding:2px; margin:0px;">
					<p:outputLabel value="usuario_sistemas: "></p:outputLabel>
					<p:selectOneMenu id="saveTecnico2"
						value="#{SisGruposTecnicosController.selectSaveUsuarioSistemas}">
						<f:selectItems
							value="#{SisGruposTecnicosController.listaUsuariosSistema}"></f:selectItems>
						<p:ajax event="change" />
					</p:selectOneMenu>
					
				    <p:outputLabel value="ROL:"></p:outputLabel>
					<p:selectOneMenu id="saveTecnico3"
						value="#{SisGruposTecnicosController.selectSaveRol}">
						<f:selectItems
							value="#{SisGruposTecnicosController.listaRol}"></f:selectItems>
						<p:ajax event="change" />
					</p:selectOneMenu>
					<h:outputLabel value="Fecha inicio" />
					<p:calendar id="idFechaINI" navigator="true" value="#{SisGruposTecnicosController.fechaINI}">
						<p:ajax event="dateSelect" update="idFechaINI" />
					</p:calendar>
											
					<h:outputLabel value="Fecha Fin" />
					<p:calendar id="idFechaFIN" navigator="true" value="#{SisGruposTecnicosController.fechaFIN}">
						<p:ajax event="dateSelect" update="idFechaFIN" />
					</p:calendar>

				</p:panelGrid>
				<h:panelGrid id="idBotones" columns="1"
					style="text-align:center;width:100%">
					<p:commandButton value="Guardar"
						action="#{SisGruposTecnicosController.guardarTecnicosActivos()}"
						partialSubmit="true" process="@this"
						update="saveForm2" />
				</h:panelGrid>

				<p:dataTable id="idTable" var="item" rowIndexVar="row" 			
					paginatorPosition="bottom"
					paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
					value="#{SisGruposTecnicosController.listaGruposTecnicosActivos}"
					paginatorAlwaysVisible="false" paginator="true"
					scrollable="true" scrollHeight="140">
					<p:column headerText="Usuario">
						<p:outputLabel value="#{item.usuario}">
						</p:outputLabel>
					</p:column>
					<p:column headerText="Rol">
						<p:outputLabel value="#{item.rol}">

						</p:outputLabel>
					</p:column>
					<p:column headerText="Fecha Inicio">
						<p:outputLabel value="#{item.fechaIni}" >
							<f:convertDateTime pattern="dd/MM/yyyy" />
						</p:outputLabel>
					</p:column>
					<p:column headerText="Fecha Fin">
						<p:outputLabel value="#{item.fechaFin}">
							<f:convertDateTime pattern="dd/MM/yyyy" />
						</p:outputLabel>
					</p:column>
					<p:column headerText="Inactivar">
						<p:commandButton icon="ui-icon-trash" title="Inactivar Registro"
								actionListener="#{SisGruposTecnicosController.inhabilitarTecnicosActivos(item)}"
								update="saveForm2" rendered="#{item.estado == 'A'}">
								<p:confirm header="Confirmación"
									message="Esta Seguro de Inactivar Registro?"
									icon="ui-icon-alert" />
							</p:commandButton>
					</p:column>
				</p:dataTable>
			</center>
		</h:form>
	</p:dialog>



</h:body>
</html>
