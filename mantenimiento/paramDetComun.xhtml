<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/jsf/templates/bodyTemplate.xhtml">

	<ui:define name="title">
		PARAMETRIZACION GENERAL
	</ui:define>

	<ui:define name="buttons">
		<h:form id="frmButtons">
			<p:commandButton value="Agregar" icon="fa fa-plus"
					action="#{paramDetComunController.nuevoItem}"
					styleClass="green-btn" process="@this">
			</p:commandButton>
		</h:form>
	</ui:define>

	<ui:define name="content">
		
		<script type="text/javascript">
			function mayus(e) {
			    e.value = e.value.toUpperCase();
			}
		</script>
		<h:form id="idForm">
			<p:panel rendered="#{paramDetComunController.codigo eq 'TPACC'
							or paramDetComunController.codigo eq 'STACC'
							or paramDetComunController.codigo eq 'TSACC'
							or paramDetComunController.codigo eq 'REPORI'}">
				<p:outputLabel value="Catálogo :  "/>
				<p:selectOneMenu autoWidth="false" style="width: 30%;"
					value="#{paramDetComunController.codigo}">
					<f:selectItem itemValue="TPACC" itemLabel="TPACC - TIPO ACCESORIO"/>
					<f:selectItem itemValue="STACC" itemLabel="STACC - SUBTIPO ACCESORIO"/>
					<f:selectItem itemValue="TSACC" itemLabel="TSACC - TIPO STOCK"/>
					<f:selectItem itemValue="REPORI" itemLabel="REPORI - ORIGEN"/>
					
					<p:ajax event="change" process="@this" partialSubmit="true"
						update="idTblDatos" 
						listener="#{paramDetComunController.buscarDetalle}"/>
				</p:selectOneMenu>
			</p:panel>
			<p:dataTable id="idTblDatos" emptyMessage="Sin Registros"
				value="#{paramDetComunController.paramDets}" var="item" 
				paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
				rowsPerPageTemplate="25,50,100" rowIndexVar="row"
				rows="25" paginator="true">
				
				<p:column headerText="Nro" styleClass="columAlignCenter" width="2%">
					<p:outputLabel value="#{row+1}"></p:outputLabel>
				</p:column>
				
				<p:column headerText="CODIGO" styleClass="columAlignCenter" width="5%">
					<p:outputLabel value="#{item.paramDetPK.codigo}"></p:outputLabel>
				</p:column>
	
				<p:column headerText="CODIGO DET" styleClass="columAlignCenter" width="10%">
					<p:outputLabel value="#{item.paramDetPK.codigoDet}"></p:outputLabel>
				</p:column>
	
				<p:column headerText="DESCRIPCION" styleClass="columAlignCenter" width="26%">
					<p:outputLabel value="#{item.descripcion}"></p:outputLabel>
				</p:column>
	
				<p:column headerText="TEXTO 1" styleClass="columAlignCenter" width="8%">
					<p:outputLabel value="#{item.texto1}"></p:outputLabel>
				</p:column>
	
				<p:column headerText="TEXTO 2" styleClass="columAlignCenter" width="8%">
					<p:outputLabel value="#{item.texto2}"></p:outputLabel>
				</p:column>
	
				<p:column headerText="TEXTO 3" styleClass="columAlignCenter" width="8%">
					<p:outputLabel value="#{item.texto3}"></p:outputLabel>
				</p:column>
	
				<p:column headerText="TEXTO 4" styleClass="columAlignCenter" width="8%">
					<p:outputLabel value="#{item.texto4}"></p:outputLabel>
				</p:column>
				
				<p:column headerText="ESTADO 1" styleClass="columAlignCenter" width="8%">
					<p:outputLabel value="#{item.estado1 eq 'A' ? 'Activo' : 'Inactivo' }"></p:outputLabel>
				</p:column>
	
				<p:column headerText="ESTADO 2" styleClass="columAlignCenter" width="8%">
					<p:outputLabel value="#{item.estado2 eq 'A' ? 'Activo' : 'Inactivo' }"></p:outputLabel>
				</p:column>
				
	
				<p:column headerText="ACCIONES " styleClass="columAlignCenter" width="10%">
					<p:commandButton title="Editar" icon="ui-icon-pencil"
						action="#{paramDetComunController.editarItem(item)}"
						process="@this" partialSubmit="true">
					</p:commandButton>
					<p:spacer width="5" height="5"></p:spacer>
					<p:commandButton title="Eliminar" icon="ui-icon-trash"
						styleClass="red-btn"
						action="#{paramDetComunController.eliminarItem(item)}"
						update="idForm">
						<p:confirm header="Confirmación"
							message="¿Está seguro que desea eliminar el registro?"
							icon="pi pi-exclamation-triangle" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
	
			<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
				<p:commandButton value="Si" type="button"
					styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
				<p:commandButton value="No" type="button"
					styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
			</p:confirmDialog>
		</h:form>


		<p:dialog widgetVar="DlgResult" id="DlgResult" header="Param Det"
			resizable="true" modal="true" closable="true" appendTo="@(body)"
			height="auto" width="auto" closeOnEscape="true" style="position:fixed"
			responsive="true" showEffect="slide">
			<f:facet name="header">Editar</f:facet>
			<h:form id="FrmResult">
				<h:panelGrid columns="2">
					<h:outputLabel value="Cia:"/>
					<p:inputText size="20" maxlength="2" required="true" 
						disabled="true" value="#{paramDetComunController.parametro.paramDetPK.noCia}" />
				
					<h:outputLabel value="Código:"/>
					<p:inputText size="20" maxlength="6" required="true" 
						disabled="true" value="#{paramDetComunController.parametro.paramDetPK.codigo}" />
	
					<h:outputLabel value="Código Det:" />
					<p:inputText size="20" maxlength="15" 
						value="#{paramDetComunController.parametro.paramDetPK.codigoDet}" />
	
					<h:outputLabel value="Descripción:" />
					<p:inputText maxlength="150" value="#{paramDetComunController.parametro.descripcion}" />
					
					<h:outputLabel value="Texto 1:" />
					<p:inputText maxlength="500" value="#{paramDetComunController.parametro.texto1}" />
	
					<h:outputLabel value="Texto 2:" />
					<p:inputText maxlength="200" value="#{paramDetComunController.parametro.texto2}" />
	
					<h:outputLabel value="Texto 3:" />
					<p:inputText maxlength="200" value="#{paramDetComunController.parametro.texto3}" />
					
					<h:outputLabel value="Texto 4:" />
					<p:inputText maxlength="200" value="#{paramDetComunController.parametro.texto4}" />
					
					<h:outputLabel value="Estado 1:" />
					<h:selectOneMenu id="idEstado1" value="#{paramDetComunController.parametro.estado1}"
						styleClass="normal" style=" width : 150px;">
						<f:selectItem itemLabel="Seleccione" itemValue="" />
						<f:selectItem itemLabel="Activo" itemValue="A" />
						<f:selectItem itemLabel="Inactivo" itemValue="I" />
					</h:selectOneMenu> 
					
					<h:outputLabel value="Estado 2:" />
					<h:selectOneMenu id="idEstado2" value="#{paramDetComunController.parametro.estado2}"
						styleClass="normal" style=" width : 150px;">
						<f:selectItem itemLabel="Seleccione" itemValue="" />
						<f:selectItem itemLabel="Activo" itemValue="A" />
						<f:selectItem itemLabel="Inactivo" itemValue="I" />
					</h:selectOneMenu> 
				</h:panelGrid>
	
				<br />
				<center>
					<p:commandButton value="Guardar"
						action="#{paramDetComunController.guardarItem}" update="idForm"></p:commandButton>
				</center>
			</h:form>
		</p:dialog>
		
		<p:dialog widgetVar="DlgResultAcc" id="DlgResultAcc" header="Parametro Accesorio"
			resizable="true" modal="true" closable="true" appendTo="@(body)"
			height="250" width="30%" closeOnEscape="true" style="position:fixed"
			responsive="true" showEffect="slide">
			<h:form id="frmResultAcc">
				<h:panelGrid columns="2">
					<h:outputLabel value="Compañia:"/>
					<p:inputText size="20" maxlength="2" required="true" 
						disabled="true" value="#{paramDetComunController.parametro.paramDetPK.noCia}" />
				
					<h:outputLabel value="Código:"/>
					<p:inputText size="20" maxlength="6" required="true" 
						disabled="true" value="#{paramDetComunController.parametro.paramDetPK.codigo}" />
	
					<h:outputLabel value="Catálogo:"/>
					<p:inputText size="20" maxlength="3" 
						rendered="#{paramDetComunController.parametro.paramDetPK.codigo eq 'TSACC'}"
						value="#{paramDetComunController.parametro.paramDetPK.codigoDet}" onkeyup="mayus(this)"
						disabled="#{!paramDetComunController.esNuevo}"/>
					<p:inputText size="20" maxlength="#{paramDetComunController.parametro.paramDetPK.codigo eq 'REPORI' ? 30 : 3}" 
						rendered="#{paramDetComunController.parametro.paramDetPK.codigo ne 'TSACC'}"
						value="#{paramDetComunController.parametro.texto1}" onkeyup="mayus(this)"
						disabled="#{!paramDetComunController.esNuevo}"/>
	
					<h:outputLabel value="Descripción catálogo:" />
					<p:inputText maxlength="150" value="#{paramDetComunController.parametro.descripcion}" onkeyup="mayus(this)"/>
					
					<h:outputLabel value="Catálogo padre:" 
						rendered="#{paramDetComunController.parametro.paramDetPK.codigo eq 'STACC'}"/>
					<p:selectOneMenu autoWidth="false" style="width: 100%;"
						rendered="#{paramDetComunController.parametro.paramDetPK.codigo eq 'STACC'}"
						value="#{paramDetComunController.parametro.texto2}">
						<f:selectItem itemLabel="Seleccione" noSelectionOption="true"/>
						<f:selectItems value="#{paramDetComunController.paramDetPadres}" var="item" 
							itemValue="#{item.texto1}" itemLabel="#{item.descripcion}"/>			
					</p:selectOneMenu>
	
					<h:outputLabel value="Orden:" />
					<p:inputText size="20" maxlength="3" 
						rendered="#{paramDetComunController.parametro.paramDetPK.codigo eq 'TSACC'}"
						value="#{paramDetComunController.parametro.texto1}" />
					<p:inputText size="20" maxlength="3" 
						rendered="#{paramDetComunController.parametro.paramDetPK.codigo ne 'TSACC'}"
						value="#{paramDetComunController.parametro.texto3}" />
					
					<h:outputLabel value="Estado:" />
					<p:selectOneMenu id="idEstado1" value="#{paramDetComunController.parametro.estado1}"
						styleClass="normal" style=" width : 150px;">
						<f:selectItem itemLabel="Seleccione" itemValue="" />
						<f:selectItem itemLabel="Activo" itemValue="A" />
						<f:selectItem itemLabel="Inactivo" itemValue="I" />
					</p:selectOneMenu> 
					
				</h:panelGrid>
		        <br />
				<center>
					<p:commandButton value="Guardar"
						action="#{paramDetComunController.guardarItem}">
					</p:commandButton>
				</center>
			</h:form>
		</p:dialog>

	</ui:define>
</ui:composition>
