<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core">
<head>
<h:outputStylesheet name="css/layout-lightblue.css"
	library="serenity-layout" />
</head>
<ui:composition>
	<p:outputPanel autoUpdate="true">
		<h:panelGrid title="Ingrese los datos del usuario" columns="2">
			<p:commandLink value="Usuario:" update="idDialogUsuarios"
				title="Clic para seleccionar un usuario"
				oncomplete="PF('dialogUsuarios').show();"
				actionListener="#{alertaUsuariosController.cargarDialogoUsuarios}">
			</p:commandLink>
			<p:inputText id="nombre"
				value="#{alertaUsuariosController.usuarioAlertaDto.nombre}" />
			<h:outputText value="CORREO ELECTRÓNICO:" for="email" />
			<p:inputText id="email"
				value="#{alertaUsuariosController.usuarioAlertaDto.email}" />
			<h:outputText value="ESTADO:" for="estado" />
			<p:inputText id="estado"
				value="#{alertaUsuariosController.usuarioAlertaDto.estado}" />
			<h:outputText value="CARGO:"/>
			<p:selectOneMenu id="idCargo" style="width: 150px; font-weight:bold;"
				value="#{alertaUsuariosController.usuarioAlertaDto.puesto}" filter="true"
				filterMatchMode="contains">
				<f:selectItem itemLabel="SELECCIONE" itemValue="" />
				<f:selectItems value="#{alertaUsuariosController.cargos}"
					var="itemCargo" itemLabel="#{itemCargo.descripcion}"
					itemValue="#{itemCargo.codCargo}" />
			</p:selectOneMenu>
		</h:panelGrid>
		<h:panelGrid id="idBotones" columns="1"
			style="text-align:center;width:100%">
			<p:commandButton value="Guardar"
				action="#{alertaUsuariosController.guardarUsuarioAlerta}"
				partialSubmit="true" process="@this, frmUsuario,idCargo"
				oncomplete="PF('dialogUsuario').hide();"
				update=":form:dtListaUsuarios" />
		</h:panelGrid>
	</p:outputPanel>
	<p:dialog id="idDialogUsuarios" widgetVar="dialogUsuarios"
		header="Seleccione usuario..." style="position:fixed"
		responsive="true" closeOnEscape="true" modal="true" appendTo="@(body)"
		width="440" height="420">
		<h:form>
			<ui:fragment>
				<ui:include src="/common/dialog/dialogUsuarios.xhtml"></ui:include>
			</ui:fragment>
		</h:form>
	</p:dialog>
</ui:composition>
</html>
