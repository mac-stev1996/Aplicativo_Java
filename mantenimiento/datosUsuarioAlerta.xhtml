<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core">
<head>
</head>
<ui:composition>
	<p:outputPanel id="datosCliente" style="text-align:left;">
		<h:panelGrid id="idPanelDatosUsuario" columns="2">
			<p:outputLabel value="NOMBRE:" style="font-weight: bold;" />
			<p:outputLabel
				value="#{alertaUsuariosController.usuariosAlertaSeleccionado.nombre}" />
			<p:outputLabel value="CARGO:" style="font-weight: bold;" />
			<p:outputLabel
				value="#{alertaUsuariosController.usuariosAlertaSeleccionado.cargo}" />
			<p:outputLabel value="ESTADO:" style="font-weight: bold;" />
			<p:outputLabel
				value="#{alertaUsuariosController.usuariosAlertaSeleccionado.estado eq 'A'?'Activo':'Desactivado'}" />
		</h:panelGrid>
	</p:outputPanel>
</ui:composition>
</html>
