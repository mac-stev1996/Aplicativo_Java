<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    template="/jsf/templates/bodyTemplate.xhtml">

    <ui:define name="title">Rol de Documento</ui:define>

    <ui:define name="buttons">
        <h:form id="formBotonesRol">
            <p:commandButton value="Guardar" icon="fa fa-save"
                styleClass="green-btn"
                type="button"
                onclick="document.getElementById('formRol:btnGuardar').click();" />
            <p:commandButton value="Cancelar" icon="fa fa-times"
                styleClass="secondary-btn"
                action="#{rolFormController.cancelar()}"
                process="@this" immediate="true" />
            <p:commandButton value="Inactivar" icon="fa fa-ban"
                styleClass="red-btn"
                rendered="#{!rolFormController.esNuevo and rolFormController.rol.estado == 'A'}"
                onclick="PF('dlgConfirmarEliminar').show(); return false;"
                type="button" />
            <p:commandButton value="Activar" icon="fa fa-check-circle"
                styleClass="green-btn"
                rendered="#{!rolFormController.esNuevo and rolFormController.rol.estado == 'I'}"
                onclick="PF('dlgConfirmarActivar').show(); return false;"
                type="button" />
        </h:form>
    </ui:define>

    <ui:define name="content">
        <h:form id="formRol" onkeypress="return event.keyCode!=13">
            <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" />

            <p:commandButton id="btnGuardar" style="display:none;"
                action="#{rolFormController.guardar()}"
                process="@form" update="messages" />

            <!-- Datos del rol -->
            <p:fieldset legend="Datos del Rol" style="margin-top: 12px;">
                <h:panelGrid columns="2"
                    columnClasses="w20 txtR, w80"
                    width="100%">

                    <p:outputLabel value="N°:" styleClass="bold"/>
                    <h:outputText value="#{rolFormController.esNuevo ? '(nuevo)' : rolFormController.numeroSecuencial}" />

                    <p:outputLabel value="Nombre:" for="nombre" styleClass="bold"/>
                    <p:inputText id="nombre"
                        value="#{rolFormController.rol.nombre}"
                        required="true"
                        requiredMessage="El nombre del rol es requerido"
                        maxlength="30" style="width:80%; text-transform:uppercase;"
                        oninput="this.value = this.value.toUpperCase();" />

                    <p:outputLabel value="Descripción:" for="descripcion" styleClass="bold"/>
                    <p:inputText id="descripcion"
                        value="#{rolFormController.rol.descripcion}"
                        maxlength="150" style="width:80%; text-transform:uppercase;"
                        oninput="this.value = this.value.toUpperCase();" />

                    <p:outputLabel value="Estado:" rendered="#{!rolFormController.esNuevo}" styleClass="bold"/>
                    <h:outputText value="#{rolFormController.rol.estado == 'A' ? 'ACTIVO' : 'INACTIVO'}"
                        rendered="#{!rolFormController.esNuevo}" />

                </h:panelGrid>
            </p:fieldset>

            <!-- Módulos asignados -->
            <p:fieldset legend="Módulos" style="margin-top: 12px;" styleClass="centered-picklist-fieldset">
                <p:pickList id="pickModulos"
                    value="#{rolFormController.modeloModulos}"
                    var="modu"
                    itemValue="#{modu}"
                    itemLabel="#{modu} - #{rolFormController.moduloNombres[modu]}"
                    showSourceFilter="true"
                    showTargetFilter="true"
                    filterMatchMode="contains"
                    responsive="true">
                    <f:facet name="sourceCaption">Disponibles</f:facet>
                    <f:facet name="targetCaption">Asignados</f:facet>
                </p:pickList>
            </p:fieldset>

            <!-- Usuarios asignados -->
            <p:fieldset legend="Usuarios" style="margin-top: 12px;" styleClass="centered-picklist-fieldset">
                <p:pickList id="pickUsuarios"
                    value="#{rolFormController.modeloUsuarios}"
                    var="usr"
                    itemValue="#{usr}"
                    itemLabel="#{usr} - #{rolFormController.usuarioNombres[usr]}"
                    showSourceFilter="true"
                    showTargetFilter="true"
                    filterMatchMode="contains"
                    responsive="true">
                    <f:facet name="sourceCaption">Disponibles</f:facet>
                    <f:facet name="targetCaption">Asignados</f:facet>
                </p:pickList>
            </p:fieldset>

            <p:confirmDialog id="dlgConfirmarEliminar" widgetVar="dlgConfirmarEliminar"
                header="Confirmar inactivación" severity="warn"
                message="¿Está seguro de inactivar este rol? Se inactivarán también todos sus módulos y usuarios asociados.">
                <p:commandButton value="Sí" icon="fa fa-check"
                    styleClass="red-btn"
                    action="#{rolFormController.eliminar()}"
                    process="@this" />
                <p:commandButton value="No" icon="fa fa-times"
                    styleClass="secondary-btn"
                    onclick="PF('dlgConfirmarEliminar').hide();" type="button" />
            </p:confirmDialog>

            <p:confirmDialog id="dlgConfirmarActivar" widgetVar="dlgConfirmarActivar"
                header="Confirmar activación" severity="info"
                message="¿Está seguro de activar este rol?">
                <p:commandButton value="Sí" icon="fa fa-check"
                    styleClass="green-btn"
                    action="#{rolFormController.activar()}"
                    process="@this" />
                <p:commandButton value="No" icon="fa fa-times"
                    styleClass="secondary-btn"
                    onclick="PF('dlgConfirmarActivar').hide();" type="button" />
            </p:confirmDialog>

        </h:form>

        <style type="text/css">
            .centered-picklist-fieldset .ui-picklist {
                max-width: 80%;
                margin: 0 auto;
                display: flex !important;
            }
            .centered-picklist-fieldset .ui-picklist-list-wrapper {
                flex: 1 !important;
                width: auto !important;
            }
            .centered-picklist-fieldset .ui-picklist > :nth-child(2) {
                flex-shrink: 0;
                align-self: center !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: center !important;
            }
            @media (max-width: 640px) {
                .centered-picklist-fieldset .ui-picklist {
                    max-width: 100%;
                    flex-direction: column !important;
                }
                .centered-picklist-fieldset .ui-picklist-list-wrapper { width: 100% !important; }
            }
        </style>

        <script type="text/javascript">
            $(document).ready(function() {
                $('#formRol\\:pickModulos_source_filter, #formRol\\:pickModulos_target_filter').attr('placeholder', 'Buscar...');
                $('#formRol\\:pickUsuarios_source_filter, #formRol\\:pickUsuarios_target_filter').attr('placeholder', 'Buscar...');
            });
        </script>
    </ui:define>

</ui:composition>
