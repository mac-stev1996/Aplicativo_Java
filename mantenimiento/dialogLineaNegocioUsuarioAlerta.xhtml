<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core">
<head>

</head>
<ui:composition>
	<h:panelGrid id="idPanelLineasNegocio" columns="1">
		<ui:fragment>
			<ui:include src="/jsf/mantenimiento/datosUsuarioAlerta.xhtml"></ui:include>
		</ui:fragment>
		<p:dataTable id="idLineasNegocio" var="item"
			value="#{alertaUsuariosController.lineasNegocio}"
			multiViewState="true" rowIndexVar="row" rows="7" filterDelay="600"
			paginatorPosition="bottom"
			paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
			paginator="true"
			selection="#{alertaUsuariosController.lineasSeleccionadas}"
			rowKey="#{item.noLinea}">
			<f:facet name="header">Lineas de Negocio</f:facet>
			<p:column headerText="N°" width="2%" style="text-align:center">
				<h:outputText value="#{row+1}" />
			</p:column>
			<p:column headerText="Código" width="5%" style="text-align:center">
				<h:outputText value="#{item.noLinea}" />
			</p:column>
			<p:column headerText="Nombre" width="30%">
				<h:outputText value="#{item.descripcion}" />
			</p:column>
			<p:column width="2%" selectionMode="multiple" id="selectLinea">
			</p:column>
		</p:dataTable>
	</h:panelGrid>
	<h:panelGrid id="idBotones" columns="1"
		style="text-align:center;width:100%">
		<p:commandButton value="Guardar"
			action="#{alertaUsuariosController.guardarLineasNegocio}"
			oncomplete="PF('dialogLineaNegocio').hide();"
			update=":#{p:component('form')}" partialSubmit="true"
			process="@this, frmLineaNegocio" />
	</h:panelGrid>
</ui:composition>
</html>
