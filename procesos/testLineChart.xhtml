<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/jsf/templates/bodyTemplate.xhtml">

	<ui:define name="title">
		Registro de Nueva Tarea
	</ui:define>

	<ui:define name="buttons">
		<h:form id="frmButtons">
			<p:commandButton value="Guardar"
				actionListener="#{registroTareaController.guardarTarea}"
				process="@this, form" partialSubmit="true" styleClass="green-btn" icon="fa fa-floppy-o" title="Guardar Tarea"></p:commandButton>
			<p:commandButton value="Regresar" styleClass="orange-btn" icon="fa fa-reply"></p:commandButton>
		</h:form>
	</ui:define>

	<ui:define name="content">

		<style type="text/css">
.select {
	background-color: white;
	color: #212121;
	max-height: 20px;
	right: 10%;
	top: 5px;
}
</style>

		<div class="ui-g dashboard">
			<div class="ui-g-12 ui-fluid contact-form">
				<div class="ui-g-11" style="background-color:white;">

					<h:form id="form">

						<br />
						<div class="ui-lg-12 ui-md-12ui-g-12">
							<h:panelGroup styleClass="md-inputfield">
								<p:inputText id="j_titulo" autocomplete="off"
									value="#{registroTareaController.tarea.tituloTarea}"
									requiredMessage="Ingrese el Titulo de la Tarea" />
								<p:message for="j_titulo"></p:message>
								<label>Titulo de la Tarea</label>
							</h:panelGroup>
						</div>
						
					<h:inputHidden id="line_type" value="#{dibujaBean.line.type}" />
					<h:inputHidden id="line_title" value="#{dibujaBean.line.title}" />
					<h:inputHidden id="line_subtitle" value="#{dibujaBean.line.subtitle}" />
					<h:inputHidden id="line_xAxisCategories" value="#{dibujaBean.line.CategoriestoGson()}" />
					<h:inputHidden id="line_yAxisTitle" value="#{dibujaBean.line.yAxis}" />
					<h:inputHidden id="line_data_series" value="#{dibujaBean.line.SeriestoGson()}" />
					
					
					<div id="line_container" title="PIE" />
						<br/>
					<p:panelGrid columns="2" rendered="true" >
						<p:outputLabel value="Propiedad" style="font-size:12; font-weight:bolder"/>
						<p:outputLabel value="Valor" style="font-size:12; font-weight:bolder"/>
						<p:outputLabel value="Tipo Grafico: " style="font-size:12; font-weight:bolder"/>
						<p:outputLabel value="#{dibujaBean.line.type}" style="font-size:12"/>
						<p:outputLabel value="Titulo Grafico (String): " style="font-size:12; font-weight:bolder"/>
						<p:outputLabel value="#{dibujaBean.line.title}" style="font-size:12"/>
						<p:outputLabel value="Subtitulo Grafico (String): " style="font-size:12; font-weight:bolder"/>
						<p:outputLabel value="#{dibujaBean.line.subtitle}" style="font-size:12"/>
						<p:outputLabel value="Categorias X (Gson): " style="font-size:12; font-weight:bolder"/>
						<p:outputLabel value="#{dibujaBean.line.CategoriestoGson()}" style="font-size:12"/>
						<p:outputLabel value="Categorias Y (String): " style="font-size:12; font-weight:bolder"/>
						<p:outputLabel value="#{dibujaBean.line.yAxis}" style="font-size:12"/>
						<p:outputLabel value="Data series(Gson): " style="font-size:12; font-weight:bolder"/>
						<p:outputLabel id="lbl_title" title="Gson" value="#{dibujaBean.line.SeriestoGson()}" style="font-size:12"/>			
					</p:panelGrid>		
						

					</h:form>
				</div>
			</div>
		</div>
		<h:outputScript library="js" name="highcharts.js" />
   		<h:outputScript library="js" name="exporting.js" />
   		<h:outputScript library="js" name="highcharts-3d.js" />
   		<h:outputScript library="js" name="highChartTheme/grid-light.js" />
		<h:outputScript library="js" name="charts/chart_line.js" />
   		
	</ui:define>
</ui:composition>
