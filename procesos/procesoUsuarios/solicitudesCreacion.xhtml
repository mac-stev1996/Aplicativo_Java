<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core">

	<p:panelGrid columns="1" id="pgCreacion" width="100%" layout="grid"
		columnClasses="ui-grid-col-12">

		<p:dataTable id="dtSolCreacion" styleClass="table" paginator="true"
			paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
			currentPageReportTemplate="{startRecord} - {endRecord} de {totalRecords}"
			emptyMessage="No existen registros" selectionMode="single"
			rowKey="#{item}" paginatorPosition="bottom" rows="100" rowStyleClass="#{item.estiloFila}"
			value="#{procesoUsuariosController.lstSolicitudCreacion}" var="item">

			<p:column headerText="No Sol." width="5%" styleClass="txtC"
				sortBy="#{item.controlUsuariosPK.solicitudNo}">
				<h:outputText value="#{item.controlUsuariosPK.solicitudNo}"
					title="#{item.controlUsuariosPK.solicitudNo}" />
			</p:column>

			<p:column headerText="Tipo sol." width="5%" styleClass="txtC">
				<h:outputText value="#{item.tipoSolDescri}"
					title="#{item.tipoSolDescri}" />
			</p:column>

			<p:column headerText="Tipo usuario" width="5%" styleClass="txtC"
				style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
				<h:outputText value="#{item.tipoUsuarioDescri}"
					title="#{item.tipoUsuarioDescri}" />
			</p:column>

			<p:column headerText="Fecha" width="5%" styleClass="txtC"
				sortBy="#{item.fecha}">
				<h:outputText value="#{item.fecha}">
					<f:convertDateTime pattern="dd/MM/yyyy" />
				</h:outputText>
			</p:column>

			<p:column headerText="Solicitado Por" width="5%" styleClass="txtC">
				<h:outputText value="#{item.solicitadoPor}"
					title="#{item.solicitadoPor}" />
			</p:column>

			<p:column headerText="Empresa" width="5%" styleClass="txtC"
				style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
				<h:outputText value="#{item.nombreCliente}"
					title="#{item.nombreCliente}" />
			</p:column>

			<p:column headerText="Cod Empleado" width="5%" styleClass="txtC">
				<h:outputText value="#{item.noEmple}" />
			</p:column>

			<p:column headerText="Cédula" width="7%" styleClass="txtC"
				filterBy="#{item.cedula}">
				<h:outputText value="#{item.cedula}" />
			</p:column>

			<p:column headerText="N° Tarea" width="5%" styleClass="txtC"
				filterBy="#{item.tareaId}">
				<h:outputText value="#{item.tareaId}" />
			</p:column>

			<p:column headerText="Apellidos" width="10%" styleClass="txtL"
				style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
				filterBy="#{item.apellidos}">
				<h:outputText value="#{item.apellidos}" title="#{item.apellidos}" />
			</p:column>

			<p:column headerText="Nombre" width="10%" styleClass="txtL"
				style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
				filterBy="#{item.nombres}">
				<h:outputText value="#{item.nombres}" title="#{item.nombres}" />
			</p:column>

			<p:column headerText="Fecha Ingreso" width="5%" styleClass="txtC"
				sortBy="#{item.fechaIngreso}">
				<h:outputText value="#{item.fechaIngreso}">
					<f:convertDateTime pattern="dd/MM/yyyy" />
				</h:outputText>
			</p:column>

			<p:column headerText="Estado" width="5%" styleClass="txtC"
				filterBy="#{item.estadoDescri}">
				<h:outputText value="#{item.estadoDescri}"
					title="#{item.estadoDescri}" />
			</p:column>

			<p:column headerText="Tecnico" width="5%" styleClass="txtC"
				rendered="#{procesoUsuariosController.jefeSistemas}"
				filterBy="#{item.tecnicoId}">
				<h:outputText value="#{item.tecnicoId}" title="#{item.tecnicoId}" />
			</p:column>

			<p:column headerText="Acciones" width="5%">
				<div style="display: flex; justify-content: center;">

					<p:commandLink partialSubmit="true" process="@form"
						update="@form, :#{p:component('idSolCreacion')}"
						oncomplete="PF('DlgSolCreacion').show();"
						style="margin-right: 15px;"
						action="#{procesoUsuariosController.cargarSolCreacion(item)}">
						<i class="fa fa-pencil fa-2x" title="Editar Solicitud"
							style="color: #0288d1;" />
					</p:commandLink>

					<p:commandLink process="@form" update="@this" target="_blank"
						partialSubmit="true" ajax="flase"
						action="#{procesoUsuariosController.reporteSalida(item)}">
						<i class="fa fa-file-pdf-o fa-2x" title="Generar Reporte"
							style="color: #ff0000;" />
					</p:commandLink>

				</div>
			</p:column>
		</p:dataTable>
	</p:panelGrid>

	<p:dialog header="Solicitud Creacion" id="idSolCreacion"
		widgetVar="DlgSolCreacion" modal="true" showEffect="fade"
		hideEffect="fade" resizable="true" width="650" height="350"
		position="center center" appendTo="@(body)">
		<h:form id="frSolCreacion">

			<h:panelGrid id="pgSolCreacion" columns="4">



			</h:panelGrid>


		</h:form>
	</p:dialog>

</ui:composition>
