<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core">

	<p:panelGrid columns="1" id="pnlCertificacion" width="100%"
		layout="grid" columnClasses="ui-grid-col-12">

		<p:panel style="display: flex; justify-content: flex-end;"
			styleClass="noborder">
			<p:commandButton value="Guardar" id="btnGuardarSob"
				styleClass="green-btn" icon="fa fa-save" partialSubmit="true"
				actionListener="#{certificacionesAsignadasController.guardar}"
				process="@this, :frmCertificacion:pnlDatos, :frmCertificacion:tblDetalle"
				update=":frmCertificacion, :frmCertificacion:tblDetalle">
			</p:commandButton>
			<p:commandButton value="Certificar" id="btnCertificar"
				styleClass="green-btn" icon="fa fa-thumbs-o-up"
				rendered="#{certificacionesAsignadasController.certificar}"
				partialSubmit="true"
				actionListener="#{certificacionesAsignadasController.aceptarCertificacion}"
				process="@this, :frmCertificacion:pnlDatos, :frmCertificacion:tblDetalle "
				update=":frmCertificacion, :frmCertificacion:tblDetalle">
			</p:commandButton>
			<p:commandButton value="No Certificar" id="btnNoCertificar"
				styleClass="red-btn" icon="fa fa-thumbs-o-down"
				rendered="#{certificacionesAsignadasController.noCertificar}"
				partialSubmit="true"
				actionListener="#{certificacionesAsignadasController.negarCertificacion}"
				process="@this, :frmCertificacion:pnlDatos, :frmCertificacion:tblDetalle"
				update=":frmCertificacion, :frmCertificacion:tblDetalle">
			</p:commandButton>
			<p:commandButton value="Regresar" process="@this" styleClass="boton"
				icon="fa fa-reply"
				action="#{certificacionesAsignadasController.regresar}"
				update=":frmCertificacion">
			</p:commandButton>
		</p:panel>

		<p:panel styleClass="noborder">
			<h:panelGrid id="pnlDatos" columns="6" style="width:100%">
				<p:outputLabel value="Certificacion No: " styleClass="bold"
					for="txtNo" />
				<p:outputLabel id="txtNo" styleClass="normal"
					value="#{certificacionesAsignadasController.certificacion.codigo}" />

				<p:outputLabel value="No. Requerimiento:" styleClass="bold"
					for="txtReq" />
				<p:outputLabel id="txtReq" styleClass="normal"
					value="#{certificacionesAsignadasController.certificacion.solicitudNo}" />

				<p:outputLabel value="Titulo:" styleClass="bold" for="txtTitulo" />
				<p:outputLabel id="txtTitulo" styleClass="normal"
					value="#{certificacionesAsignadasController.certificacion.requerimiento.referencia}" />

				<p:outputLabel value="Certificación Obligatoria:" styleClass="bold"
					for="txtOpCertifica" />
				<p:outputLabel id="txtOpCertifica" styleClass="normal"
					value="#{certificacionesAsignadasController.certificacion.opcionCertifica eq 'S' ? 'SI': 'NO' }" />

				<p:outputLabel value="Usuario Solicita:" styleClass="bold"
					for="txtSolicitante" />
				<p:outputLabel id="txtSolicitante" styleClass="normal"
					value=" #{certificacionesAsignadasController.certificacion.solicitante}" />

				<p:outputLabel value="Fecha Solicitud:" styleClass="bold"
					for="txtFecha" />
				<p:outputLabel id="txtFecha" styleClass="normal"
					value="#{certificacionesAsignadasController.certificacion.fecha}">
					<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
				</p:outputLabel>

				<p:outputLabel value="Tecnico Responsable:" styleClass="bold"
					for="txtResponsable" />
				<p:outputLabel id="txtResponsable" styleClass="normal"
					value=" #{certificacionesAsignadasController.certificacion.responsable}" />

				<p:outputLabel value="Lider Desarrollo:" styleClass="bold"
					for="txtResControl" />
				<p:outputLabel id="txtResControl" readonly="true"
					styleClass="normal"
					value=" #{certificacionesAsignadasController.certificacion.requerimiento.responsableControl}" />

				<p:outputLabel value="Prioridad:" styleClass="bold"
					for="txnPrioridad" style="COLOR:RED" />
				<p:outputLabel id="txnPrioridad" styleClass="normal"
					value="#{certificacionesAsignadasController.certificacion.prioridadCertifica}" />

				<p:outputLabel value="Estado: " styleClass="bold" style="COLOR:RED"
					for="txtEstado" />
				<p:outputLabel id="txtEstado" styleClass="normal"
					value="#{certificacionesAsignadasController.certificacion.estado eq null ? '-': 'N/A' or
					certificacionesAsignadasController.certificacion.estado eq 'I' ? 'INGRESADO': '-' or 
					certificacionesAsignadasController.certificacion.estado eq 'P' ? 'EN PROCESO': 'INGRESADO' or 
					certificacionesAsignadasController.certificacion.estado eq 'R' ? 'CERTIFICADO': 'EN PROCESO' or 
					certificacionesAsignadasController.certificacion.estado eq 'O' ? 'NO CERTIFICADO':'EN REVISION'}" />
				<p:outputLabel value="URL Branch:" styleClass="bold" for="txtUrl" />
				<p:inputTextarea id="txtUrl" readonly="true" styleClass="normal"
					style="width:95%!important; text-align:justify" rows="2"
					value="#{certificacionesAsignadasController.certificacion.requerimiento.ramaGit}" />

				<p:outputLabel value="Observación:" styleClass="bold"
					for="txtObservacion" />
				<h:panelGroup>
					<p:inputTextarea id="txtObservacion" styleClass="normal"
						onkeyup="mayus(this)" counter="obse" readonly="true"
						style="width:95%!important; text-align:justify" rows="4"
						maxlength="500"
						value="#{certificacionesAsignadasController.certificacion.observacion}"
						counterTemplate="{0} caracteres restantes." />
					<br />
					<h:outputText id="obse" />
				</h:panelGroup>
				<p:outputLabel value="Puesto en Produccion:" styleClass="bold" style="COLOR:RED"
					for="txtEstado" />
				<p:outputLabel id="isPuestoProd" styleClass="normal"
					value="#{certificacionesAsignadasController.certificacion.versionado eq 'S' ? 'SI': 'NO' }" />
			</h:panelGrid>
		</p:panel>

		<p:panel>
			<p:tabView id="tabVieGen">
				<p:tab id="tabArcRequerimiento" title="Archivos Requerimientos">

					<p:dataTable id="archivosDT" widgetVar="wvArchivosDT"
						value="#{certificacionesAsignadasController.listaArchivosAdjuntos}"
						var="item"
						emptyMessage="No hay archivos cargados para esta certificacion"
						rowIndexVar="index" rowKey="#{item.archivoId}" paginator="true"
						rows="5" paginatorPosition="bottom"
						paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
						scrollable="true" scrollWidth="100%" style="width:100%;">
						<f:facet name="header">
			            Archivos Digitales cargados
			        </f:facet>
						<p:column headerText="Nombre Archivo" styleClass="txtL"
							width="30%">
							<p:outputLabel value="#{item.nombre}" />
						</p:column>
						<p:column headerText="Fecha" styleClass="txtL" width="20%">
							<p:outputLabel value="#{item.fechaIngreso}">
								<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
							</p:outputLabel>
						</p:column>
						<p:column headerText="Descargar" width="10%"
							style="text-align:center">
							<p:commandLink id="downloadLink" value="Descargar" ajax="false"
								icon="ui-icon-arrowthichk-s">
								<p:fileDownload
									value="#{certificacionesAsignadasController.descargarArchivo(item)}" />
							</p:commandLink>
						</p:column>
					</p:dataTable>
				</p:tab>
				<p:tab id="tabArcCertificacion" title="Archivos Certificaciones">

					<p:fileUpload id="btnArchivo" required="true"
						widgetVar="btnArchivoWidgetVar"
						fileUploadListener="#{certificacionesAsignadasController.guardarArchivoDigital}"
						mode="advanced" dragDropSupport="true" multiple="true"
						allowTypes="/(\.|\/)(jpe?g|png|doc|docx|pdf)$/"
						invalidFileMessage="Formato de archivo no válido" process="@this"
						update=":frmCertificacion:tabVieGen:certificacionDT"
						label="Seleccionar" cancelLabel="Cancelar" uploadLabel="Cargar" />
					<p:spacer />

					<p:dataTable id="certificacionDT" widgetVar="wvCertificacionDT"
						value="#{certificacionesAsignadasController.listaArchivosDigitales}"
						var="item"
						emptyMessage="No hay archivos cargados para esta certificacion"
						rowIndexVar="index" rowKey="#{item.archivoId}" paginator="true"
						rows="5" paginatorPosition="bottom"
						paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
						scrollable="true" scrollWidth="100%" style="width:100%;">
						<f:facet name="header">
			            Archivos Digitales Certificaciones
			        </f:facet>
						<p:column headerText="Nombre Archivo" styleClass="txtL"
							width="30%">
							<p:outputLabel value="#{item.nombre}" />
						</p:column>
						<p:column headerText="Fecha" styleClass="txtL" width="20%">
							<p:outputLabel value="#{item.fecha}">
								<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
							</p:outputLabel>
						</p:column>
						<p:column headerText="Descargar" styleClass="txtC" width="50%">
							<h:commandLink id="seeFoto"
								action="#{certificacionesAsignadasController.verArchivo}"
								target="_blank">
								<p:graphicImage value="/images/dynamic?file=#{item.archivo}"
									style="display: block; margin: 0px auto;" height="100"
									width="150" />
								<f:setPropertyActionListener value="#{item.path}"
									target="#{certificacionesAsignadasController.urlArchivo}" />
							</h:commandLink>
						</p:column>
						<p:column headerText="Eliminar"
							style="width:75px;text-align: center">
							<p:commandButton id="btnEliminarArchivo" icon="ui-icon-trash"
								process="@this" oncomplete="PF('diaEliArchivo').show();"
								style="width:16px;height:16px;">
								<f:setPropertyActionListener value="#{item}"
									target="#{certificacionesAsignadasController.archivoSel}" />
							</p:commandButton>
						</p:column>
					</p:dataTable>
				</p:tab>
			</p:tabView>

		</p:panel>

		<p:panel>
			<p:dataTable id="tblDetalle" var="item" rowIndexVar="row"
				widgetVar="tblDetalle"
				rowStyleClass="#{item.estado eq 'R' ? 'aprobado' : null or item.estado eq 'O' ? 'negado' : null}"
				value="#{certificacionesAsignadasController.listDetallesCriterios}"
				rowKey="#{item.codigo}" emptyMessage="No existe detalle del Ajuste"
				paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {Exporters}">
				<f:facet name="header">
					<h:outputLabel value="Lista Criterios Certificacion" />
				</f:facet>
				<p:column headerText="No." style="text-align:left;" width="1%">
					<p:outputLabel value="#{row + 1}" />
				</p:column>
				<p:column headerText="Criterio Certificacion" width="40%">
					<p:outputLabel value="#{item.criterio}" style="width:100%;" />
				</p:column>
				<p:column headerText="Certifica" width="10%">
					<p:selectOneMenu value="#{item.aprobado}" filter="true"
						filterMatchMode="contains">
						<f:selectItem itemLabel="Seleccione" itemValue=""
							noSelectionOption="true" />
						<f:selectItem itemLabel="Si" itemValue="SI" />
						<f:selectItem itemLabel="No" itemValue="NO" />
						<f:selectItem itemLabel="N/A" itemValue="NA" />
					</p:selectOneMenu>
				</p:column>
				<p:column headerText="Observacion" width="40%">
					<p:inputTextarea onkeyup="mayus(this)" value="#{item.observacion}"
						style="width:100%;" maxlength="500" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<!-- Cuadro de Dialogo Eliminar Archivo -->
		<p:confirmDialog widgetVar="diaEliArchivo" modal="true"
			header="Confirmación" message="Está seguro de eliminar el archivo">
			<p:commandButton value="Si" process="@this"
				action="#{certificacionesAsignadasController.deleteFile}"
				update="#{p:component('certificacionDT')}"
				oncomplete="PF('diaEliArchivo').hide();" />
			<p:commandButton value="No" onclick="PF('diaEliArchivo').hide();" />
		</p:confirmDialog>
	</p:panelGrid>
</ui:composition>
