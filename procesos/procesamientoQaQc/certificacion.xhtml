<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core">

	<p:panelGrid columns="1" id="pnlCertificacion" width="100%"
		layout="grid" columnClasses="ui-grid-col-12">

		<p:panel style="display: flex; justify-content: flex-end;"
			styleClass="noborder">
			<p:commandButton value="Guardar" id="btnGuardarSob"
				styleClass="green-btn" icon="fa fa-save" partialSubmit="true"
				actionListener="#{controlCertificacionesController.guardar}"
				process="@this, :frmCertificacion:pnlDatos, :frmCertificacion:tblDetalle"
				update=":frmCertificacion, :frmCertificacion:tblDetalle">
			</p:commandButton>
			<ui:remove>
				<p:commandButton value="Certificar" id="btnCertificar"
					styleClass="green-btn" icon="fa fa-thumbs-o-up"
					partialSubmit="true"
					actionListener="#{controlCertificacionesController.certificar}"
					process="@this, :frmCertificacion:pnlDatos, :frmCertificacion:tblDetalle "
					update=":frmCertificacion, :frmCertificacion:tblDetalle">
				</p:commandButton>
				<p:commandButton value="No Certificar" id="btnNoCertificar"
					styleClass="red-btn" icon="fa fa-thumbs-o-down"
					partialSubmit="true"
					actionListener="#{controlCertificacionesController.noCertificar}"
					process="@this, :frmCertificacion:pnlDatos, :frmCertificacion:tblDetalle"
					update=":frmCertificacion, :frmCertificacion:tblDetalle">
				</p:commandButton>
			</ui:remove>
			<p:commandButton value="Regresar" process="@this" styleClass="boton"
				icon="fa fa-reply"
				action="#{controlCertificacionesController.regresar}"
				update=":frmCertificacion">
			</p:commandButton>
		</p:panel>

		<p:panel styleClass="noborder">
			<h:panelGrid id="pnlDatos" columns="6" style="width:100%">
				<p:outputLabel value="Certificacion No: " styleClass="bold"
					style="COLOR:RED" for="txtNo" />
				<p:outputLabel id="txtNo" styleClass="bold"
					value="#{controlCertificacionesController.certificacion.codigo}" />

				<p:outputLabel value="Fecha Solicitud:" styleClass="bold"
					for="txtFecha" />
				<p:outputLabel id="txtFecha"
					value="#{controlCertificacionesController.certificacion.fecha}">
					<f:convertDateTime pattern="dd/MM/yyyy hh:mm:ss" />
				</p:outputLabel>

				<p:outputLabel value="Usuario Solicita:" styleClass="bold"
					for="txtSolicitante" />
				<p:inputText id="txtSolicitante" readonly="true"
					value="#{controlCertificacionesController.certificacion.solicitante}" />

				<p:outputLabel value="No. Requerimiento:" styleClass="bold"
					for="txtReq" />
				<p:outputLabel id="txtReq"
					value="#{controlCertificacionesController.certificacion.solicitudNo}" />

				<p:outputLabel value="Certificación Obligatoria:" styleClass="bold" />
				<p:selectOneMenu required="true"
					requiredMessage="Por favor seleccionar una opción de certificación"
					value="#{controlCertificacionesController.certificacion.opcionCertifica}"
					filter="true" filterMatchMode="contains">
					<f:selectItem itemLabel="Seleccione" itemValue=""
						noSelectionOption="true" />
					<f:selectItem itemLabel="Si" itemValue="S" />
					<f:selectItem itemLabel="No" itemValue="N" />
					<p:ajax event="change" process="@this"
						listener="#{controlCertificacionesController.validarCertificacionObligatoria}"
						update=":frmCertificacion" />
				</p:selectOneMenu>

				<p:outputLabel value="Tecnico Responsable:" styleClass="bold"
					for="txtResponsable" />
				<p:selectOneMenu
					value="#{controlCertificacionesController.certificacion.responsable}"
					filter="true" filterMatchMode="contains" id="txtResponsable">
					<f:selectItem itemLabel="Seleccione un Responsable" itemValue=""
						noSelectionOption="true" />
					<f:selectItems
						value="#{controlCertificacionesController.listaUsuResponsables}"
						var="re" itemLabel="#{re.nombre}" itemValue="#{re.usuario}" />
				</p:selectOneMenu>
				<p:outputLabel value="Lider Desarrollo:" styleClass="bold"
					for="txtResControl" />
				<p:outputLabel id="txtResControl" readonly="true"
					styleClass="normal"
					value=" #{controlCertificacionesController.certificacion.requerimiento.responsableControl}" />

				<p:outputLabel value="Titulo:" styleClass="bold" style="COLOR:RED"
					for="txtTitulo" />
				<p:outputLabel id="txtTitulo" styleClass="bold"
					value="#{controlCertificacionesController.certificacion.requerimiento.referencia}" />

				<p:outputLabel value="Prioridad:" styleClass="bold"
					for="txnPrioridad" />
				<p:inputNumber id="txnPrioridad"
					value="#{controlCertificacionesController.certificacion.prioridadCertifica}"
					decimalPlaces="0" thousandSeparator="" decimalSeparator="" size="3" />

				<p:outputLabel value="Estado: " styleClass="bold"
					style="COLOR:RED" for="txtEstado" />
				<p:outputLabel id="txtEstado" styleClass="bold"
					value="#{controlCertificacionesController.certificacion.estado eq null ? '-': 'N/A' or
					controlCertificacionesController.certificacion.estado eq 'I' ? 'INGRESADO': '-' or 
					controlCertificacionesController.certificacion.estado eq 'P' ? 'EN PROCESO': 'INGRESADO' or 
					controlCertificacionesController.certificacion.estado eq 'R' ? 'CERTIFICADO': 'EN PROCESO' or 
					controlCertificacionesController.certificacion.estado eq 'O' ? 'NO CERTIFICADO':'EN REVISION'}" />

				<p:outputLabel value="URL Branch:" styleClass="bold" for="txtUrl" />
				<p:inputTextarea id="txtUrl" readonly="true" styleClass="normal"
					style="width:95%!important; text-align:justify" rows="4"
					value="#{controlCertificacionesController.certificacion.requerimiento.ramaGit}" />

				<p:outputLabel value="Observacion:" styleClass="bold"
					for="txtObservacion" />
				<h:panelGroup>
					<p:inputTextarea id="txtObservacion" styleClass="normal"
						onkeyup="mayus(this)" counter="obs"
						style="width:95%!important; text-align:justify" rows="4"
						maxlength="500"
						value="#{controlCertificacionesController.certificacion.observacion}"
						counterTemplate="{0} caracteres restantes." />
					<br />
					<h:outputText id="obs" />
				</h:panelGroup>
				
				<p:outputLabel value="Puesto en Produccion:" styleClass="bold" style="COLOR:RED"
					for="idPuestoProd" />
				<p:selectOneMenu required="true" id="idPuestoProd" value="#{controlCertificacionesController.certificacion.versionado}" 
					filter="true" filterMatchMode="contains">
					<f:selectItem itemLabel="Seleccione" itemValue=""
						noSelectionOption="true" />
					<f:selectItem itemLabel="Si" itemValue="S" />
					<f:selectItem itemLabel="No" itemValue="N" />
				</p:selectOneMenu>
				
			</h:panelGrid>
		</p:panel>

		<p:panel styleClass="noborder">

			<p:tabView id="tabVieGen">
				<p:tab id="tabArcRequerimiento" title="Archivos Requerimientos">

					<p:dataTable id="archivosDT" widgetVar="wvArchivosDT"
						value="#{controlCertificacionesController.listaArchivosAdjuntos}"
						var="item"
						emptyMessage="No hay archivos cargados para esta certificacion"
						rowIndexVar="index" rowKey="#{item.archivoId}" paginator="true"
						rows="5" paginatorPosition="bottom"
						paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
						scrollable="true" scrollWidth="100%" style="width:100%;">
						<f:facet name="header">
			            Archivos Digitales cargados
			        </f:facet>
						<p:column headerText="Nombre Archivo" styleClass="txtL"
							width="30%">
							<p:outputLabel value="#{item.nombre}" />
						</p:column>
						<p:column headerText="Fecha" styleClass="txtL" width="20%">
							<p:outputLabel value="#{item.fechaIngreso}">
								<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
							</p:outputLabel>
						</p:column>
						<p:column headerText="Descargar" width="10%"
							style="text-align:center">
							<p:commandLink id="downloadLink" value="Descargar" ajax="false"
								icon="ui-icon-arrowthichk-s">
								<p:fileDownload
									value="#{controlCertificacionesController.descargarArchivo(item)}" />
							</p:commandLink>
						</p:column>
					</p:dataTable>
				</p:tab>
				<p:tab id="tabArcCertificacion" title="Archivos Certificaciones">

					<p:fileUpload id="btnArchivo" required="true"
						widgetVar="btnArchivoWidgetVar"
						fileUploadListener="#{controlCertificacionesController.guardarArchivoDigital}"
						mode="advanced" dragDropSupport="true" multiple="true"
						allowTypes="/(\.|\/)(jpe?g|png|doc|docx|pdf)$/"
						invalidFileMessage="Formato de archivo no válido" process="@this"
						update="archivosDT" label="Seleccionar" cancelLabel="Cancelar"
						uploadLabel="Cargar" />
					<p:spacer />

					<p:dataTable id="certificacionDT" widgetVar="wvCertificacionDT"
						value="#{controlCertificacionesController.listaArchivosDigitales}"
						var="item"
						emptyMessage="No hay archivos cargados para esta certificacion"
						rowIndexVar="index" rowKey="#{item.archivoId}" paginator="true"
						rows="5" paginatorPosition="bottom"
						paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
						scrollable="true" scrollWidth="100%" style="width:100%;">
						<f:facet name="header">
			            Archivos Digitales Certificaciones
			        </f:facet>
						<p:column headerText="Nombre Archivo" styleClass="txtL"
							width="30%">
							<p:outputLabel value="#{item.nombre}" />
						</p:column>
						<p:column headerText="Fecha" styleClass="txtL" width="20%">
							<p:outputLabel value="#{item.fecha}">
								<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
							</p:outputLabel>
						</p:column>
						<p:column headerText="Descargar" styleClass="txtC" width="50%">
							<h:commandLink id="seeFoto"
								action="#{controlCertificacionesController.verArchivo}"
								target="_blank">
								<p:graphicImage value="/images/dynamic?file=#{item.archivo}"
									style="display: block; margin: 0px auto;" height="100"
									width="150" />
								<f:setPropertyActionListener value="#{item.path}"
									target="#{controlCertificacionesController.urlArchivo}" />
							</h:commandLink>
						</p:column>
						<ui:remove>
							<p:column headerText="Eliminar"
								style="width:75px;text-align: center">
								<p:commandButton id="btnEliminarArchivo" icon="ui-icon-trash"
									process="@this" oncomplete="PF('diaEliArchivo').show();"
									style="width:16px;height:16px;">
									<f:setPropertyActionListener value="#{item}"
										target="#{controlCertificacionesController.archivoSel}" />
								</p:commandButton>
							</p:column>
						</ui:remove>
					</p:dataTable>
				</p:tab>
			</p:tabView>

		</p:panel>

		<p:dataTable id="tblDetalle" var="item" rowIndexVar="row"
			widgetVar="tblDetalle"
			rowStyleClass="#{item.estado eq 'R' ? 'aprobado' : null or item.estado eq 'O' ? 'negado' : null}"
			value="#{controlCertificacionesController.listDetallesCriterios}"
			rowKey="#{item.codigo}" emptyMessage="No existe detalle del Ajuste"
			paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {Exporters}">
			<f:facet name="header">
				<h:outputLabel value="Lista Criterios Certificacion" />
			</f:facet>
			<p:column headerText="No." style="text-align:left;" width="1%">
				<p:outputLabel value="#{row + 1}" />
			</p:column>
			<p:column headerText="Criterio Certificacion" width="40%">
				<p:outputLabel value="#{item.criterio}" style="width:100%;" />
			</p:column>
			<p:column headerText="Certifica" width="10%">
				<p:selectOneMenu value="#{item.aprobado}" filter="true"
					filterMatchMode="contains">
					<f:selectItem itemLabel="Seleccione" itemValue=""
						noSelectionOption="true" />
					<f:selectItem itemLabel="Si" itemValue="SI" />
					<f:selectItem itemLabel="No" itemValue="NO" />
					<f:selectItem itemLabel="N/A" itemValue="NA" />
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="Observacion" width="40%">
				<p:inputTextarea onkeyup="mayus(this)" value="#{item.observacion}"
					style="width:100%;" maxlength="500" />
			</p:column>
		</p:dataTable>
	</p:panelGrid>
</ui:composition>
