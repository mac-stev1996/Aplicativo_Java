<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core"
	template="/jsf/templates/bodyTemplate.xhtml">

	<ui:define name="title">
		<h:outputText value="Aceptación Funcional de Requerimientos"></h:outputText>
	</ui:define>

	<ui:define name="content">

		<style type="text/css">
.select {
	background-color: white;
	color: #212121;
	max-height: 20px;
	right: 10%;
	top: 5px;
}
</style>
		<script type="text/javascript">
			function mayus(e) {
				e.value = e.value.toUpperCase();
			}
		</script>
		<div class="ui-g dashboard">
			<div class="ui-g-12 ui-fluid contact-form">
				<div class="ui-g-11" style="background-color: white;">

					<h:form id="form">

						<div class="ui-lg-12 ui-md-12 ui-g-12">
							<br />
							<center>
								<p:panel header="AVISO"
									style="width:80%; font-weight: bold; font-size: 2em !important; text-align: center;"
									rendered="#{!aceptacionFuncionalController.muestraMensaje}">
									<h1
										style="font-weight: bold; text-align: center; min-height: 0 !important; font-size: 2.4em;">Gracias</h1>
									<br />
									<p:outputLabel
										style="text-align: center; min-height: 0 !important; font-size: 1em !important;"
										value="La Aprobación Funcional del requerimiento: #{aceptacionFuncionalController.requerimiento.solicitudId}, ya fue registrada con éxito." />
								</p:panel>
							</center>

							<p:panel header="APROBACION DE REQUERIMIENTOS"
								style="width:100%; font-size: 1.5em !important;"
								rendered="#{aceptacionFuncionalController.muestraMensaje}">

								<div class="ui-lg-12 ui-md-12 ui-g-12"
									style="width: 100%; align: center">
									<p:fieldset
										rendered="#{aceptacionFuncionalController.muestraMensaje}"
										legend="Tarea/ Requerimiento:" style="width:98%">
										<center>
											<h:panelGrid id="idReq" columns="2">
												<label>Codigo:</label>
												<p:outputLabel id="txtCodigo" style="font-weight: bold;"
													value="#{aceptacionFuncionalController.requerimiento.solicitudId}" />
												<label>Descripcion:</label>
												<p:outputLabel id="txtReferencia"
													style="font-weight: bold; "
													value="#{aceptacionFuncionalController.requerimiento.referencia}" />
												<label>Fecha Solic:</label>
												<p:outputLabel id="txtFechSol" readonly="true"
													style="font-weight: bold;"
													value="#{aceptacionFuncionalController.requerimiento.fechaSolicitud}" />
											</h:panelGrid>
										</center>
									</p:fieldset>
								</div>
								<br />
								<div class="ui-lg-6 ui-md-6	ui-g-12">
									<p:fieldset
										rendered="#{aceptacionFuncionalController.muestraMensaje}"
										legend="Solicitado Por:" style="width:95%">

										<h:panelGrid id="idSolicitante" columns="2">
											<label>Solicitante:</label>
											<p:inputText id="txtSolicitante" readonly="true"
												style="font-weight: bold; text-align: center; min-height: 0 !important; font-size: 1em !important;"
												value="#{aceptacionFuncionalController.usuarioSolicitante.nombre}" />

											<label>Email:</label>
											<p:outputLabel id="txtMailSol" readonly="true"
												style="font-weight: bold; text-align: center; min-height: 0 !important; font-size: 1em !important;"
												value="#{aceptacionFuncionalController.usuarioSolicitante.email}" />
										</h:panelGrid>
									</p:fieldset>
								</div>
								<br />
								<div class="ui-lg-6 ui-md-6	ui-g-12">
									<p:fieldset
										rendered="#{aceptacionFuncionalController.muestraMensaje}"
										legend="Atendido Por:" style="width:95%">
										<h:panelGrid id="idResponsable" columns="2">
											<label>Responsable:</label>
											<p:inputText id="txtResponsable" readonly="true"
												style="font-weight: bold; text-align: center; min-height: 0 !important; font-size: 1em !important;"
												value="#{aceptacionFuncionalController.usuarioResponsable.nombre}" />
											<label>Email:</label>
											<p:inputText id="txtMailRes" readonly="true"
												style="font-weight: bold; text-align: center; min-height: 0 !important; font-size: 1em !important;"
												value="#{aceptacionFuncionalController.usuarioResponsable.email}" />
										</h:panelGrid>
									</p:fieldset>
								</div>
								<br />
								<h:panelGrid id="idPanAprobacion" columns="1">
									<p:outputLabel
										style="font-weight: bold; text-align: center; font-size: 0.9em !important;"
										value="¿Esta de acuerdo con la aprobacion funcional del requerimiento: #{aceptacionFuncionalController.requerimiento.solicitudId}, para pasar a Control de Calidad y su posterior paso a PRODUCCION?" />
								</h:panelGrid>
								<br />
								<center>
									<h:panelGrid columns="2" style="width:40%">
										<p:commandButton value="SI" styleClass="green-btn"
											icon="fa fa-thumbs-o-up"
											action="#{aceptacionFuncionalController.aceptacionFuncional}"
											onclick="PF('diaAviso').show();"
											oncomplete="javascript: setTimeout('window.close()',4000)" />
										<p:commandButton value="NO" styleClass="red-btn"
											icon="fa fa-thumbs-o-down"
											onclick="PF('diaNegacion').show();" />
									</h:panelGrid>
								</center>
							</p:panel>
							<f:facet name="footer">
								<h:inputText styleClass="normal" style="font-weight:bold"
									value="Copyright Centric - Ecuador IT © 2024 All rights reserved.">
								</h:inputText>
							</f:facet>
							<!-- Cuadro de Dialogo para mostrar notificacion de aceptacion funcional -->
							<p:dialog widgetVar="diaAviso" modal="true" closable="true"
								header="NOTIFICACION DE APROBACION FUNCIONAL" id="diaAviso"
								showEffect="fade" hideEffect="fade" closeOnEscape="true"
								position="top center" width="600px" height="100px"
								resizable="false">
								<br />
								<h:panelGrid columns="1"
									style="text-align:center;width:100%;font-weight: bold; font-size: 2em !important;">
									<p:outputLabel
										value="La Aceptacion Funcional ha sido registrada exitosamente." />
								</h:panelGrid>
							</p:dialog>

							<!-- Cuadro de Dialogo para mostrar notificacion de negacion funcional -->
							<p:dialog widgetVar="diaAvisoNo" modal="true" closable="true"
								header="NOTIFICACION DE NO APROBACION FUNCIONAL" id="diaAvisoNo"
								showEffect="fade" hideEffect="fade" closeOnEscape="true"
								position="top center" width="600px" height="100px"
								resizable="false">
								<br />
								<h:panelGrid columns="1"
									style="width:100%;font-weight: bold; font-size: 2em !important; text-align: center;">
									<p:outputLabel
										value="Gracias su comentario ha sido registrado exitosamente." />
								</h:panelGrid>
							</p:dialog>

							<!-- Cuadro de Dialogo para mostrar notificacion de negacion funcional-->
							<p:dialog widgetVar="diaNegacion" modal="true" closable="true"
								header="COMENTARIO NEGACION APROBACION FUNCIONAL"
								id="diaNegacion" showEffect="fade" hideEffect="fade"
								closeOnEscape="true" position="top center" width="500px"
								height="200px" resizable="false">
								<br />
								<h:panelGrid id="pnlGriObservacion" columns="2"
									style="text-align:center;width:100%">
									<p:outputLabel for="txaObs" value="Comentario:"
										styleClass="normal" />
									<h:panelGroup>
										<p:inputTextarea id="txaObs" maxlength="1000"
											onkeyup="mayus(this)"
											style="width:300px!important; height:80px!important;"
											value="#{aceptacionFuncionalController.requerimiento.observacionFuncional}"
											resizable="false" counter="display"
											counterTemplate="{0} caracteres restantes." />
										<br />
										<h:outputText id="display" />
									</h:panelGroup>

									<p:commandButton styleClass="red-btn"
										icon="fa fa-thumbs-o-down" id="btnNegar" partialSubmit="true"
										value="Negar Aprobación Funcional"
										action="#{aceptacionFuncionalController.negarAceptacionFuncional}"
										onclick="javascript: setTimeout('window.close()',4000)" />
								</h:panelGrid>
							</p:dialog>
						</div>
					</h:form>
				</div>
			</div>
		</div>
	</ui:define>

</ui:composition>
