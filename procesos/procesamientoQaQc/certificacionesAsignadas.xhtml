<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core">

	<p:panelGrid columns="1" id="pgListaGeneral" width="100%" layout="grid"
		columnClasses="ui-grid-col-12">

		<p:panel style="display: flex; justify-content: flex-end;"
			rendered="#{certificacionesAsignadasController.pantalla eq 'ASIGNADAS'}"
			styleClass="noborder">
			<p:panelGrid columns="8" id="pgBusqueda" width="100%" layout="grid">

				<p:outputLabel value="Certificación Obligatoria:" />
				<p:selectOneMenu
					value="#{certificacionesAsignadasController.certificacionB.opcionCertifica}"
					filter="true" filterMatchMode="contains">
					<f:selectItem itemLabel="Seleccione" itemValue=""
						noSelectionOption="true" />
					<f:selectItem itemLabel="Si" itemValue="S" />
					<f:selectItem itemLabel="No" itemValue="N" />
				</p:selectOneMenu>
				<p:outputLabel value="Solicitado por:" />
				<p:selectOneMenu
					value="#{certificacionesAsignadasController.certificacionB.solicitante}"
					filter="true" filterMatchMode="contains">
					<f:selectItem itemLabel="Seleccione un Solicitante" itemValue=""
						noSelectionOption="true" />
					<f:selectItems
						value="#{certificacionesAsignadasController.listaUsuSolicitantes}"
						var="sol" itemLabel="#{sol.nombre}" itemValue="#{sol.usuario}" />
				</p:selectOneMenu>
				<p:outputLabel value="Estado:" />
				<p:selectOneMenu
					value="#{certificacionesAsignadasController.certificacionB.estado}"
					filter="true" filterMatchMode="contains">
					<f:selectItem itemLabel="Seleccione" itemValue=""
						noSelectionOption="true" />
					<f:selectItem itemLabel="Ingresado" itemValue="I" />
					<f:selectItem itemLabel="En proceso" itemValue="P" />
					<f:selectItem itemLabel="Certificado" itemValue="R" />
					<f:selectItem itemLabel="No Certificado" itemValue="O" />
				</p:selectOneMenu>
				<p:outputLabel for="noRequerimiento" value="No. Requerimiento:" />
				<p:inputNumber id="noRequerimiento"
					value="#{certificacionesAsignadasController.certificacionB.solicitudNo}"
					decimalPlaces="0" thousandSeparator="" decimalSeparator="" size="8" />
				<p:outputLabel for="fechaDesdeB" value="Fecha Doc. desde:" />
				<p:calendar id="fechaDesdeB" navigator="true"
					value="#{certificacionesAsignadasController.certificacionB.fechaDesde}"
					showOn="button" pattern="dd/MM/yyyy" style="width:100% !important">
				</p:calendar>

				<p:outputLabel for="fechaHastaB" value="Fecha Doc. hasta:" />
				<p:calendar id="fechaHastaB" navigator="true"
					value="#{certificacionesAsignadasController.certificacionB.fechaHasta}"
					showOn="button" pattern="dd/MM/yyyy" style="width:100% !important">
				</p:calendar>

				<p:commandButton value="Buscar" icon="ui-icon-search"
					process="@this :#{p:component('pgBusqueda')}"
					action="#{certificacionesAsignadasController.consultaCertificaciones}"
					update="tabCertifica">
				</p:commandButton>
			</p:panelGrid>

			<p:dataTable id="tabCertifica" widgetVar="tabCertifica" var="item" rowIndexVar="row"
				value="#{certificacionesAsignadasController.certificacionLazyDataModel}"
				lazy="true" rows="#{certificacionesAsignadasController.batchSize}"
				emptyMessage="No hay registros" paginator="true"
				paginatorPosition="bottom" rowsPerPageTemplate="25,50,100"
				paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
				rowKey="#{item.codigo}" styleClass="table"
				scrollable="true" scrollWidth="100%" style="width:100%;"
				editable="true" editMode="cell">
				<f:facet name="header">
			            LISTA DE CERTIFICACIONES
			        </f:facet>
				<p:column headerText="No" width="3%">
					<p:commandLink value="#{item.codigo}"
						actionListener="#{certificacionesAsignadasController.editar(item)}"
						update="@form" />
				</p:column>

				<p:column headerText="Cert. Oblig." width="5%"
				          styleClass="#{item.opcionCertifica eq 'S' ? 'aprobado' : item.opcionCertifica eq 'N' ? 'negado' : ''}">
				    <h:outputLabel 
						value="#{item.opcionCertifica eq null ? '-': 'N/A' or item.opcionCertifica eq 'S' ? 'SI': 'N/A' or item.opcionCertifica eq 'N' ? 'NO': 'N/A' }" />
				</p:column>

				<p:column headerText="No. Req" width="4%">
					<h:outputLabel value="#{item.solicitudNo}" />
				</p:column>

				<p:column headerText="Titulo" width="10%">
					<h:outputLabel value="#{item.requerimiento.referencia}" />
				</p:column>

				<p:column headerText="Solicitante" width="4%">
					<h:outputLabel value="#{item.solicitante}" />
				</p:column>

				<p:column headerText="Fecha Solcitud" width="5%">
					<h:outputLabel value="#{item.fecha}">
						<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
					</h:outputLabel>
				</p:column>

				<p:column headerText="Fecha Inicio" width="5%">
					<h:outputLabel value="#{item.fechaAsignacion}">
						<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
					</h:outputLabel>
				</p:column>

				<p:column headerText="Fecha Fin" width="5%">
					<h:outputLabel value="#{item.fechaRespuesta}">
						<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
					</h:outputLabel>
				</p:column>

				<p:column headerText="QC Responsable" width="4%">
					<h:outputLabel value="#{item.responsable}" />
				</p:column>

				<p:column headerText="Estado" width="4%">
					<h:outputLabel
							value="#{item.estado eq 'I'?'Ingresado':'-' or item.estado eq 'P'?'En Proceso':'Ingresado' or item.estado eq 'R'?'Certificado':'En Proceso' or item.estado eq 'O'?'No Certificado':'Certificado'}" />
				</p:column>

				<p:column headerText="Prioridad" width="4%">
					<h:outputLabel value="#{item.prioridadCertifica}" />
				</p:column>

				<p:column headerText="URL" width="10%">
					<h:outputLabel value="#{item.requerimiento.ramaGit}" />
				</p:column>

			</p:dataTable>
		</p:panel>
	</p:panelGrid>
</ui:composition>
