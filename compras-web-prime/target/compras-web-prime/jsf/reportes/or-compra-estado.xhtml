<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/jsf/templates/bodyTemplate.xhtml">

	<ui:define name="title">
		Ordenes de Compra por Estado
	</ui:define>

	<ui:define name="buttons">

	</ui:define>

	<ui:define name="content">
		<h:form id="frmPrincipal">
			<p:panelGrid columns="2">
				<p:outputLabel value="Fecha Desde:"></p:outputLabel>
				<p:calendar value="#{orCompraEstadoReporteCtrl.fechaInicio}"
					required="true" showOn="button"></p:calendar>
				<p:outputLabel value="Fecha Hasta:"></p:outputLabel>
				<p:calendar value="#{orCompraEstadoReporteCtrl.fechaFin}"
					required="true" showOn="button"></p:calendar>
				<p:outputLabel></p:outputLabel>
				<p:commandButton icon="ui-icon ui-icon-save" title="Generar Excel"
					ajax="false"
					action="#{orCompraEstadoReporteCtrl.generarReporteExcel}" />
			</p:panelGrid>
		</h:form>

		
	</ui:define>
</ui:composition>
