<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jstl/core">

<ui:param name="bean" value="#{bean}" />

<h:head>
	<h:outputScript name="js/nanoscroller.js" library="serenity-layout" />
	<h:outputScript name="js/layout.js" library="serenity-layout" />
	<h:outputScript name="js/ripple.js" library="serenity-layout" />
	<title><ui:insert name="title">S3S</ui:insert></title>

	<style type="text/css">
body, .ui-inputfield {
	font-size: 12px !important;
}

body .ui-toolbar {
	padding: 5px;
}

.dummy {
	
}

.w10 {
	width: 10%;
}

.w20 {
	width: 20%;
}

.w30 {
	width: 30%;
}

.w40 {
	width: 40%;
}

.w50 {
	width: 50%;
}

.w60 {
	width: 60%;
}

.w70 {
	width: 70%;
}

.w80 {
	width: 80%;
}

.w90 {
	width: 90%;
}

.w100 {
	width: 100%;
}

.ui-fileupload-buttonbar {
	background-color: transparent !important;
}

.tbl-header-height thead th {
	height: 35px !important;
}

.txtR {
	text-align: right;
}

.txtL {
	text-align: left;
}

.txtC {
	text-align: center;
}

.number {
	text-align: right;
}

.bold {
	font-weight: bold
}

#toolbar>.ui-toolbar-group-right {
	display: flex !important;
}

.impresoras {
	background-color: white;
	color: #212121;
	max-height: 20px;
	right: 10%;
	top: 5px;
}
</style>

	<script type="text/javascript">
		PrimeFaces.locales["es"] = {
			    closeText: "Cerrar",
			    prevText: "Anterior",
			    nextText: "Siguiente",
			    monthNames: ["Enero","Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"],
			    monthNamesShort: ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"],
			    dayNames: ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"],
			    dayNamesShort: ["Dom", "Lun", "Mar", "Mie", "Jue", "Vie", "Sab"],
			    dayNamesMin: ["Do", "Lu", "Ma", "Mi", "Ju", "Vi", "Sa"],
			    weekHeader: "Semana",
			    firstDay: 0,
			    isRTL: false,
			    showMonthAfterYear: false,
			    yearSuffix: "",
			    timeOnlyTitle: "Solo hora",
			    timeText: "Tiempo",
			    hourText: "Hora",
			    minuteText: "Minuto",
			    secondText: "Segundo",
			    currentText: "Fecha actual",
			    ampm: false,
			    month: "Mes",
			    week: "Semana",
			    day: "Día",
			    allDayText : "Todo el día"
			};

		function openDuplicatedTab(url){
			var win = window.open(url, '_blank');
			win.focus();
			close();
			return false;
		}
		
</script>

</h:head>

<h:body>
	<h:outputStylesheet name="css/layout-lightblue.css"
		library="serenity-layout" />



	<ui:insert name="status">
		<p:ajaxStatus onstart="PF('statusDialog').show()"
			onsuccess="PF('statusDialog').hide()"
			onerror="PF('statusDialog').hide()" />

		<p:dialog widgetVar="statusDialog" modal="true" draggable="false"
			closable="false" resizable="false" showHeader="false">
			<h:graphicImage value="/common/imgs/gifs/ajaxloadingbar.gif" />
		</p:dialog>
	</ui:insert>

	<p:growl id="idGrowl" life="5000" showDetail="true" autoUpdate="true"></p:growl>

	<p:toolbar id="toolbar">
		<f:facet name="left">
			<h:outputLabel style="font-size: 15px;">
				<ui:insert name="title">S3S</ui:insert>
			</h:outputLabel>
		</f:facet>
		<f:facet name="right">
			<c:if test="#{bean.habilitaListaImpresoras}">
				<p:selectOneMenu value="#{bean.impresoraSeleccionada}"
					styleClass="impresoras">
					<f:selectItem itemLabel="Seleccione Impresora" itemValue="" />
					<f:selectItems value="#{bean.listaImpresorasEtiquetas}" var="i"
						itemLabel="#{i.texto1}" itemValue="#{i.texto1}" />
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectOneMenu>
			</c:if>
			<ui:insert name="buttons" />
		</f:facet>
	</p:toolbar>

	<ui:insert name="content" />

</h:body>
</html>
